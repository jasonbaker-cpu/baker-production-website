<div class="app">
  <header>
    <div class="brand"><h1>Baker Aerial Editor</h1><span>Drone finish, pins, lot boundaries</span></div>
    <div class="group">
      <button class="btn" id="daysBtn" title="Open a job from a previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Previous days</button>
      <button class="btn" id="addBtn" title="Add photos (or drop / paste them)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add photos</button>
      <button class="btn icon ghost" id="undoBtn" title="Undo (⌘Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="btn icon ghost" id="redoBtn" title="Redo (⇧⌘Z)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    </div>
    <div class="group">
      <button class="btn" id="exportAllBtn" title="Export every photo as a ZIP">Export all</button>
      <button class="btn primary" id="exportBtn">Export photo</button>
    </div>
    <input type="file" id="fileIn" accept="image/jpeg,image/png,image/webp" multiple hidden>
    <input type="file" id="jobIn" accept=".json,.html,.htm,application/json,text/html" hidden>
    <input type="file" id="metaIn" accept="image/jpeg" hidden>
    <input type="file" id="logoIn" accept="image/png,image/svg+xml,image/webp,image/jpeg" hidden>
  </header>

  <div class="main">
    <nav class="rail" aria-label="Tools">
      <button class="tool" data-tool="select" title="Select & move (V)" aria-label="Select"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3l14 8-6 2-3 6z"/></svg><kbd>V</kbd></button>
      <button class="tool" data-tool="pin" title="Add custom pin (P)" aria-label="Add custom pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 22s7-7.2 7-12.5A7 7 0 0 0 5 9.5C5 14.8 12 22 12 22z"/><circle cx="12" cy="9.5" r="2.5"/></svg><kbd>P</kbd></button>
      <button class="tool" data-tool="poly" title="Draw lot boundary (B)" aria-label="Draw boundary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7l9-4 7 7-3 10-12-2z"/><circle cx="4" cy="7" r="1.6" fill="currentColor"/><circle cx="13" cy="3" r="1.6" fill="currentColor"/><circle cx="20" cy="10" r="1.6" fill="currentColor"/></svg><kbd>B</kbd></button>
      <button class="tool" data-tool="line" title="Add line (L)" aria-label="Add line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19 10 9l4 5 6-10"/></svg><kbd>L</kbd></button>
      <button class="tool" data-tool="text" title="Add text (T)" aria-label="Add text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg><kbd>T</kbd></button>
      <hr>
      <button class="tool" id="hideBtn" title="Hide graphics to check the photo (H)" aria-label="Hide graphics" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><kbd>H</kbd></button>
    </nav>

    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hint"><span class="pill" id="hint"></span><span class="pill sample" id="sampleTag" hidden>Sample photo — add your own</span></div>
      <div class="drawbar" id="drawbar" hidden>
        <button class="btn" id="finishBtn">Finish</button>
        <button class="btn ghost" id="cancelBtn">Cancel</button>
      </div>
      <button class="btn fixjump" id="fixJump" hidden>Fix boundary</button><button class="navbtn" id="prevImg" title="Previous photo ([)" aria-label="Previous photo">‹</button><button class="navbtn" id="nextImg" title="Next photo (])" aria-label="Next photo">›</button><div class="navcount" id="navCount"></div>
      <button class="btn compare" id="beforeBtn" title="Hold to see the photo before the Baker finish">Hold for before</button>
      <div class="zoom">
        <button class="btn icon" id="zoomOut" aria-label="Zoom out">−</button>
        <output id="zoomVal">100%</output>
        <button class="btn icon" id="zoomIn" aria-label="Zoom in">+</button>
        <button class="btn" id="fitBtn" style="font-size:12px">Fit</button>
      </div>
      <div class="busy" id="busy" hidden>Finishing photo…</div>
      <div class="drop" id="drop" hidden>Drop drone photos or the amenity map</div>
    </div>

    <aside class="panel" id="panel">
      <div class="tabs" role="tablist" aria-label="Panels">
        <button role="tab" data-tab="pins" id="tabBtnPins">Pins</button>
        <button role="tab" data-tab="boundary" id="tabBtnBoundary">Boundary</button>
        <button role="tab" data-tab="photo" id="tabBtnPhoto">Photo</button>
      </div>
      <section class="sec" id="selSec" hidden></section>
      <div id="tabPins" role="tabpanel"></div>
      <div id="tabBoundary" role="tabpanel"></div>
      <div id="tabPhoto" role="tabpanel"></div>
    </aside>
  </div>

  <div class="strip" id="strip"></div>
</div>
