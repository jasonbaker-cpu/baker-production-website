<html lang="en-AU"><head><meta charset="utf-8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: editor shell — tool rail | photo stage | inspector, photo strip along the bottom. Single dark look, like a darkroom. */
:root{
  --bg:#121417; --panel:#1a1d22; --panel-2:#22262c; --line:#2e333b;
  --fg:#e8e6e1; --muted:#9298a1; --accent:#f2b33d; --accent-ink:#1b1408; --danger:#ff6b5b; --ok:#6fd3a0;
  --ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --display:"Archivo", "IBM Plex Sans", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:13px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;gap:10px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.01em;margin:0;white-space:nowrap}
.brand span{color:var(--muted);font-size:12px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#454c56}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.wide{flex:1;justify-content:center}
.btn.armed{outline:2px solid var(--accent);outline-offset:1px}
.btn svg{width:16px;height:16px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.main{display:grid;grid-template-columns:52px minmax(0,1fr) 310px;gap:10px;min-height:0}
.rail{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px}
.tool{position:relative;width:38px;height:38px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.tool svg{width:19px;height:19px}
.tool:hover{color:var(--fg);background:var(--panel-2)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool kbd{position:absolute;right:3px;bottom:1px;font:500 8px var(--mono);opacity:.6}
.rail hr{width:100%;border:0;border-top:1px solid var(--line);margin:4px 0}
.stage{position:relative;border-radius:10px;overflow:hidden;background:#0b0c0e;border:1px solid var(--line);min-height:0;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none;flex-wrap:wrap}
.hint .pill{pointer-events:auto;background:rgba(18,20,23,.85);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--fg)}
.hint .pill.sample{color:var(--accent);border-color:rgba(242,179,61,.4)}
.hint .pill.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;background:rgba(18,20,23,.85);border:1px solid var(--line);border-radius:9px;padding:4px;align-items:center}
.zoom .btn{height:28px;border:0;background:transparent}
.zoom .btn.icon{width:28px}
.zoom output{font:500 11px var(--mono);color:var(--muted);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
.compare{position:absolute;left:10px;bottom:10px}
.drawbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(18,20,23,.9);border:1px solid var(--line);border-radius:10px;padding:5px}
.drop{position:absolute;inset:0;display:grid;place-items:center;background:rgba(242,179,61,.12);border:2px dashed var(--accent);border-radius:10px;font-family:var(--display);font-weight:700;font-size:18px;color:var(--accent);pointer-events:none}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,12,14,.55);font-weight:600;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;min-height:0;display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{flex:1;border:0;background:transparent;padding:11px 6px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12.5px}
.tabs button[aria-selected="true"]{color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.sec{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec:last-child{border-bottom:0}
.sec h2{margin:0;font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row label.lbl{flex:none;width:80px;color:var(--muted)}
.row > :not(.lbl){min-width:0}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
input[type=text],input[type=number],textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
textarea{resize:vertical;min-height:54px;line-height:1.35}
input[type=color]{width:30px;height:26px;border:1px solid var(--line);border-radius:6px;background:none;padding:1px;flex:none;cursor:pointer}
.val{font:500 11px var(--mono);color:var(--muted);width:40px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px;flex:none}
.note{color:var(--muted);font-size:12px;line-height:1.45;margin:0}
.note b{color:var(--fg);font-weight:600}
.warn{border:1px solid rgba(255,107,91,.45);background:rgba(255,107,91,.08);border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.45;display:flex;flex-direction:column;gap:8px}
.good{color:var(--ok)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.step i{width:20px;height:20px;border-radius:50%;border:1.5px solid #59606b;display:grid;place-items:center;font:600 11px var(--mono);font-style:normal;color:var(--muted)}
.step.done i{background:var(--ok);border-color:var(--ok);color:#0d2a1c}
.step.now i{border-color:var(--accent);color:var(--accent)}
.step div{display:flex;flex-direction:column;gap:6px;min-width:0}
.step .btn{flex:none}
.step .row .btn{flex:none}
.places{display:flex;flex-direction:column;gap:2px;max-height:330px;overflow:auto;margin:0 -4px}
.place{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 6px;border-radius:6px;cursor:pointer;text-align:left;border:1px solid transparent;background:transparent;width:100%}
.place:hover{background:var(--panel-2)}
.place[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.place[aria-pressed="true"] .box::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.place .box{position:relative;width:15px;height:15px;border:1.5px solid #59606b;border-radius:4px}
.place .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place .nm small{display:block;color:var(--muted);font-size:11px}
.place .d{font:500 11px var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.place.off .d{color:#c98a5a}
.grp{font:600 10.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 6px 2px}
.badge{display:inline-block;font:600 9.5px var(--ui);letter-spacing:.04em;padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:1px;background:#1f3a2f;color:#7fd8a8}
.badge.u{background:#3a3220;color:#e8c070}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:1}
.seg button{flex:1;border:0;background:transparent;padding:6px 4px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.layers{display:flex;flex-direction:column;gap:3px}
.layer{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;background:transparent;text-align:left;width:100%}
.layer:hover{background:var(--panel-2)}
.layer[aria-current="true"]{border-color:var(--accent);background:var(--panel-2)}
.layer i{width:10px;height:10px;border-radius:2px;flex:none}
.layer span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.layer small{color:var(--muted);font:500 10px var(--mono)}
.edges{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center}
.edges span{font:500 11px var(--mono);color:var(--muted)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;align-items:center;min-height:64px}
.thumb{position:relative;flex:none;height:60px;border-radius:7px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--panel);padding:0}
.thumb img{height:100%;display:block;max-width:none}
.thumb[aria-current="true"]{border-color:var(--accent)}
.thumb .x{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:0;font-size:12px;line-height:18px;cursor:pointer;display:none}
.thumb:hover .x,.thumb:focus-within .x{display:block}
.thumb .n{position:absolute;left:4px;bottom:3px;font:500 10px var(--mono);color:#fff;text-shadow:0 1px 2px #000}
.thumb .st{position:absolute;right:4px;bottom:3px;width:8px;height:8px;border-radius:50%;background:#c98a5a;box-shadow:0 0 0 1.5px rgba(0,0,0,.5)}
.thumb .st.ok{background:var(--ok)}
.addthumb{flex:none;height:60px;width:84px;border-radius:7px;border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:min(900px,100%);max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.modal img{max-width:100%;max-height:65vh;object-fit:contain;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);padding:9px 14px;border-radius:9px;z-index:60;font-size:13px;max-width:calc(100% - 32px)}
@media (max-width:860px){
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:1fr;grid-template-rows:auto 62vh auto}
  .rail{flex-direction:row;flex-wrap:wrap}
  .rail hr{width:1px;height:28px;border-top:0;border-left:1px solid var(--line);margin:5px 2px}
  .panel{overflow:visible}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.step .row select{flex:1;width:auto}
</style>

<div class="app">
  <header>
    <div class="brand"><h1>Baker Aerial Editor</h1><span>Drone finish, pins, lot boundaries</span></div>
    <div class="group">
      <button class="btn" id="addBtn" title="Add photos (or drop / paste them)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add photos</button>
      <button class="btn icon ghost" id="undoBtn" title="Undo (⌘Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="btn icon ghost" id="redoBtn" title="Redo (⇧⌘Z)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    </div>
    <div class="group">
      <button class="btn" id="exportAllBtn" title="Export every photo as a ZIP">Export all</button>
      <button class="btn primary" id="exportBtn">Export photo</button>
    </div>
    <input type="file" id="fileIn" accept="image/jpeg,image/png,image/webp" multiple hidden>
    <input type="file" id="jobIn" accept=".json,.html,.htm,application/json,text/html" hidden>
    <input type="file" id="metaIn" accept="image/jpeg" hidden>
    <input type="file" id="logoIn" accept="image/png,image/svg+xml,image/webp,image/jpeg" hidden>
  </header>

  <div class="main">
    <nav class="rail" aria-label="Tools">
      <button class="tool" data-tool="select" title="Select & move (V)" aria-label="Select"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3l14 8-6 2-3 6z"/></svg><kbd>V</kbd></button>
      <button class="tool" data-tool="pin" title="Add custom pin (P)" aria-label="Add custom pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 22s7-7.2 7-12.5A7 7 0 0 0 5 9.5C5 14.8 12 22 12 22z"/><circle cx="12" cy="9.5" r="2.5"/></svg><kbd>P</kbd></button>
      <button class="tool" data-tool="poly" title="Draw lot boundary (B)" aria-label="Draw boundary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7l9-4 7 7-3 10-12-2z"/><circle cx="4" cy="7" r="1.6" fill="currentColor"/><circle cx="13" cy="3" r="1.6" fill="currentColor"/><circle cx="20" cy="10" r="1.6" fill="currentColor"/></svg><kbd>B</kbd></button>
      <button class="tool" data-tool="line" title="Add line (L)" aria-label="Add line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19 10 9l4 5 6-10"/></svg><kbd>L</kbd></button>
      <button class="tool" data-tool="text" title="Add text (T)" aria-label="Add text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg><kbd>T</kbd></button>
      <hr>
      <button class="tool" id="hideBtn" title="Hide graphics to check the photo (H)" aria-label="Hide graphics" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><kbd>H</kbd></button>
    </nav>

    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hint"><span class="pill" id="hint"></span><span class="pill sample" id="sampleTag" hidden>Sample photo — add your own</span></div>
      <div class="drawbar" id="drawbar" hidden>
        <button class="btn" id="finishBtn">Finish</button>
        <button class="btn ghost" id="cancelBtn">Cancel</button>
      </div>
      <button class="btn compare" id="beforeBtn" title="Hold to see the photo before the Baker finish">Hold for before</button>
      <div class="zoom">
        <button class="btn icon" id="zoomOut" aria-label="Zoom out">−</button>
        <output id="zoomVal">100%</output>
        <button class="btn icon" id="zoomIn" aria-label="Zoom in">+</button>
        <button class="btn" id="fitBtn" style="font-size:12px">Fit</button>
      </div>
      <div class="busy" id="busy" hidden>Finishing photo…</div>
      <div class="drop" id="drop" hidden>Drop drone photos or the amenity map</div>
    </div>

    <aside class="panel" id="panel">
      <div class="tabs" role="tablist" aria-label="Panels">
        <button role="tab" data-tab="pins" id="tabBtnPins">Pins</button>
        <button role="tab" data-tab="boundary" id="tabBtnBoundary">Boundary</button>
        <button role="tab" data-tab="photo" id="tabBtnPhoto">Photo</button>
      </div>
      <section class="sec" id="selSec" hidden></section>
      <div id="tabPins" role="tabpanel"></div>
      <div id="tabBoundary" role="tabpanel"></div>
      <div id="tabPhoto" role="tabpanel"></div>
    </aside>
  </div>

  <div class="strip" id="strip"></div>
</div>

// ================= geometry =================
const DEG = Math.PI/180;
const DIRS = ["N","NE","E","SE","S","SW","W","NW"];
const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
function distSeg(p,a,b){ const dx=b[0]-a[0], dy=b[1]-a[1]; const L=dx*dx+dy*dy; let t=L?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-(a[0]+t*dx), p[1]-(a[1]+t*dy)); }
function inPoly(p, pts){ let c=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const a=pts[i],b=pts[j]; if(((a[1]>p[1])!==(b[1]>p[1])) && (p[0] < (b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])) c=!c; } return c; }
function centroid(pts){ let a=0,cx=0,cy=0; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const f=pts[j][0]*pts[i][1]-pts[i][0]*pts[j][1]; a+=f; cx+=(pts[j][0]+pts[i][0])*f; cy+=(pts[j][1]+pts[i][1])*f; } if(Math.abs(a)<1e-6){ let x=0,y=0; pts.forEach(q=>{x+=q[0];y+=q[1];}); return [x/pts.length,y/pts.length]; } return [cx/(3*a), cy/(3*a)]; }
function polyArea(pts){ let a=0; for(let i=0,j=pts.length-1;i<pts.length;j=i++) a+=pts[j][0]*pts[i][1]-pts[i][0]*pts[j][1]; return Math.abs(a/2); }
function edgesOf(sh){ const n=sh.pts.length; const m = sh.type==="poly" ? n : n-1; const out=[]; for(let i=0;i<m;i++) out.push([sh.pts[i], sh.pts[(i+1)%n]]); return out; }
function geoDist(lat0, lng0, lat, lng){
  const dy = (lat-lat0)*111320, dx = (lng-lng0)*111320*Math.cos(lat0*DEG);
  const d = Math.hypot(dx,dy), b = (Math.atan2(dx,dy)/DEG + 360) % 360;
  return { d, b, dir: DIRS[Math.floor((b+22.5)/45) % 8] };
}
function fmtDist(d){ return d < 1000 ? `${Math.max(10, Math.round(d/10)*10)} m` : `${(d/1000).toFixed(1)} km`; }

// ================= camera =================
// Projection works in ORIGINAL photo pixels (ow × oh); p.k / p.x0 / p.y0 map to the working image.
// cam: {lat,lng,h (m above ground), yaw (° from north), pitch (°, -90 = straight down), roll (°), f35}
function projectOrig(cam, W, H, lat, lng){
  const c0 = Math.cos(cam.lat*DEG);

  const house = p.pins.find(x=>x.house);
  const list = p.pins.filter(x=>!x.house).sort((a,b)=>a.ey-b.ey);   // farthest (top of frame) first: they have the least room
  const ov = (r,q) => { const ox = Math.min(r[2],q[2])-Math.max(r[0],q[0])+gap, oy = Math.min(r[3],q[3])-Math.max(r[1],q[1])+gap; return ox>0 && oy>0 ? ox*oy : 0; };
  const K = boxed ? 16 : 1, st = boxed ? 70*s : step;
  const place = (pin, others) => {
    let best = null;
    for (let k=0;k<K;k++) for (const flip of boxed ? [false] : [false,true]) for (const side of (boxed ? [.5,.25,.75,.08,.92] : pin.sideLocked ? [pin.side] : (flip ? ["right","left","bottom"] : ["right","left","top"]))){
      if (boxed){ pin.off = side; pin.side = "right"; } else pin.side = side;
      pin.flip = flip; pin.lift = k*st;
      const parts = pinParts(p,pin), r = parts[0];
      const mg = 10*s, off = Math.max(0, mg-r[0]) + Math.max(0, r[2]-(p.w-mg)) + Math.max(0, mg-r[1]) + Math.max(0, r[3]-(p.h-mg));
      let o = 0; for (const q of others) for (const a of parts) for (const b of q) o += ov(a,b);
      const score = off*20000 + o*8 + (k*(boxed?3000:9000) + (flip?5000:0))*s*s + (side==="left"?10:side==="top"||side==="bottom"?2500*s*s:0) + (boxed && side!==.5 ? 4000*s*s : 0);
      if (!best || score < best.score) best = { side, flip, lift:pin.lift, score };
    }
    if (boxed){ pin.off = best.side; pin.side = "right"; } else pin.side = best.side;
    pin.flip = best.flip; pin.lift = best.lift;
  };
  const done = house ? [house] : [];
  for (const pin of list){ if (!pin.layoutLocked) place(pin, done.map(q=>pinParts(p,q))); done.push(pin); }
  for (let it=0; it<2; it++) for (const pin of list){ if (pin.layoutLocked) continue; place(pin, p.pins.filter(q=>q!==pin).map(q=>pinParts(p,q))); }

  p.pins.forEach(a=>{ a.clash = false; if (!a.house){ const r = pinParts(p,a)[0]; if (r[0] < -2 || r[2] > p.w+2 || r[1] < -2) a.clash = true; } });   // label hanging off the frame counts as a clash too
  for (const a of p.pins) for (const b of p.pins){ if (a===b) continue; let o=0; for (const x of pinParts(p,a)) for (const y of pinParts(p,b)) { const ox = Math.min(x[2],y[2])-Math.max(x[0],y[0]), oy = Math.min(x[3],y[3])-Math.max(x[1],y[1]); if (ox > -10*s && oy > -10*s) o++; } if (o){ a.clash = b.clash = true; } }
}

// ================= scene =================
function hexA(hex, a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function textMetrics(c, t, p){
  const s = p.w/3000, size = t.size*s;
  const weight = t.style==="area" ? 300 : t.bold ? 700 : 400;
  c.font = `${weight} ${size}px "Source Sans 3", "Segoe UI", sans-serif`;
  const lines = String(t.text||" ").split("\n"), lh = size*1.12;
  let w=0; lines.forEach(l=>{ w=Math.max(w, c.measureText(l).width); });
  const padX = t.style==="pill" ? size*.55 : 0, padY = t.style==="pill" ? size*.3 : 0;
  const bw = w+padX*2, bh = lines.length*lh + padY*2;
  return { size, weight, lines, lh, bw, bh, x:t.x-bw/2, y:t.y-bh/2, padX, padY };
}
function photoImage(p, before){ return (!before && p.finishOn && p.fin) ? p.fin : p.base; }
function blurredCopy(img, w, h, amt){ // cheap, cross-browser blur: shrink then scale back up twice
  const f = Math.max(2, amt/4);
  const a = document.createElement("canvas"); a.width = Math.max(1,Math.round(w/f)); a.height = Math.max(1,Math.round(h/f));
  const ax = a.getContext("2d"); ax.imageSmoothingQuality="high"; ax.drawImage(img,0,0,a.width,a.height);
  const b = document.createElement("canvas"); b.width = Math.max(1,Math.round(w/(f/2))); b.height = Math.max(1,Math.round(h/(f/2)));
  const bx = b.getContext("2d"); bx.imageSmoothingQuality="high"; bx.drawImage(a,0,0,b.width,b.height);
  return b;
}
function drawScene(c, p, opt){
  const img = photoImage(p, opt.before);
  c.drawImage(img, 0, 0, p.w, p.h);
  if (opt.hide) return;
  const s = p.w/3000;
  const polys = p.shapes.filter(x=>x.type==="poly" && x.pts.length>=3);
  if (polys.length && p.outside !== "none"){
    c.save(); c.beginPath(); c.rect(0,0,p.w,p.h);
    polys.forEach(sh=>{ c.moveTo(sh.pts[0][0],sh.pts[0][1]); for(let i=1;i<sh.pts.length;i++) c.lineTo(sh.pts[i][0],sh.pts[i][1]); c.closePath(); });
    c.clip("evenodd");
    if (p.outside === "blur"){
      const key = (opt.before?"b":"a") + p.blurAmt + (p.finishOn?"f":"");
      if (!p._blur || p._blurKey !== key){ p._blur = blurredCopy(img, p.w, p.h, p.blurAmt*s); p._blurKey = key; }
      c.drawImage(p._blur, 0, 0, p.w, p.h);
    } else { c.fillStyle = hexA("#000000", p.darkAmt/100); c.fillRect(0,0,p.w,p.h); }
    c.restore();
  }
  for (const sh of p.shapes){
    if (sh.pts.length<2) continue;
    const w = sh.width*s*3, edges = edgesOf(sh);   // width is per-1000 of 3000 px → ×3
    c.save(); c.strokeStyle = sh.color; c.lineWidth = w; c.lineJoin = "miter"; c.lineCap = "square";
    edges.forEach((e,i)=>{ const dashed = !!(sh.dashed && sh.dashed[i]); c.setLineDash(dashed ? [w*3,w*2.2] : []); c.lineCap = dashed ? "butt" : "square"; c.beginPath(); c.moveTo(e[0][0],e[0][1]); c.lineTo(e[1][0],e[1][1]); c.stroke(); });
    c.restore();
    if (sh.type==="poly" && sh.showLens && sh.lens) drawEdgeLengths(c, p, sh, s);
  }
  for (const t of p.texts){
    if (t.style==="area"){
      const sh = p.shapes.find(x=>x.id===t.link);
      if (sh && t.autoSize !== false) fitAreaText(c, p, t, sh);
    }
    const m = textMetrics(c, t, p);
    c.save(); c.textBaseline="middle"; c.textAlign="center";
    if (t.style==="pill"){ c.fillStyle=t.bg; roundRect(c, m.x, m.y, m.bw, m.bh, m.size*.18); c.fill(); }
    c.font = `${m.weight} ${m.size}px "Source Sans 3", "Segoe UI", sans-serif`;
    m.lines.forEach((l,i)=>{
      const ly = m.y + m.padY + m.lh*(i+.5);
      if (t.style!=="pill"){ c.shadowColor="rgba(0,0,0,.45)"; c.shadowBlur=m.size*(t.style==="area"?.06:.18); c.shadowOffsetY=m.size*.02; }
      c.globalAlpha = t.style==="area" ? 0.95 : 1;
      c.fillStyle=t.color; c.fillText(l, t.x, ly);
    });
    c.restore();
  }
  drawPins(c, p);
  if (p.disc.on && p.disc.text.trim() && p.shapes.length){
    const fs = Math.max(10, 30*s);
    c.save(); c.font=`400 ${fs}px "Source Sans 3", sans-serif`; c.textBaseline="bottom"; c.textAlign="left";
    c.shadowColor="rgba(0,0,0,.8)"; c.shadowBlur=fs*.4; c.fillStyle="rgba(255,255,255,.92)";
    c.fillText(p.disc.text.trim(), 40*s, p.h-30*s); c.restore();
  }
}
function fitAreaText(c, p, t, sh){
  const pts = sh.pts; let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity; pts.forEach(q=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);});
  const s = p.w/3000; const bw = x1-x0, bh = y1-y0;
  c.font = `300 100px "Source Sans 3", sans-serif`; const w100 = c.measureText(t.text||" ").width || 1;
  const byW = 0.5*bw/w100*100, byH = 0.55*bh;
  t.size = Math.max(20, Math.min(byW, byH)/s);
  if (!t.moved){ const ct = centroid(pts); t.x = ct[0]; t.y = ct[1]; }
}
function drawEdgeLengths(c, p, sh, s){
  const fs = 62*s, ct = centroid(sh.pts);
  edgesOf(sh).forEach((e,i)=>{
    const txt = (sh.lens[i]||"").trim(); if (!txt) return;
    const mx=(e[0][0]+e[1][0])/2, my=(e[0][1]+e[1][1])/2;
    let ang = Math.atan2(e[1][1]-e[0][1], e[1][0]-e[0][0]);
    let nx = -(e[1][1]-e[0][1]), ny = (e[1][0]-e[0][0]); const nl = Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
    if ((ct[0]-mx)*nx + (ct[1]-my)*ny > 0){ nx=-nx; ny=-ny; }     // point outward
    if (ang > Math.PI/2) ang -= Math.PI; if (ang < -Math.PI/2) ang += Math.PI;
    if (Math.abs(Math.abs(ang) - Math.PI/2) < 0.35){                // near-vertical: text top faces outward
      ang = nx < 0 ? -Math.PI/2 : Math.PI/2;
    }
    const off = fs*0.85 + sh.width*s*1.5;
    c.save(); c.translate(mx + nx*off, my + ny*off); c.rotate(ang);
    c.font = `400 ${fs}px "Source Sans 3", sans-serif`; c.textAlign="center"; c.textBaseline="middle";
    c.shadowColor="rgba(0,0,0,.7)"; c.shadowBlur=fs*.25; c.fillStyle="#fff"; c.fillText(txt, 0, 0); c.restore();
  });
}

// ================= photo state =================
function newPhoto(name, base, meta, sample){
  const p = { id:nid(), name, base, fin:null, w:base.width, h:base.height, ow:base.width, oh:base.height, k:1, x0:0, y0:0,
    sample:!!sample, thumb:"", meta, cam:makeCam(meta), anchors:[], horizon:null,
    pins:[], shapes:[], texts:[],
    finishOn: !sample && prefs.finish, skyOn: prefs.sky,
    outside: prefs.outside, blurAmt: prefs.blurAmt, darkAmt: prefs.darkAmt,
    disc:{ on:prefs.discOn, text:prefs.discText }, undo:[], redo:[] };

}
const SNAP_KEYS = ["pins","shapes","texts","cam","anchors","finishOn","skyOn","skyKeepReal","outside","blurAmt","darkAmt","disc"];
function snapshotOf(p){ const o={}; SNAP_KEYS.forEach(k=>o[k]=p[k]); return JSON.stringify(o); }
function commit(){ const p=P(); if(!p) return; p.undo.push(snapshotOf(p)); if(p.undo.length>120) p.undo.shift(); p.redo.length=0; updateUndo(); }
function restore(p, s){ const o=JSON.parse(s); SNAP_KEYS.forEach(k=>p[k]=o[k]); ensureFinish(p); }
function undo(){ const p=P(); if(!p||!p.undo.length) return; p.redo.push(snapshotOf(p)); restore(p,p.undo.pop()); sel=null; refreshAll(); }
function redo(){ const p=P(); if(!p||!p.redo.length) return; p.undo.push(snapshotOf(p)); restore(p,p.redo.pop()); sel=null; refreshAll(); }
function updateUndo(){ const p=P(); $("undoBtn").disabled=!p||!p.undo.length; $("redoBtn").disabled=!p||!p.redo.length; }

// ================= finish (async so the page stays responsive) =================
let finishing = 0;
function ensureFinish(p){
  if (!p.finishOn || p.sample) return;
  const key = p.skyOn ? "skyP" : "nosky";
  if (p.fin && p.finKey === key) return;
  if (p._finPending === key) return;
  p._finPending = key; finishing++; $("busy").hidden = false;
  setTimeout(()=>{
    try{ const r = finishImage(p.base, p); p.fin = r.canvas; p.finKey = key; p._blur = null; makeThumb(p); }
    catch(err){ console.error(err); p.finishOn = false; toast("The finish couldn't run on this photo. It's shown unfinished."); }
    p._finPending = null; finishing--; if (!finishing) $("busy").hidden = true;
    refreshStrip(); requestDraw();
  }, 30);
}

// ================= rendering loop =================
let dirty = false;
function requestDraw(){ if(!dirty){ dirty=true; requestAnimationFrame(draw); } }
function draw(){
  dirty=false;
  const dpr = window.devicePixelRatio||1, r = stage.getBoundingClientRect();
  const W = Math.max(1,Math.round(r.width*dpr)), H = Math.max(1,Math.round(r.height*dpr));
  if (cv.width!==W || cv.height!==H){ cv.width=W; cv.height=H; }
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
  const p = P(); if(!p) return;
  ctx.setTransform(view.s*dpr,0,0,view.s*dpr,view.tx*dpr,view.ty*dpr);
  ctx.imageSmoothingQuality="high";
  drawScene(ctx, p, { hide:hideGfx, before:showBefore });
  if (hideGfx || showBefore) return;
  const k = 1/view.s;
  if (sel && sel.kind==="pin"){ const pin = p.pins.find(x=>x.id===sel.id); if (pin){ const r = pinRect(p,pin), pad=6*k; ctx.save(); ctx.strokeStyle="#f2b33d"; ctx.lineWidth=1.6*k; ctx.setLineDash([5*k,4*k]); ctx.strokeRect(r[0]-pad,r[1]-pad,r[2]-r[0]+pad*2,r[3]-r[1]+pad*2); ctx.restore(); } }
  if (sel && sel.kind==="shape"){
    const sh = p.shapes.find(x=>x.id===sel.id);
    if (sh){
      if (sel.edge!=null){ const e=edgesOf(sh)[sel.edge]; if(e){ ctx.save(); ctx.strokeStyle="#f2b33d"; ctx.lineWidth=4*k; ctx.setLineDash([6*k,4*k]); ctx.beginPath(); ctx.moveTo(e[0][0],e[0][1]); ctx.lineTo(e[1][0],e[1][1]); ctx.stroke(); ctx.restore(); } }
      sh.pts.forEach((q,i)=>{ ctx.beginPath(); ctx.arc(q[0],q[1], (sel.vtx===i?7:5.5)*k, 0, Math.PI*2); ctx.fillStyle = sel.vtx===i ? "#f2b33d" : "#fff"; ctx.fill(); ctx.lineWidth=1.6*k; ctx.strokeStyle="#111"; ctx.stroke(); });
    }
  }
  if (sel && sel.kind==="text"){ const t = p.texts.find(x=>x.id===sel.id); if (t){ const m=textMetrics(ctx,t,p); const pad=5*k; ctx.save(); ctx.strokeStyle="#f2b33d"; ctx.lineWidth=1.5*k; ctx.setLineDash([5*k,4*k]); ctx.strokeRect(m.x-pad,m.y-pad,m.bw+pad*2,m.bh+pad*2); ctx.restore(); } }

  p.anchors.forEach(a=>{ const q = toWork(p,[a.ox,a.oy]); ctx.save(); ctx.strokeStyle="#3fd0ff"; ctx.lineWidth=2*k; ctx.beginPath(); ctx.arc(q[0],q[1],10*k,0,7); ctx.moveTo(q[0]-16*k,q[1]); ctx.lineTo(q[0]+16*k,q[1]); ctx.moveTo(q[0],q[1]-16*k); ctx.lineTo(q[0],q[1]+16*k); ctx.stroke(); ctx.restore(); });
  if (draft && draft.pts.length){
    const pts = hover ? draft.pts.concat([hover]) : draft.pts;
    ctx.save(); ctx.strokeStyle=prefs.lineColor; ctx.lineWidth=Math.max(prefs.lineWidth*3*p.w/3000, 2*k);
    ctx.beginPath(); pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.stroke();
    draft.pts.forEach((q,i)=>{ ctx.beginPath(); ctx.arc(q[0],q[1],(i===0&&draft.type==="poly"?8:5)*k,0,Math.PI*2); ctx.fillStyle = i===0 && draft.type==="poly" ? "#f2b33d" : "#fff"; ctx.fill(); ctx.lineWidth=1.5*k; ctx.strokeStyle="#111"; ctx.stroke(); });
    ctx.restore();
  }
}

// ================= view =================
function fit(){ const p=P(); if(!p) return; const r=stage.getBoundingClientRect(); const pad=24; const s=Math.min((r.width-pad*2)/p.w,(r.height-pad*2)/p.h); view.s=s; view.tx=(r.width-p.w*s)/2; view.ty=(r.height-p.h*s)/2; userMoved=false; zoomLabel(); requestDraw(); }
function zoomAt(f, sx, sy){ userMoved=true; const ns=Math.max(0.02,Math.min(8,view.s*f)); const g=ns/view.s; view.tx=sx-(sx-view.tx)*g; view.ty=sy-(sy-view.ty)*g; view.s=ns; zoomLabel(); requestDraw(); }
function zoomLabel(){ $("zoomVal").textContent = Math.round(view.s*100)+"%"; }
function toImg(e){ const r=cv.getBoundingClientRect(); return [ (e.clientX-r.left-view.tx)/view.s, (e.clientY-r.top-view.ty)/view.s ]; }

// ================= places =================
function allPlaces(){
  const out = [];
  if (job) job.places.forEach(q=>out.push(q));
  if (job){ LANDMARKS.forEach(l=>{ const g = geoDist(job.lat, job.lng, l.lat, l.lng); if (g.d < 25000 && !out.some(q=>q.name.toLowerCase()===l.name.toLowerCase())) out.push(Object.assign({}, l, { dist:g.d, dir:g.dir })); }); }
  return out;
}
function placeForKey(key){ return allPlaces().find(q=>q.key===key); }
function iconFor(q){ return iconForPlace(q.name, q.cat) !== "star" ? iconForPlace(q.name, q.cat) : (ICON_BMP[q.icon]||ICONS[q.icon] ? q.icon : "star"); }
function autoPoint(p, lat, lng){ const q = projectW(p, lat, lng); return inFrame(p, q, 2) ? q : null; }
function placePins(p, onlyAuto){
  if (!job) return;
  p.pins.forEach(pin=>{
    if (onlyAuto && pin.moved) return;
    // The house pin goes where the editor clicked the roof (the address point can be ~10 m off the house).
    const ha = pin.house && p.anchors.find(a=>a.key==="__house");
    if (ha){ const q = toWork(p,[ha.ox,ha.oy]); pin.ex = q[0]; pin.ey = q[1]; pin.moved = false; return; }
    const ll = pin.house ? job : placeForKey(pin.key); if (!ll) return;
    const q = autoPoint(p, ll.lat, ll.lng); if (!q) return;
    pin.ex = q[0]; pin.ey = q[1]; pin.moved = false;
  });
  tidySides(p);
}
function addPin(p, opts, at){ const pin = Object.assign({ id:nid(), side:"right", moved:false }, opts, { ex:at[0], ey:at[1] }); p.pins.push(pin); tidySides(p); return pin; }
function togglePlace(key){
  const p = P(); if (!p || !job) return;
  const existing = p.pins.find(x=>x.key===key);
  if (existing){ commit(); p.pins = p.pins.filter(x=>x!==existing); refreshAll(); return; }
  const q = placeForKey(key); if (!q) return;
  const at = autoPoint(p, q.lat, q.lng);
  if (!at){ armed = { kind:"place", key }; setHint(); refreshPinsTab(); toast(p.cam && p.cam.ready ? `${q.name} is outside this photo. Click where it is to pin it anyway.` : `Click where ${q.name} is on the photo`); return; }
  commit(); addPin(p, { key, name:q.name, icon:iconFor(q) }, at); refreshAll();
}
function addHousePin(){
  const p = P(); if (!p) return;
  const at = job ? autoPoint(p, job.lat, job.lng) : null;
  if (!at){ armed = { kind:"housepin" }; setHint(); refreshPinsTab(); toast("Click the house roof to drop the house pin"); return; }
  commit(); p.pins = p.pins.filter(x=>!x.house); addPin(p, { house:true, name:"House" }, at); refreshAll();
}

// ================= pointer interaction =================
let drag = null; const pointers = new Map(); let pinch = null; let spaceDown = false;
function hitTest(pt){
  const p=P(); const k=1/view.s; const tol=8*k;
  if (sel && sel.kind==="shape"){ const sh=p.shapes.find(x=>x.id===sel.id); if (sh){ for(let i=0;i<sh.pts.length;i++) if (dist(pt,sh.pts[i])<tol+3*k) return {kind:"vtx", shape:sh, i}; } }

const LINK_M = 0.201168;
function shapeSection(p, sh){

  cr.querySelector("button").onclick = ()=>{ commit(); sh.color = BAKER_RED; prefs.lineColor = BAKER_RED; savePrefs(); refreshBoundaryTab(); requestDraw(); };
  s.appendChild(cr);
  s.appendChild(slider("shW","Thickness",2,14,0.1,sh.width,v=>v.toFixed(1),v=>{ sh.width=v; prefs.lineWidth=v; savePrefs(); requestDraw(); }, commit));
  if (sh.type!=="poly"){ s.appendChild(delRow(sh)); return s; }

  const ar = el(`<div class="row"><label class="lbl" for="lotSize">Lot size</label><input type="text" id="lotSize" inputmode="decimal" placeholder="from the title, e.g. 769"><span class="val" style="width:auto">m²</span></div>`);
  ar.querySelector("input").value = area && area.lot ? area.lot : "";

    const v = ev.target.value.replace(/m²|m2|sqm/ig,"").trim(); commit();
    let t = p.texts.find(x=>x.link===sh.id);
    if (!v){ if (t) p.texts = p.texts.filter(x=>x!==t); }
    else { if (!t){ t = { id:nid(), link:sh.id, style:"area", color:"#ffffff", size:200, x:0, y:0, autoSize:true }; p.texts.push(t); } t.lot = v; t.text = `${v}m²`; }
    refreshBoundaryTab(); requestDraw();
  };
  s.appendChild(ar);
  // edge lengths
  if (!sh.lens || sh.lens.length !== edgesOf(sh).length) sh.lens = edgesOf(sh).map((_,i)=>(sh.lens&&sh.lens[i])||"");
  const sl = el(`<label class="check"><input type="checkbox" ${sh.showLens?"checked":""}> Show side lengths</label>`);

    inp.onchange = ()=>{ commit(); let v = inp.value.trim(); if (v && /^[\d.]+$/.test(v)) v += "m"; sh.lens[i] = v; refreshBoundaryTab(); requestDraw(); };
    grid.appendChild(inp);
    const ds = el(`<button class="btn ghost" style="height:26px;padding:0 7px;font-size:11px" title="Solid or dashed">${sh.dashed[i]?"dashed":"solid"}</button>`);
    ds.onclick = ()=>{ commit(); sh.dashed[i] = !sh.dashed[i]; refreshBoundaryTab(); requestDraw(); };
    grid.appendChild(ds);
  });
  s.appendChild(grid);
  const chk = lengthCheck(p, sh, area);
  if (chk) s.appendChild(chk);
  s.appendChild(el(`<p class="note">Copy lengths from the Certificate of Title. Old titles (before about 1974) are in <b>links</b>, not metres.</p>`));
  s.appendChild(delRow(sh));

}
function num(v){ const m = String(v||"").match(/[\d.]+/); return m ? parseFloat(m[0]) : NaN; }
// Catches the mistake in our 10 George St final: title lengths in links shown as metres.
function lengthCheck(p, sh, area){
  const edges = edgesOf(sh), vals = sh.lens.map(num);
  const have = vals.map((v,i)=>({ v, px: dist(edges[i][0], edges[i][1]) })).filter(o=>isFinite(o.v) && o.v>0 && o.px>5);
  if (have.length < 2) return null;
  const ratios = have.map(o=>o.v/o.px).sort((a,b)=>a-b), med = ratios[ratios.length>>1];
  const spread = Math.max(...ratios)/Math.min(...ratios);
  const box = el(`<div class="warn"></div>`);
  let warn = false;
  if (spread > 1.35){ warn = true; box.appendChild(el(`<div>The side lengths don't match the shape you drew (one side looks ${spread.toFixed(1)}× off). Check each side's number and that the corners are on the lot.</div>`)); }
  const lot = area ? num(area.lot) : NaN;
  if (isFinite(lot) && lot > 0){
    const est = polyArea(sh.pts) * med * med, r = est/lot;
    if (r > 15 && r < 40){
      warn = true;
      box.appendChild(el(`<div>These lengths give about <b>${Math.round(est).toLocaleString()} m²</b>, but the lot is <b>${lot} m²</b>. That's what you get when lengths in <b>links</b> are shown as metres (1 link = 0.2012 m).</div>`));
      const b = el(`<button class="btn" style="align-self:flex-start">Convert links to metres</button>`);
      b.onclick = ()=>{ commit(); sh.lens = sh.lens.map(v=>{ const n = num(v); return isFinite(n) ? (n*LINK_M).toFixed(1)+"m" : v; }); refreshBoundaryTab(); requestDraw(); toast("Side lengths converted to metres"); };
      box.appendChild(b);
    } else if (r > 1.6 || r < 0.6){ warn = true; box.appendChild(el(`<div>The side lengths give about <b>${Math.round(est).toLocaleString()} m²</b>, but the lot size says <b>${lot} m²</b>. One of them is wrong.</div>`)); }
  }
  if (!warn){ const ok = el(`<p class="note good">Side lengths and lot size agree.</p>`); return isFinite(lot) ? ok : null; }
  return box;
}

function decodeEntities(s){ const t = document.createElement("textarea"); t.innerHTML = s; return t.value; }
function parseJobFile(text){
  let j = null; const tt = text.trim();
  if (tt.startsWith("{")){
    const o = JSON.parse(tt);
    if (typeof o.lat !== "number" || !Array.isArray(o.pins)) throw new Error("This JSON has no property position or pins.");
    j = { address:o.address||"Property", lat:o.lat, lng:o.lng, places:o.pins.map(q=>({ name:q.name, cat:q.cat||"other", lat:q.lat, lng:q.lng, desc:q.desc||"", school:q.school||"" })) };
  } else {
    // both amenity-map generations: "var PROP=[..]; var M=[..]" and "const P=[..], ITEMS=[..]"
    const arrAfter = re => { const m = re.exec(tt); if (!m) return null; let i = m.index + m[0].lastIndexOf("["), d = 0, q = null;
      for (let k=i; k<tt.length; k++){ const ch = tt[k]; if (q){ if (ch === "\\"){ k++; continue; } if (ch === q) q = null; continue; } if (ch === '"' || ch === "'"){ q = ch; continue; } if (ch === "[") d++; else if (ch === "]"){ d--; if (!d) return tt.slice(i, k+1); } } return null; };
    let ps = arrAfter(/\b(?:PROP|P|H)\s*=\s*\[/), ms = arrAfter(/\b(?:M|ITEMS|PINS|PLACES|A|R|pins)\s*=\s*\[\s*\{/);
    if (!ps){ const po = tt.match(/\b(?:PROP|P)\s*=\s*(\{[^}]*\})/); if (po){ const o = JSON.parse(po[1]); ps = JSON.stringify([o.lat, o.lng]); } }
    if (!ps || !ms) throw new Error("That file isn't one of our amenity maps.");
    const prop = JSON.parse(ps), M = JSON.parse(ms).map(q=>Object.assign({}, q, { name: q.name || q.n, badge: q.badge || (q.kind==="zoned" ? "ZONED" : q.kind==="unverified" ? "unverified" : q.kind==="private" ? "private" : "") }));
    const am = tt.match(/<div class="addr">([\s\S]*?)<\/div>/) || tt.match(/<title>([^<–-]+?)\s*[–-]/);
    j = { address: am ? decodeEntities(am[1]).trim() : "Property", lat:prop[0], lng:prop[1],
      places: M.map(q=>({ name:decodeEntities(q.name), cat:q.cat||q.type||(/school|college/i.test(q.name)?"school":/station/i.test(q.name)?"train":/park|reserve/i.test(q.name)?"park":"other"), lat:q.lat, lng:q.lng, desc:decodeEntities((q.notes||"").replace(/^.*?·\s*/,"")), school: /ZONED/.test(q.badge||"") ? "zoned" : /unverified/.test(q.badge||"") ? "unverified" : /private/.test(q.badge||"") ? "private" : "" })) };
  }
  const seen = new Set();
  j.places.forEach(q=>{ if (q.name){ if (/✓\s*ZONED|\bZONED\b/i.test(q.name) && !q.school) q.school='zoned'; q.name = String(q.name).replace(/\s*✓?\s*\(?\bZONED\b\)?\s*/ig,' ').replace(/\s*[✓✔]\s*$/,'').trim(); } });
  j.places = j.places.filter(q=>q.name && isFinite(q.lat) && isFinite(q.lng)).map(q=>{ const g = geoDist(j.lat, j.lng, q.lat, q.lng); let key = q.name.toLowerCase(); while (seen.has(key)) key += "+"; seen.add(key); return Object.assign(q, { key, dist:g.d, dir:g.dir, icon:iconForPlace(q.name, q.cat) }); }).sort((a,b)=>a.dist-b.dist);
  return j;
}
$("jobIn").onchange = async ()=>{ const f = $("jobIn").files[0]; $("jobIn").value=""; if (f) loadJobFile(f); };
async function loadJobFile(f){
  try{ const j = parseJobFile(await f.text()); job = j; armed=null; photos.forEach(p=>{ if (p.anchors.some(a=>a.key==="__house")){ p.anchors.forEach(a=>{ if (a.key==="__house"){ a.lat=j.lat; a.lng=j.lng; } }); realign(p); } }); refreshAll(); toast(`${j.places.length} places loaded for ${j.address.split(",")[0]}`); }
  catch(err){ toast(err.message || "Couldn't read that file"); }
}
