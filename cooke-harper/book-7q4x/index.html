<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f3a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buyer Book">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Cooke &amp; Harper Buyer Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky green top bar with tabs; one working column (max 1100) of cards; pools as a 3-up grid that stacks on phones. */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --sunk:#e9ede6; --ink:#17221c; --muted:#57645b; --line:#d6ddd3;
  --gum:#1f3a2e; --gum-ink:#eef3ec; --sun:#e2a92a; --sun-soft:#f7e7bf; --sun-ink:#2a2006;
  --hot:#c2462f; --hot-soft:#f7dfd8; --warm:#b7791f; --warm-soft:#f6ead2; --cold:#4d6f8a; --cold-soft:#dfe8ef;
  --good:#2f7a4c; --good-soft:#dbeedf;
  --display:"Young Serif",Georgia,serif;
  --body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101612; --surface:#18211c; --sunk:#141c17; --ink:#e6ece5; --muted:#a2afa5; --line:#2b3830;
  --gum:#0b1510; --gum-ink:#e6ece5; --sun:#efbd4c; --sun-soft:#3a2f14; --sun-ink:#231b05;
  --hot:#ee7d66; --hot-soft:#3d211b; --warm:#e0a94e; --warm-soft:#382a14; --cold:#8fb0c9; --cold-soft:#1c2a35;
  --good:#6cc690; --good-soft:#18301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18211c; --sunk:#141c17; --ink:#e6ece5; --muted:#a2afa5; --line:#2b3830;
  --gum:#0b1510; --gum-ink:#e6ece5; --sun:#efbd4c; --sun-soft:#3a2f14; --sun-ink:#231b05;
  --hot:#ee7d66; --hot-soft:#3d211b; --warm:#e0a94e; --warm-soft:#382a14; --cold:#8fb0c9; --cold-soft:#1c2a35;
  --good:#6cc690; --good-soft:#18301f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--gum)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--gum);color:var(--gum-ink)}
.bar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px 0}
.brand{display:flex;flex-direction:column;margin-right:auto}
.brand b{font-family:var(--display);font-weight:400;font-size:20px}
.brand span{font-size:12px;opacity:.7;letter-spacing:.04em}
.addbtns{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;width:100%;overflow-x:auto;scrollbar-width:none;margin-top:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--gum-ink);opacity:.72;padding:10px 14px 12px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{opacity:1;border-bottom-color:var(--sun)}
.tab .ct{font-weight:500;opacity:.7;margin-left:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--sun);color:var(--sun-ink);border-color:var(--sun)}
.btn.onbar{background:transparent;color:var(--gum-ink);border-color:rgba(238,243,236,.35)}
.btn.onbar.primary{background:var(--sun);color:var(--sun-ink);border-color:var(--sun)}
.btn.small{padding:6px 10px;min-height:32px;font-size:13px}
.btn.danger{color:var(--hot)}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600}

main{padding-block:22px 64px}
.view{display:grid;gap:20px}
.view > *{min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h2{font-size:28px}
.head p{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:18px}
#banner:not(:empty){margin-bottom:16px}
.notice{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:14px;background:var(--sunk)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:32px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}

/* two col */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sec-title h3{font-size:19px}
.sec-title span{font-size:13px;color:var(--muted)}

/* rows */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;cursor:pointer}
.list > .row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .nm{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.row .sub{grid-column:1/-1;color:var(--muted);font-size:13.5px;min-width:0}
.row .right{text-align:right;font-weight:700}
.empty{padding:22px 18px;color:var(--muted);font-size:14px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-hot{background:var(--hot-soft);color:var(--hot)}
.p-warm{background:var(--warm-soft);color:var(--warm)}
.p-cold{background:var(--cold-soft);color:var(--cold)}
.p-stage{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.p-stage::before{display:none}
.p-ex{background:var(--sunk);color:var(--muted)}
.p-ex::before{display:none}
.tag{display:inline-block;font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);margin:2px 4px 2px 0}

/* toolbar */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{flex:1 1 220px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gum);color:var(--gum-ink)}

/* pools */
.pools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:900px){.pools{grid-template-columns:minmax(0,1fr)}}
.pool-h{padding:16px 18px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.pool-h .band{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.pool-h h3{font-size:26px}
.heatbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.heatbar i{display:block}
.heatlegend{display:flex;gap:12px;font-size:12.5px;color:var(--muted)}
.wants{padding:12px 18px;border-bottom:1px solid var(--line);display:grid;gap:6px;font-size:13.5px}
.wants div{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.wants b{font-weight:600;color:var(--muted);min-width:64px}
.bandset{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.bandset input{width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

/* matches */
.match{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.match:first-child{border-top:0}
.score{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;border:3px solid var(--line)}
.score.s-strong{border-color:var(--good);color:var(--good)}
.score.s-good{border-color:var(--sun);color:var(--warm)}
.score.s-maybe{border-color:var(--line);color:var(--muted)}
.why{font-size:13px;color:var(--muted)}
.why .ok{color:var(--good)}
.why .no{color:var(--hot)}
.mact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.match{grid-template-columns:48px minmax(0,1fr)}.score{width:48px;height:48px;font-size:16px}.mact{grid-column:1/-1;justify-content:flex-start}}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.smsbox{width:100%;min-height:120px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);resize:vertical}

/* drawer form */
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.35)}
.drawer header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 14px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:22px}
.drawer .body{flex:1;overflow-y:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) 18px 18px;display:grid;gap:16px;align-content:start}
.drawer footer{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:14px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) 18px;border-top:1px solid var(--line)}
.f{display:grid;gap:6px}
.f > span{font-size:13px;font-weight:700}
.f small{color:var(--muted);font-size:12.5px}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.f textarea{min-height:76px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:420px){.g3{grid-template-columns:1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--gum);color:var(--gum-ink);border-color:var(--gum)}
.err{color:var(--hot);font-size:13.5px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.detail{display:grid;gap:14px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.p-due{background:var(--hot-soft);color:var(--hot)}
.p-soon{background:var(--sun-soft);color:var(--warm)}
.p-ok{background:var(--good-soft);color:var(--good)}
.remember{background:var(--sun-soft);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.remember h3{font-size:17px}
.remember p{white-space:pre-wrap}
.idea{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px;background:var(--surface)}
.idea b{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.logbox{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;background:var(--sunk)}
.logbox input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.hist{display:grid}
.hist div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hist div:first-child{border-top:0}
.hist .d{color:var(--muted);font-size:13px}
.nextrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nextrow input[type=date]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.guide{display:grid;gap:16px}
.gsec{display:grid;gap:10px}
.gsec h3{font-size:21px}
.gsec p,.gsec li{max-width:66ch}
.gsec ol,.gsec ul{margin:0;padding-left:20px;display:grid;gap:6px}
.gsec .k{font-weight:700}
.rhythm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.rhythm{grid-template-columns:minmax(0,1fr)}}
.rhythm .card{padding:16px;display:grid;gap:8px;align-content:start}
.rhythm b{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rhythm h4{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.weekstrip{display:grid;gap:12px;padding:14px 18px;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.weekstrip:hover{border-color:var(--muted)}
.ws-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ws-h b{font-family:var(--display);font-weight:400;font-size:19px}
.ws-h span{font-size:13px;color:var(--muted)}
.ws-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:640px){.ws-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ws{display:grid;gap:5px;min-width:0}
.ws-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.ws-top b{font-size:18px;color:var(--ink)}
.ws-top small{font-size:12px;color:var(--muted);font-weight:500}
.ws-note{font-size:12px;color:var(--muted)}
.ws-note.behind{color:var(--hot);font-weight:600}
.me{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--gum-ink);opacity:.9}
.me select{background:transparent;color:var(--gum-ink);border:1px solid rgba(238,243,236,.35);border-radius:8px;padding:6px 8px;font-weight:600}
.me option{color:var(--ink);background:var(--surface)}
.agt{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tpl{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:var(--surface)}
.tpl b{font-size:14px}
.tpl textarea{width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);resize:vertical}
.hint{font-size:13px;background:var(--sun-soft);border-radius:8px;padding:8px 10px}
.dtab{width:100%;border-collapse:collapse;font-size:14px}
.dtab th,.dtab td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
.dtab th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--sunk)}
.dtab td.n{text-align:right;font-variant-numeric:tabular-nums}
.dbar{display:flex;align-items:center;gap:8px;min-width:140px}
.dbar i{display:block;height:10px;border-radius:5px;background:var(--sun)}
.sig{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.sig-pro{background:var(--good-soft);color:var(--good)}
.sig-under{background:var(--sun-soft);color:var(--warm)}
.sig-need{background:var(--cold-soft);color:var(--cold)}
.sig-ok{background:var(--sunk);color:var(--muted)}
.imp-map{display:grid;gap:8px}
.imp-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;font-size:14px}
.imp-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-row select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.imp-row .ex{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.prev table{border-collapse:collapse;font-size:13px;min-width:100%}
.prev th,.prev td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.prev th{background:var(--sunk);font-weight:700}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;display:grid;gap:8px;justify-items:center;color:var(--muted)}
.drop.over{border-color:var(--sun);background:var(--sun-soft)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px;display:grid;gap:8px}
.kpi .lab{font-size:13px;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--display);font-size:30px;line-height:1}
.kpi .val small{font-family:var(--body);font-size:14px;color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--sun)}
.meter i.done{background:var(--good)}
.chartwrap{overflow-x:auto}
.targets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.targets{grid-template-columns:repeat(2,minmax(0,1fr))}}
.targets input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.att{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.att input,.att select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.att .full{grid-column:1/-1}
.dup{font-size:13.5px;color:var(--warm);background:var(--warm-soft);border-radius:8px;padding:8px 10px}
.lb{display:grid;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .22s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}}
/* ---- website port: base reset, gate, FAB, inbox ---- */
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
input,select,textarea{font-size:16px}
.gate{position:fixed;inset:0;z-index:40;background:var(--gum);color:var(--gum-ink);display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px))}
.gate-in{max-width:420px;width:100%;display:grid;gap:16px;text-align:left}
.gate h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1}
.gate p{color:#c9d5ca}
.gate .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:0;border-radius:12px;padding:15px 18px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:52px}
.gate .gerr{background:rgba(238,125,102,.15);border:1px solid rgba(238,125,102,.5);color:#ffd9d0;border-radius:10px;padding:12px 14px;font-size:14px}

.fabmenu{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:16;display:grid;gap:8px;justify-items:end}
.fabmenu button{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:12px 18px;font:inherit;font-weight:700;box-shadow:0 8px 20px -10px rgba(0,0,0,.4);min-height:46px}
@media (max-width:640px){.addbtns{display:none!important}.fab{display:block}main{padding-bottom:96px}.bar .wrap{padding-block:8px 0}.brand b{font-size:18px}}
.inbox .row{cursor:default}
.inbox .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.inbox .acts .btn{min-height:40px;text-decoration:none}
.inbox .acts a.btn:not(.primary){color:var(--ink)}
.memlist{display:grid;gap:6px}
.memrow{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.memrow span{min-width:0;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-in">

    <h1>Buyer Book</h1>
    <p id="gateMsg">Checking who you are…</p>
    <button class="gbtn" id="gateBtn" type="button" hidden><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Sign in with Google</button>
    <div class="gerr" id="gateErr" hidden></div>
    <button class="gbtn" id="gateOut" type="button" hidden style="background:transparent;color:var(--gum-ink);border:1px solid rgba(238,243,236,.4)">Use a different account</button>
    <small>Private to Jayden, James and Baker Production. Your data is stored securely and only people on the access list can open it.</small>

</div>

<header class="bar">
  <div class="wrap">
    <div class="brand"><b id="teamName">Cooke &amp; Harper</b><span>Buyer &amp; seller book · Rodway Group</span></div>
    <label class="me"><span>Viewing as</span><select id="meSel" aria-label="Viewing as"></select></label>

      <button class="btn onbar primary" data-act="new-buyer" id="addBuyerBtn">+ Buyer</button>
      <button class="btn onbar" data-act="new-prospect" id="addProspectBtn">+ Potential seller</button>

      <button class="tab" data-tab="today">Today</button>

      <button class="tab" data-tab="sellers">Sellers <span class="ct num" id="ctS"></span></button>
      <button class="tab" data-tab="past">Past clients</button>
      <button class="tab" data-tab="match">Match</button>
      <button class="tab" data-tab="score">Scorecard</button>
      <button class="tab" data-tab="guide">How to use</button>

</header>

<main class="wrap">
  <div id="banner"></div>
  <div id="view" class="view"></div>
</main>
<div id="overlay"></div>

<button class="fab" id="fab" type="button" aria-label="Add a person" aria-expanded="false">+</button>
<div class="fabmenu" id="fabmenu" hidden><button type="button" data-act="new-buyer">+ Buyer</button><button type="button" data-act="new-prospect">+ Potential seller</button><button type="button" data-act="new-seller">+ Seller</button><button type="button" data-act="import" data-v="buyers">Import from Excel</button></div>

<script>
(function(){
"use strict";

/* ---------- website shims ---------- */
function saveBlob(name,data,mime){var b=data instanceof Blob?data:new Blob([data],{type:mime||"application/octet-stream"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);}
var claude={use:function(n){if(n!=="downloads")return Promise.resolve(null);return Promise.resolve({save:function(o){var f=o.filename||"file";var mime=/\.csv$/.test(f)?"text/csv":/\.json$/.test(f)?"application/json":/\.xlsx$/.test(f)?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":"application/octet-stream";saveBlob(f,o.data,mime);return Promise.resolve({status:"saved"});}});}};

/* ---------- reference lists ---------- */
var SUBURBS=["Kelmscott","Armadale","Mount Richon","Seville Grove","Camillo","Champion Lakes","Mount Nasura","Roleystone","Bedfordale","Brookdale","Haynes","Hilbert","Gosnells","Martin","Byford"];
var TYPES=["House","Unit","Townhouse/villa","Land","Acreage"];
var FEATURES=["Pool","Shed/workshop","Granny flat","Big block 700m²+","Single storey","Side access","2nd living/theatre","Solar","No strata","Near schools"];
var FINANCE=["Pre-approved","Cash","Needs finance","Must sell first"];
var TIMEFRAME=["Ready now","1–3 months","3–6 months","Just looking"];
var STAGES=["Appraisal","Pre-market","Listed","Under offer","Sold"];
var BSTATUS=["Active","Bought","Paused"];
var PTIME=["This month","1–3 months","3–6 months","6–12 months","12+ months / unsure"];
var MOTIVE=["Upsizing","Downsizing","Relocating","Selling an investment","Estate or separation","Curious about value"];
var PSOURCE=["Appraisal page","Door knock","Home open","Referral","Just-sold flyer","Instagram","Past client","Other"];
var TRAITS=["Prefers text","Prefers calls","Busy mornings","Wants detail","Price-focused","Family first","First-time seller","Has sold before","Talking to other agents"];
var TOUCH=["Call","Text","Email","Door knock","Met in person","Sent sale/report"];
var PSTATUS=["Nurturing","Appraisal booked","Listed with us","Listed elsewhere","Not selling"];

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function money(n){if(!n&&n!==0)return "–";if(n>=1e6){var m=n/1e6;return "$"+(m%1===0?m:m.toFixed(m<10?2:1).replace(/0$/,""))+"m";}return "$"+Math.round(n/1000)+"k";}
function parseMoney(v){if(v==null)return null;var s=String(v).trim().toLowerCase().replace(/[$,\s]/g,"");if(!s)return null;var mult=1;if(/m$/.test(s)){mult=1e6;s=s.slice(0,-1);}else if(/k$/.test(s)){mult=1e3;s=s.slice(0,-1);}var n=parseFloat(s);if(!isFinite(n))return null;n=n*mult;if(mult===1&&n<10000)n=n*1000;return Math.round(n);}
function range(b){if(b.budgetMin&&b.budgetMax)return money(b.budgetMin)+"–"+money(b.budgetMax);if(b.budgetMax)return "up to "+money(b.budgetMax);if(b.budgetMin)return money(b.budgetMin)+"+";return "no budget yet";}
function daysSince(iso){if(!iso)return null;var t=Date.parse(iso);if(!isFinite(t))return null;return Math.floor((Date.now()-t)/864e5);}
function ago(iso){var d=daysSince(iso);if(d==null)return "never";if(d<=0)return "today";if(d===1)return "yesterday";if(d<14)return d+" days ago";if(d<60)return Math.round(d/7)+" weeks ago";return Math.round(d/30)+" months ago";}
function nowIso(){return new Date().toISOString();}
function heat(b){var f=b.finance,t=b.timeframe;var ready=(f==="Pre-approved"||f==="Cash");if(ready&&(t==="Ready now"||t==="1–3 months"))return "hot";if(t==="Just looking"&&!ready)return "cold";if(t==="Just looking"||(f==="Must sell first"&&t!=="Ready now"))return "cold";return "warm";}
var HEATRANK={hot:0,warm:1,cold:2};
function heatPill(b){var h=heat(b);return '<span class="pill p-'+h+'">'+h+'</span>';}
function digits(p){return String(p||"").replace(/[^\d+]/g,"");}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function todayStr(){return ymd(new Date());}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return ymd(d);}
function dueIn(s){if(!s)return null;var a=Date.parse(s+"T00:00:00"),b=Date.parse(todayStr()+"T00:00:00");return Math.round((a-b)/864e5);}
function niceDate(s){if(!s)return "not set";var d=new Date(s+"T00:00:00");var o={weekday:"short",day:"numeric",month:"short"};if(d.getFullYear()!==new Date().getFullYear()){o={day:"numeric",month:"short",year:"numeric"};}return d.toLocaleDateString("en-AU",o);}
function duePill(s){var n=dueIn(s);if(n==null)return '<span class="pill p-stage">no follow-up</span>';if(n<0)return '<span class="pill p-due">'+(-n)+'d overdue</span>';if(n===0)return '<span class="pill p-due">due today</span>';if(n<=3)return '<span class="pill p-soon">in '+n+'d</span>';return '<span class="pill p-ok">'+esc(niceDate(s))+'</span>';}
function cadence(r){var t=r.timeframe;if(r.stage){return {"Appraisal":4,"Pre-market":3,"Listed":7,"Under offer":3,"Sold":90}[r.stage]||7;}return {"This month":3,"1–3 months":7,"3–6 months":14,"6–12 months":30}[t]||60;}
function ptemp(r){var t=r.timeframe;if(t==="This month"||t==="1–3 months")return "hot";if(t==="3–6 months"||t==="6–12 months")return "warm";return "cold";}
function nextIdea(r,kind){
  var n=(r.log||[]).length,m=r.motivation,ideas;
  if(kind==="seller"){
    ideas={"Appraisal":"Send the written price range with 2–3 nearby sales, then call to walk them through it.","Pre-market":"Tell them how many buyers in the book fit their home, and offer an off-market preview.","Listed":"Weekly update: enquiries, inspections, buyer feedback, and the plan for next week.","Under offer":"Walk them through finance and settlement dates so nothing surprises them.","Sold":"Thank-you gift, then ask for a Google review and anyone else thinking of selling."};
    return ideas[r.stage]||"Check in.";
  }
  var base=["Thank them for their time and send what they asked about (their estimate or a sale).","Send a nearby sale: price, days on market, and what it means for their place.","Call with a 2-minute market update for their street.","Drop past with something useful: a printed estimate or a just-sold flyer.","Ask whether their timing or reason has changed. Offer a fresh appraisal."];
  var idea=base[Math.min(n,base.length-1)];
  var extra={"Downsizing":"Mention any buyers wanting a family home like theirs, and offer to look out for a single-storey place for them.","Upsizing":"Offer to watch for their next home so selling and buying line up.","Relocating":"Ask about their move date and work back from it.","Selling an investment":"Offer a rent appraisal from the Rodway PM team so they can compare hold vs sell.","Estate or separation":"Go gently. Ask who else is involved in the decision.","Curious about value":"Keep it light: one useful sale a month, no pressure."}[m];
  return idea+(extra?" "+extra:"");
}
function weekStart(d){d=d?new Date(d+"T00:00:00"):new Date();d.setHours(0,0,0,0);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d);}
function shiftDays(s,n){var d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d);}
function inWeek(s,ws){return !!s&&s>=ws&&s<=shiftDays(ws,6);}
function isoDay(iso){if(!iso)return "";var t=Date.parse(iso);return isFinite(t)?ymd(new Date(t)):String(iso).slice(0,10);}
function agents(){var a=state.settings.agents;return (a&&a.length===2&&a[0]&&a[1])?a:["Jayden","James"];}
function mine(r){return !state.me||!r.agent||r.agent===state.me;}
function agentTag(r){return r&&r.agent?' <span class="agt">'+esc(r.agent)+'</span>':'';}
function myTargets(who){var t=state.settings.targets||{touches:60,buyers:10,appraisals:3,listings:1};if(!who)return t;var o={};Object.keys(t).forEach(function(k){o[k]=Math.ceil((t[k]||0)/2);});return o;}
function weekStats(ws,who){
  var touches=0,buyers=0,appr=0,list=0,sold=0;
  state.buyers.concat(state.prospects,state.sellers).forEach(function(r){(r.log||[]).forEach(function(e){if(!inWeek(e.date,ws))return;if(!who||e.by===who||(!e.by&&r.agent===who))touches++;});});
  state.buyers.forEach(function(b){if(inWeek(isoDay(b.createdAt),ws)&&(!who||b.createdBy===who||(!b.createdBy&&b.agent===who)))buyers++;});
  state.sellers.forEach(function(s){if(who&&s.agent!==who)return;var sd=s.stageDates||{};if(inWeek(sd.Appraisal||(s.fromProspect||!sd.Appraisal?isoDay(s.createdAt):""),ws))appr++;if(inWeek(sd.Listed,ws))list++;if(inWeek(sd.Sold,ws))sold++;});
  return {touches:touches,buyers:buyers,appraisals:appr,listings:list,sold:sold};
}
function median(a){if(!a.length)return null;var s=a.slice().sort(function(x,y){return x-y;}),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function mode(a){var c={},best=null;a.forEach(function(x){c[x]=(c[x]||0)+1;if(best==null||c[x]>c[best])best=x;});return best;}
function scopeSeg(){if(!state.me)return "";return '<div class="seg" role="group" aria-label="Whose records"><button data-act="scope" data-v="mine" aria-pressed="'+(state.scope!=="all")+'">'+esc(state.me)+' + shared</button><button data-act="scope" data-v="all" aria-pressed="'+(state.scope==="all")+'">Everyone</button></div>';}
function inScope(r){return !state.me||state.scope==="all"||mine(r);}
function last4(p){var d=digits(p).replace(/^\+?61/,"0");return d.length>=8?d.slice(-9):"";}
function findDup(phone,exceptId){
  var k=last4(phone);if(!k)return null;
  var pools=[["buyer",state.buyers,"phone","name"],["potential seller",state.prospects,"phone","name"],["seller",state.sellers,"phone","owner"]];
  for(var i=0;i<pools.length;i++){var hit=pools[i][1].filter(function(r){return r.id!==exceptId&&last4(r[pools[i][2]])===k;})[0];if(hit)return {kind:pools[i][0],name:hit[pools[i][3]]||hit.address||"someone",rec:hit};}
  return null;
}
function anniv(s){if(!s)return null;var d=new Date(s+"T00:00:00"),t=new Date(todayStr()+"T00:00:00");var n=new Date(d);n.setFullYear(t.getFullYear());if(n<t)n.setFullYear(t.getFullYear()+1);var yrs=n.getFullYear()-d.getFullYear();return {date:ymd(n),years:yrs,days:Math.round((n-t)/864e5)};}
function pastClients(){
  var out=[];
  state.sellers.forEach(function(s){if(s.stage==="Sold"){var d=(s.stageDates||{}).Sold||isoDay(s.updatedAt);out.push({kind:"seller",r:s,name:s.owner||s.address,what:"Sold "+(s.address||""),date:d,a:anniv(d)});}});
  state.buyers.forEach(function(b){if(b.status==="Bought"){var d=(b.stageDates||{}).Bought||isoDay(b.updatedAt);out.push({kind:"buyer",r:b,name:b.name,what:"Bought"+(b.boughtAddress?" "+b.boughtAddress:""),date:d,a:anniv(d)});}});
  return out.sort(function(x,y){return (x.a?x.a.days:9999)-(y.a?y.a.days:9999);});
}
function buyersForHome(r){if(!r.price&&!r.estValue)return [];var p={price:r.price||r.estValue,suburb:r.suburb,beds:r.beds,type:r.type||"House",features:r.features||[]};return matchesFor(p).filter(function(x){return x.m.score>=65;});}

/* ---------- matching: 0–100 ---------- */
function scoreMatch(b,p){
  var r={score:0,why:[],out:false};
  if(!p.price){r.why.push(["no","no price on property"]);}
  var max=b.budgetMax||0,min=b.budgetMin||0;
  if(p.price&&max){
    if(p.price<=max&&(!min||p.price>=min*0.85)){r.score+=40;r.why.push(["ok","in budget"]);}
    else if(p.price>max&&p.price<=max*1.08){r.score+=22;r.why.push(["ok","stretch, "+Math.round((p.price/max-1)*100)+"% over"]);}
    else if(p.price<min*0.85){r.score+=15;r.why.push(["no","below their range"]);}
    else {r.out=true;r.why.push(["no","over budget"]);}
  } else if(p.price&&!max){r.score+=15;r.why.push(["no","budget unknown"]);}
  var subs=b.suburbs||[];
  if(!subs.length){r.score+=12;r.why.push(["ok","any suburb"]);}
  else if(p.suburb&&subs.indexOf(p.suburb)>-1){r.score+=20;r.why.push(["ok",p.suburb]);}
  else {r.why.push(["no","not their suburb"]);}
  if(b.beds&&p.beds){
    if(p.beds>=b.beds){r.score+=15;r.why.push(["ok",p.beds+" bed"]);}
    else if(p.beds===b.beds-1){r.score+=5;r.why.push(["no","1 bed short"]);}
    else {r.why.push(["no","too few beds"]);}
  } else {r.score+=10;}
  var types=b.types||[];
  if(!types.length||types.indexOf(p.type)>-1){r.score+=10;if(types.length)r.why.push(["ok",p.type]);}
  else {r.why.push(["no","wants "+types.join("/").toLowerCase()]);}
  var must=b.mustHaves||[],feat=p.features||[];
  if(must.length){var hit=must.filter(function(m){return feat.indexOf(m)>-1;});r.score+=Math.round(15*hit.length/must.length);
    if(hit.length)r.why.push(["ok",hit.join(", ").toLowerCase()]);
    var miss=must.filter(function(m){return feat.indexOf(m)<0;});if(miss.length)r.why.push(["no","no "+miss.join(", ").toLowerCase()]);}
  else r.score+=15;
  if(r.out)r.score=Math.min(r.score,30);
  r.score=Math.max(0,Math.min(100,r.score));
  r.tier=r.score>=80?"strong":r.score>=65?"good":r.score>=50?"maybe":"none";
  return r;
}
window.__scoreMatch=scoreMatch;
function matchesFor(p){
  return state.buyers.filter(function(b){return (b.status||"Active")==="Active";})
    .map(function(b){var m=scoreMatch(b,p);return {b:b,m:m};})
    .filter(function(x){return x.m.score>=50;})
    .sort(function(a,c){return c.m.score-a.m.score||HEATRANK[heat(a.b)]-HEATRANK[heat(c.b)];});
}
function poolIndex(b,bands){var v=b.budgetMax||b.budgetMin||0;if(!v)return -1;if(v<=bands[0])return 0;if(v<=bands[1])return 1;return 2;}

/* ---------- state + store ---------- */
var state={inbox:[],user:null,book:{members:[],names:{}},buyers:[],sellers:[],prospects:[],pq:"",me:"",scope:"mine",scoreWho:null,gq:"",lastMatchP:null,settings:{bands:[650000,850000],targets:{touches:60,buyers:10,appraisals:3,listings:1}},tab:"today",q:"",heatF:"all",matchSel:"",quick:{price:"",suburb:"",beds:"",type:""},ready:{b:false,s:false,p:false},db:null,canWrite:true,dbMode:"pending"};
var mem={buyers:{},sellers:{},prospects:{}};
function store(){return state.db;}
function save(coll,id,data){
  data.updatedAt=nowIso();
  if(state.db){var ref=id?state.db.collection(coll).doc(id):state.db.collection(coll).doc();return ref.set(data).then(function(){return ref.id;});}
  var nid=id||("m"+Math.random().toString(36).slice(2,10));data.id=nid;mem[coll][nid]=data;pull(coll);return Promise.resolve(nid);
}
function patch(coll,id,data){
  if(state.db)return state.db.collection(coll).doc(id).update(data);
  Object.assign(mem[coll][id],data);pull(coll);return Promise.resolve();
}
function remove(coll,id){
  if(state.db)return state.db.collection(coll).doc(id).delete();
  delete mem[coll][id];pull(coll);return Promise.resolve();
}
function pull(coll){state[coll]=Object.keys(mem[coll]).map(function(k){return Object.assign({id:k},mem[coll][k]);});render();}
function saveSettings(){
  if(state.db)return state.db.doc("settings/main").set(state.settings);
  render();return Promise.resolve();
}
function writeErr(e){
  if(e&&(e.code==="invalid_argument"||e.code==="permission-denied")&&state.db){state.canWrite=false;toast("You have view-only access, so changes can't be saved.");render();return;}
  if(e&&e.code==="quota_exceeded"){toast("The book is full. Delete old records to add more.");return;}
  toast("That didn't save. Check your connection and try again.");
}

/* ---------- toast ---------- */

function buyerRow(b,extra){

function emptyBook(){
  return '<div class="card pad" style="display:grid;gap:12px"><h2 style="font-size:24px">Your book is empty</h2><p style="color:var(--muted);max-width:60ch">Start by importing the buyer spreadsheet you already keep. Then add every buyer you meet at home opens and every owner you appraise. The book sorts buyers into budget pools and shows which buyers fit each property, so you can call the right people first.</p><div class="tools">'+(state.canWrite?'<button class="btn primary" data-act="import" data-v="buyers">Import your Excel buyer list</button><button class="btn" data-act="new-buyer">+ Add a buyer</button><button class="btn" data-act="new-seller">+ Add a seller</button><button class="btn" data-act="load-examples">Try it with example records</button>':'')+'<button class="btn" data-tab="guide">How it works</button></div></div>';
}

function vToday(){
  var wk=weekStats(weekStart(),state.me),tgt=myTargets(state.me);
  if(!state.buyers.length&&!state.sellers.length&&!state.prospects.length)return '<div class="head"><div><h2>Today</h2><p>Who to call, and which properties have buyers waiting.</p></div></div>'+inboxSection()+emptyBook();
  var act=state.buyers.filter(function(b){return (b.status||"Active")==="Active";});
  var hot=act.filter(function(b){return heat(b)==="hot";});
  var pipe=state.sellers.filter(function(s){return s.stage!=="Sold";});
  var follow=act.filter(mine).filter(function(b){var d=daysSince(b.lastContact);var h=heat(b);return h!=="cold"&&(d==null||d>=(h==="hot"?7:14));})
    .sort(function(a,c){return HEATRANK[heat(a)]-HEATRANK[heat(c)]||((daysSince(c.lastContact)||999)-(daysSince(a.lastContact)||999));}).slice(0,8);
  var dueSel=state.prospects.filter(function(r){var st=r.status||"Nurturing";return st==="Nurturing"||st==="Appraisal booked";}).map(function(r){return {k:"prospect",r:r};})
    .concat(pipe.map(function(s){return {k:"seller",r:s};}))
    .filter(function(x){var n=dueIn(x.r.nextFollowUp);return n!=null&&n<=0&&mine(x.r);})
    .sort(function(a,c){return dueIn(a.r.nextFollowUp)-dueIn(c.r.nextFollowUp);});
  var annSoon=pastClients().filter(function(x){return x.a&&x.a.days<=14&&mine(x.r);});
  var withMatch=pipe.filter(mine).map(function(s){return {s:s,n:matchesFor(s).filter(function(x){return x.m.score>=65;}).length};}).sort(function(a,c){return c.n-a.n;}).slice(0,6);
  var h='<div class="head"><div><h2>Today</h2><p>'+(state.me?esc(state.me)+'\'s calls plus shared records. Your share of the team targets.':'Who to call, and which properties have buyers waiting.')+'</p></div>'+exBadge()+'</div>';
  h+='<div class="tools"><input type="search" id="gq" placeholder="Find anyone: name, mobile, address or suburb" value="'+esc(state.gq)+'" aria-label="Search everyone"></div>';
  if(state.gq.trim().length>=2)return h+searchResults(state.gq.trim());
  h+=inboxSection();
  h+=weekStrip(wk,tgt);
  if(annSoon.length)h+='<section class="card"><div class="sec-title"><h3>Past client anniversaries</h3><span>next 14 days</span></div><div class="list">'+annSoon.map(function(x){return '<button class="row" data-act="open-past" data-kind="'+x.kind+'" data-id="'+esc(x.r.id)+'"><span class="nm">'+esc(x.name||"Client")+'</span><span class="right">'+(x.a.days===0?'<span class="pill p-due">today</span>':'<span class="pill p-soon">in '+x.a.days+'d</span>')+'</span><span class="sub">'+esc(x.what)+'</span></button>';}).join("")+'</div></section>';
  h+='<section class="card"><div class="sec-title"><h3>Seller follow-ups due</h3><span>potential sellers and current sellers</span></div><div class="list">'+(dueSel.length?dueSel.map(function(x){return x.k==="prospect"?prospectRow(x.r):sellerRow(x.r);}).join(""):'<div class="empty">No seller follow-ups due. Nice work.</div>')+'</div></section>';
  h+='<div class="cols"><section class="card"><div class="sec-title"><h3>Call these buyers</h3><span>hot after 7 days, warm after 14</span></div><div class="list">'+(follow.length?follow.map(function(b){return buyerRow(b,"last spoke "+ago(b.lastContact));}).join(""):'<div class="empty">Everyone warm or hot has been called recently.</div>')+'</div></section>';
  h+='<section class="card"><div class="sec-title"><h3>Properties with buyers waiting</h3><span>good or strong matches</span></div><div class="list">'+(withMatch.length?withMatch.map(function(x){return '<button class="row" data-act="go-match" data-id="'+esc(x.s.id)+'"><span class="nm">'+esc(x.s.address||"No address")+' <span class="pill p-stage">'+esc(x.s.stage||"")+'</span></span><span class="right num">'+x.n+' buyer'+(x.n===1?"":"s")+'</span><span class="sub">'+esc([x.s.suburb,money(x.s.price),x.s.beds?x.s.beds+" bed":""].filter(Boolean).join(" · "))+'</span></button>';}).join(""):'<div class="empty">Add a seller with a price to see who fits.</div>')+'</div></section></div>';
  return h;
}

function exBadge(){
  var n=state.prospects.filter(function(r){return r.example;}).length+state.buyers.filter(function(b){return b.example;}).length+state.sellers.filter(function(s){return s.example;}).length;
  return n&&state.canWrite?'<button class="btn small" data-act="clear-examples">Remove '+n+' example records</button>':"";
}

function vPools(){
  var bands=state.settings.bands;
  var labels=["Under "+money(bands[0]),money(bands[0])+"–"+money(bands[1]),money(bands[1])+"+"];
  var act=state.buyers.filter(function(b){return (b.status||"Active")==="Active";});
  var pools=[[],[],[]],nob=[];
  act.forEach(function(b){var i=poolIndex(b,bands);if(i<0)nob.push(b);else pools[i].push(b);});
  var h='<div class="head"><div><h2>Buyer pools</h2><p>Active buyers grouped by top budget, with what each pool is after.</p></div>'+exBadge()+'</div>';
  h+='<div class="card pad bandset"><span>Pool limits:</span><label>Pool 1 up to <input id="band0" inputmode="decimal" value="'+esc(Math.round(bands[0]/1000)+"k")+'" '+(state.canWrite?'':'disabled')+'></label><label>Pool 2 up to <input id="band1" inputmode="decimal" value="'+esc(Math.round(bands[1]/1000)+"k")+'" '+(state.canWrite?'':'disabled')+'></label>'+(state.canWrite?'<button class="btn small" data-act="save-bands">Update pools</button>':'')+'</div>';
  if(!act.length)return h+emptyBook();
  h+='<div class="pools">';

    list.sort(function(a,c){return HEATRANK[heat(a)]-HEATRANK[heat(c)]||(c.budgetMax||0)-(a.budgetMax||0);});

    h+='<section class="card"><div class="pool-h"><span class="band">Pool '+(i+1)+'</span><h3>'+esc(labels[i])+'</h3><span class="num" style="color:var(--muted);font-size:14px">'+list.length+' buyer'+(list.length===1?"":"s")+'</span>';
    h+='<div class="heatbar" aria-hidden="true"><i style="width:'+(c.hot/t*100)+'%;background:var(--hot)"></i><i style="width:'+(c.warm/t*100)+'%;background:var(--warm)"></i><i style="width:'+(c.cold/t*100)+'%;background:var(--cold)"></i></div><div class="heatlegend num"><span>'+c.hot+' hot</span><span>'+c.warm+' warm</span><span>'+c.cold+' cold</span></div></div>';
    h+='<div class="wants">'+wantRow("Beds",list,function(b){return b.beds?b.beds+"+":null;})+wantRow("Type",list,function(b){return b.types&&b.types.length?b.types:null;})+wantRow("Suburbs",list,function(b){return b.suburbs&&b.suburbs.length?b.suburbs:null;},4)+wantRow("Must have",list,function(b){return b.mustHaves&&b.mustHaves.length?b.mustHaves:null;},4)+'</div>';
    h+='<div class="list">'+(list.length?list.map(function(b){return buyerRow(b);}).join(""):'<div class="empty">No buyers in this range yet.</div>')+'</div></section>';

  h+='</div>';

  return h;
}
function wantRow(label,list,fn,top){
  var cnt={};list.forEach(function(b){var v=fn(b);if(v==null)return;[].concat(v).forEach(function(x){cnt[x]=(cnt[x]||0)+1;});});
  var keys=Object.keys(cnt).sort(function(a,c){return cnt[c]-cnt[a];}).slice(0,top||5);
  if(!keys.length)return "";
  return '<div><b>'+label+'</b>'+keys.map(function(k){return '<span class="tag">'+esc(k)+' <span class="num" style="color:var(--muted)">'+cnt[k]+'</span></span>';}).join("")+'</div>';
}

    h+='<div class="match"><div class="score s-'+m.tier+' num" aria-label="Match score '+m.score+'">'+m.score+'</div><div style="min-width:0"><div class="nm" style="font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="linkbtn" data-act="open-buyer" data-id="'+esc(b.id)+'">'+esc(b.name||"Unnamed")+'</button> '+heatPill(b)+' <span class="num" style="font-weight:500;color:var(--muted)">'+esc(range(b))+'</span></div><div class="why">'+m.why.map(function(w){return '<span class="'+w[0]+'">'+(w[0]==="ok"?"✓ ":"✗ ")+esc(w[1])+'</span>';}).join(" · ")+'</div><div class="why num">'+esc(b.phone||"no phone")+' · '+esc(b.finance||"finance unknown")+' · last spoke '+ago(b.lastContact)+'</div></div><div class="mact">'+(state.canWrite?'<button class="btn small" data-act="contacted" data-id="'+esc(b.id)+'">Called</button>':'')+'</div></div>';

  }

function saveDraft(){
  var d=draft.data,err=document.getElementById("fErr");
  d.agent=chipsVal("agent")||"";if(!draft.id&&state.me)d.createdBy=state.me;
  if(draft.kind==="buyer"){
    d.name=val("fName");d.phone=val("fPhone");d.email=val("fEmail");
    d.budgetMin=parseMoney(val("fMin"));d.budgetMax=parseMoney(val("fMax"));
    d.finance=chipsVal("finance");d.timeframe=chipsVal("timeframe");d.beds=numOrNull(val("fBeds"));d.baths=numOrNull(val("fBaths"));d.status=val("fStatus")||"Active";
    d.types=chipsVal("types");d.suburbs=chipsVal("suburbs");d.mustHaves=chipsVal("mustHaves");d.source=val("fSource");d.notes=val("fNotes");d.personal=val("fPersonal");
    var prevB=draft.id?(state.buyers.filter(function(x){return x.id===draft.id;})[0]||{}).status:null;if(d.status==="Bought"&&prevB!=="Bought"){d.stageDates=Object.assign({},d.stageDates||{},{Bought:todayStr()});}
    if(!d.name){err.textContent="Add the buyer's name.";err.hidden=false;return;}
    if(d.budgetMin&&d.budgetMax&&d.budgetMin>d.budgetMax){err.textContent="'Budget from' is higher than 'Budget up to'. Swap them.";err.hidden=false;return;}
    if(!draft.id){d.createdAt=nowIso();}
  } else if(draft.kind==="prospect"){
    d.name=val("fName");d.phone=val("fPhone");d.email=val("fEmail");d.address=val("fAddr");d.suburb=val("fSub");d.estValue=parseMoney(val("fVal"));d.beds=numOrNull(val("fBeds"));
    d.type=chipsVal("type")||"House";d.timeframe=chipsVal("timeframe");d.motivation=chipsVal("motivation");d.source=val("fSrc");d.status=val("fStatus")||"Nurturing";
    d.traits=chipsVal("traits");d.personal=val("fPersonal");d.notes=val("fNotes");d.nextFollowUp=val("fNext");
    if(!d.name&&!d.address){err.textContent="Add a name or an address.";err.hidden=false;return;}
    if(!draft.id){d.createdAt=nowIso();d.log=d.log||[];}
  } else {
    d.address=val("fAddr");d.suburb=val("fSub");d.price=parseMoney(val("fPrice"));d.owner=val("fOwner");d.phone=val("fOPhone");
    d.beds=numOrNull(val("fBeds"));d.baths=numOrNull(val("fBaths"));d.land=numOrNull(val("fLand"));
    var prevStage=draft.id?(state.sellers.filter(function(x){return x.id===draft.id;})[0]||{}).stage:null;
    d.type=chipsVal("type")||"House";d.stage=chipsVal("stage")||"Appraisal";d.features=chipsVal("features");d.notes=val("fNotes");d.traits=chipsVal("traits");d.personal=val("fPersonal");d.nextFollowUp=val("fNext");
    if(d.stage!==prevStage){d.stageDates=Object.assign({},d.stageDates||{});if(!d.stageDates[d.stage])d.stageDates[d.stage]=todayStr();if(d.stage==="Sold"){d.nextFollowUp=addDays(7);}}
    if(!d.address){err.textContent="Add the property address.";err.hidden=false;return;}
    if(!draft.id){d.createdAt=nowIso();}
  }
  var dph=draft.kind==="seller"?d.phone:d.phone,dd=dph?findDup(dph,draft.id):null;
  if(dd&&!draft.id&&!draft.dupOk){err.innerHTML='This number is already in the book as <b>'+esc(dd.name)+'</b> ('+esc(dd.kind)+'). <button class="linkbtn" data-act="dup-ok">Save anyway</button>';err.hidden=false;return;}
  var coll={buyer:"buyers",seller:"sellers",prospect:"prospects"}[draft.kind],id=draft.id,body=JSON.parse(JSON.stringify(d));delete body.id;
  var btn=document.querySelector('[data-act="save-draft"]');if(btn){btn.disabled=true;btn.textContent="Saving…";}
  save(coll,id,body).then(function(){toast({buyer:"Buyer saved",seller:"Seller saved",prospect:"Potential seller saved"}[draft&&draft.kind]||"Saved");closeDrawer();}).catch(function(e){if(btn){btn.disabled=false;btn.textContent="Save";}writeErr(e);});
}

/* ---------- buyer log ---------- */
function logBuyer(id,kind,note){
  var b=state.buyers.filter(function(x){return x.id===id;})[0];if(!b)return Promise.resolve();
  var log=(b.log||[]).concat([{date:todayStr(),kind:kind,by:state.me||"",note:note||""}]).slice(-100);
  return patch("buyers",id,{lastContact:nowIso(),log:log});
}

/* ---------- scorecard ---------- */
function weekStrip(cur,tg){
  var day=((new Date().getDay()+6)%7)+1;
  function m(lab,k){var v=cur[k],t=tg[k]||0,pc=t?Math.min(100,v/t*100):0,pace=t?Math.round(t*day/7):0;var behind=t&&v<pace&&v<t;return '<div class="ws"><div class="ws-top"><span>'+lab+'</span><b class="num">'+v+'<small>/'+t+'</small></b></div><div class="meter" aria-hidden="true"><i class="'+(v>=t&&t?"done":"")+'" style="width:'+pc+'%"></i></div><span class="ws-note'+(behind?" behind":"")+'">'+(!t?"no target":v>=t?"done":behind?(pace-v)+" behind pace":"on pace")+'</span></div>';}
  return '<button class="card weekstrip" data-tab="score"><div class="ws-h"><b>This week</b><span>Day '+day+' of 7 · full scorecard ›</span></div><div class="ws-grid">'+m("Follow-ups","touches")+m("New buyers","buyers")+m("Appraisals","appraisals")+m("Listings","listings")+'</div></button>';
}
function vScore(){
  var who=state.scoreWho==null?(state.me||""):state.scoreWho;
  var tg=myTargets(who);
  var ws=weekStart(),cur=weekStats(ws,who);
  var weeks=[];for(var i=7;i>=0;i--){var w=shiftDays(ws,-7*i);weeks.push({ws:w,st:weekStats(w,who)});}
  var streak=0;for(var j=weeks.length-1;j>=0;j--){var met=weeks[j].st.touches>=tg.touches&&tg.touches>0;if(met)streak++;else if(j===weeks.length-1)continue;else break;}
  var day=((new Date().getDay()+6)%7)+1;
  function kpi(lab,k,unit){var v=cur[k],t=tg[k]||0,pc=t?Math.min(100,v/t*100):0;return '<div class="card kpi"><span class="lab">'+lab+'</span><span class="val num">'+v+' <small>/ '+t+'</small></span><div class="meter" aria-hidden="true"><i class="'+(v>=t&&t?"done":"")+'" style="width:'+pc+'%"></i></div><span class="why">'+(t?(v>=t?"Target hit":(t-v)+" to go"):"no target")+'</span></div>';}
  var h='<div class="head"><div><h2>Scorecard</h2><p>This week, Monday to Sunday. Day '+day+' of 7.</p></div><span class="pill '+(streak?"p-ok":"p-stage")+'">'+streak+' week streak</span></div>';
  h+='<div class="seg" role="group" aria-label="Whose numbers" style="justify-self:start"><button data-act="score-who" data-v="" aria-pressed="'+(!who)+'">Team</button>'+agents().map(function(a){return '<button data-act="score-who" data-v="'+esc(a)+'" aria-pressed="'+(who===a)+'">'+esc(a)+'</button>';}).join("")+'</div>';
  if(who)h+='<p class="why">'+esc(who)+'\'s numbers against half the team target. Follow-ups count when '+esc(who)+' logged them while "Viewing as" '+esc(who)+', or on records assigned to them.</p>';
  h+='<div class="kpis">'+kpi("Follow-ups made","touches")+kpi("New buyers added","buyers")+kpi("Appraisals booked","appraisals")+kpi("New listings","listings")+'</div>';
  // chart: touches per week vs target
  var W=680,H=220,L=40,R=16,T=20,B=34,max=Math.max(tg.touches||0,1);weeks.forEach(function(w){max=Math.max(max,w.st.touches);});max=Math.ceil(max*1.15/10)*10||10;
  var bw=(W-L-R)/weeks.length,sy=function(v){return T+(H-T-B)*(1-v/max);};
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Follow-ups per week, last 8 weeks" style="min-width:420px;display:block">';
  [0,max/2,max].forEach(function(v){svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(v)+'" y2="'+sy(v)+'" stroke="var(--line)"/><text x="'+(L-8)+'" y="'+(sy(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+Math.round(v)+'</text>';});
  weeks.forEach(function(w,i){var x=L+i*bw+bw*0.18,bh=sy(0)-sy(w.st.touches),isCur=i===weeks.length-1,hit=w.st.touches>=tg.touches&&tg.touches;svg+='<rect x="'+x+'" y="'+sy(w.st.touches)+'" width="'+(bw*0.64)+'" height="'+Math.max(bh,0)+'" rx="3" fill="'+(hit?"var(--good)":isCur?"var(--sun)":"var(--cold)")+'"/><text x="'+(x+bw*0.32)+'" y="'+(sy(w.st.touches)-6)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">'+w.st.touches+'</text><text x="'+(x+bw*0.32)+'" y="'+(H-12)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+(isCur?"This wk":new Date(w.ws+"T00:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short"}))+'</text>';});
  if(tg.touches)svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(tg.touches)+'" y2="'+sy(tg.touches)+'" stroke="var(--hot)" stroke-dasharray="5 4"/><text x="'+(W-R)+'" y="'+(sy(tg.touches)-6)+'" text-anchor="end" font-size="11" fill="var(--hot)">target '+tg.touches+'</text>';
  svg+='</svg>';
  h+='<section class="card"><div class="sec-title"><h3>Follow-ups per week</h3><span>calls, texts, door knocks and more, logged in the book</span></div><div class="pad chartwrap">'+svg+'</div></section>';
  var tot=weeks.reduce(function(a,w){a.b+=w.st.buyers;a.a+=w.st.appraisals;a.l+=w.st.listings;a.s+=w.st.sold;a.t+=w.st.touches;return a;},{b:0,a:0,l:0,s:0,t:0});
  h+='<section class="card pad gsec"><h3>Last 8 weeks</h3><p class="num">'+tot.t+' follow-ups · '+tot.b+' new buyers · '+tot.a+' appraisals · '+tot.l+' new listings · '+tot.s+' sold</p><p class="why">'+(tot.a>=2&&tot.t>=10?"Roughly 1 appraisal for every "+Math.max(1,Math.round(tot.t/tot.a))+" follow-ups. ":"")+(tot.a>=3&&tot.l?"About "+Math.round(tot.l/tot.a*100)+"% of appraisals turned into listings.":"Keep logging every follow-up and these conversion rates will fill in.")+'</p></section>';
  h+='<section class="card pad" style="display:grid;gap:12px"><h3 style="font-size:19px">Weekly team targets</h3><div class="targets"><label class="f"><span>Follow-ups</span><input id="tg_touches" inputmode="numeric" value="'+esc(tg.touches)+'" '+(state.canWrite?"":"disabled")+'></label><label class="f"><span>New buyers</span><input id="tg_buyers" inputmode="numeric" value="'+esc(tg.buyers)+'" '+(state.canWrite?"":"disabled")+'></label><label class="f"><span>Appraisals</span><input id="tg_appraisals" inputmode="numeric" value="'+esc(tg.appraisals)+'" '+(state.canWrite?"":"disabled")+'></label><label class="f"><span>Listings</span><input id="tg_listings" inputmode="numeric" value="'+esc(tg.listings)+'" '+(state.canWrite?"":"disabled")+'></label></div>'+(state.canWrite?'<div><button class="btn small" data-act="save-targets">Save targets</button></div>':'')+'<p class="why">Shared by Jayden and James: the book counts both of you together.</p></section>';
  return h;
}

  var want=[b.beds?b.beds+"+ bed":"",(b.suburbs||[]).slice(0,2).join("/")].filter(Boolean).join(" in ");

function demandText(p){
  var act=state.buyers.filter(function(b){return (b.status||"Active")==="Active";});
  var ms=matchesFor(p),fit=ms.filter(function(x){return x.m.score>=65;});

  var sub=p.suburb?act.filter(function(b){return (b.suburbs||[]).indexOf(p.suburb)>-1;}).length:0;

function vDemand(){

  var openP=state.prospects.filter(function(r){var s=r.status||"Nurturing";return s==="Nurturing"||s==="Appraisal booked";}),openS=state.sellers.filter(function(s){return s.stage!=="Sold";});
  var rows=Object.keys(set).map(function(s){

  h+='<section class="card"><div class="prev" style="border:0"><table class="dtab"><thead><tr><th>Suburb</th><th>Buyers wanting it</th><th>Hot</th><th>Typical top budget</th><th>Beds</th><th>Your homes there</th><th>Signal</th></tr></thead><tbody>'+rows.map(function(r){return '<tr><td><b>'+esc(r.s)+'</b></td><td><div class="dbar"><i style="width:'+Math.round(r.w/max*110)+'px"></i><span class="num">'+r.w+'</span></div></td><td class="n">'+r.hot+'</td><td class="n">'+(r.bud?money(r.bud):"–")+'</td><td class="n">'+(r.bd?r.bd+"+":"–")+'</td><td class="n">'+r.sup+'</td><td><span class="sig sig-'+r.sig[0]+'">'+r.sig[1]+'</span></td></tr>';}).join("")+'</tbody></table></div></section>';

document.getElementById("gateOut").addEventListener("click",function(){if(window.BB)window.BB.signOut();});
var bootTimer=setTimeout(function(){if(!window.BB)gate("Couldn't load the book.",false,"Check your internet connection, then reload this page.");},15000);
function newLeadAlert(){toast("New website lead. Call them now.");try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(x){}
  try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;var a=new C(),t=a.currentTime;[880,1320].forEach(function(f,i){var o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+i*.18);g.gain.exponentialRampToValueAtTime(0.25,t+i*.18+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+i*.18+.16);o.connect(g);g.connect(a.destination);o.start(t+i*.18);o.stop(t+i*.18+.17);});}catch(x){}}
setInterval(function(){if(state.inbox&&state.inbox.length&&state.tab==="today"&&!(document.getElementById("overlay")||{}).innerHTML&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||""))render();},60000);
function rows(snap){return snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});}
window.addEventListener("bb-auth",function(ev){
  var d=ev.detail||{};clearTimeout(bootTimer);
  subs.forEach(function(u){try{u();}catch(x){}});subs=[];
  if(d.state==="out"){state.db=null;state.user=null;gate("Sign in with the Google account Jason gave access to.",true);return;}
  if(d.state==="denied"){gate("This account doesn't have access yet.",false,(d.email||"This account")+" isn't on the access list. Ask Jason to add it, then reload.",true);return;}
  if(d.state==="error"){gate("Couldn't open the book.",false,"Something went wrong: "+(d.code||"unknown")+". Reload to try again.",true);return;}
  if(d.state!=="ok")return;
  document.getElementById("gate").hidden=true;
  state.db=d.db;state.user={email:d.email,admin:d.admin};state.dbMode="db";state.canWrite=true;booted=true;
  state.ready={b:false,s:false,p:false};
  var myName=d.name||"";if(!state.me&&myName&&agents().indexOf(myName)>-1){state.me=myName;try{localStorage.setItem("bb_me",myName);}catch(x){}}
  render();
  function fail(e){if(e&&e.code==="permission-denied"){gate("Your access has changed.",false,"Ask Jason to check you're still on the access list.",true);}render();}
  subs.push(d.db.collection("buyers").onSnapshot(function(s){state.buyers=rows(s);state.ready.b=true;render();},fail));
  subs.push(d.db.collection("sellers").onSnapshot(function(s){state.sellers=rows(s);state.ready.s=true;render();},fail));
  subs.push(d.db.collection("prospects").onSnapshot(function(s){state.prospects=rows(s);state.ready.p=true;render();},fail));
  subs.push(d.db.collection("inbox").onSnapshot(function(s){var prev=state.inboxSeen;state.inbox=rows(s);var ids=state.inbox.map(function(x){return x.id;});if(prev&&ids.some(function(i){return prev.indexOf(i)<0;}))newLeadAlert();state.inboxSeen=ids;document.title=(state.inbox.length?"("+state.inbox.length+") ":"")+"Cooke & Harper Buyer Book";var t=document.querySelector('[data-tab="today"]');if(t)t.innerHTML="Today"+(state.inbox.length?' <span class="ct num">'+state.inbox.length+' new</span>':"");render();},function(){}));
  subs.push(d.db.doc("settings/main").onSnapshot(function(x){if(x.exists){var v=x.data();if(v&&v.bands&&v.bands.length===2)state.settings=Object.assign({},state.settings,v);if(v&&v.team)document.getElementById("teamName").textContent=v.team;render();}},function(){}));
  subs.push(d.onBook(function(b){state.book=b||{members:[],names:{}};if(state.tab==="guide")render();}));
});
})();

const BOOK="cooke-harper", ADMINS=["admin@bakerproduction.com","jasonbaker@bakerproduction.com"];
const send=(detail)=>window.dispatchEvent(new CustomEvent("bb-auth",{detail}));
try{
  const {initializeApp}=await import(BASE+"firebase-app.js");
  const A=await import(BASE+"firebase-auth.js");
  const F=await import(BASE+"firebase-firestore.js");
  const app=initializeApp(CFG,"buyerbook");

  try{ fdb=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); }
  catch(e){ fdb=F.getFirestore(app); }
  const root="bb/"+BOOK;
  const err=(e)=>{ const x=new Error(e&&e.message||String(e)); x.code=e&&e.code||"unavailable"; return x; };
  const wrapDoc=(r)=>({id:r.id,
    set:(d)=>F.setDoc(r,d).catch(e=>{throw err(e);}),
    update:(d)=>F.updateDoc(r,d).catch(e=>{throw err(e);}),
    delete:()=>F.deleteDoc(r).catch(e=>{throw err(e);}),
    onSnapshot:(n,ecb)=>F.onSnapshot(r,(s)=>n({id:s.id,exists:s.exists(),data:()=>s.data()}),(e)=>ecb&&ecb(err(e)))});
  const db={
    collection:(c)=>{const col=F.collection(fdb,root+"/"+c);return{
      doc:(id)=>wrapDoc(id?F.doc(col,id):F.doc(col)),
      onSnapshot:(n,ecb)=>F.onSnapshot(col,(s)=>n({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),size:s.size}),(e)=>ecb&&ecb(err(e)))};},
    doc:(p)=>wrapDoc(F.doc(fdb,root+"/"+p))
  };
  const bookRef=F.doc(fdb,root);

    signIn:async()=>{const p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
      try{ await A.signInWithPopup(auth,p); }
      catch(e){ if(e&&/popup|operation-not-supported|web-storage/.test(e.code||"")){ await A.signInWithRedirect(auth,p); } else throw e; }},
    signOut:()=>A.signOut(auth),
    saveMembers:(members,names)=>F.setDoc(bookRef,{members,names},{merge:true}).catch(e=>{throw err(e);})
  };
  A.getRedirectResult(auth).catch(()=>{});
  A.onAuthStateChanged(auth, async (u)=>{
    if(!u){ send({state:"out"}); return; }
    const email=(u.email||"").toLowerCase(), admin=ADMINS.includes(email);
    try{
      let s=await F.getDoc(bookRef);
      if(!s.exists()&&admin){ await F.setDoc(bookRef,{members:[],names:{},createdAt:new Date().toISOString()}); s=await F.getDoc(bookRef); }
      if(!s.exists()){ send({state:"denied",email}); return; }
      const data=s.data()||{};
      if(!admin&&!(data.members||[]).includes(email)){ send({state:"denied",email}); return; }
      const onBook=(cb)=>F.onSnapshot(bookRef,(x)=>cb(x.exists()?x.data():{members:[],names:{}}),()=>{});
      send({state:"ok",db,email,admin,name:(data.names||{})[email]||"",onBook});
    }catch(e){
      if(e&&e.code==="permission-denied") send({state:"denied",email});
      else send({state:"error",email,code:e&&e.code||String(e)});
    }
  });
}catch(e){
  send({state:"error",code:"load-failed"});
}
</script>
