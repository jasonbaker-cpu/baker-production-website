<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Baker Lots</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f4f2;--panel:#fff;--ink:#1b1b1b;--muted:#6b6b6b;--line:#e3e3df;--accent:#111;--hl:#0a7cff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--panel:#1c1c1c;--ink:#f2f2f2;--muted:#a3a3a3;--line:#2e2e2e;--accent:#f2f2f2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font:700 18px/1 Poppins,sans-serif;margin:0}
header .step{color:var(--muted);font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.stage{background:#222;border-radius:12px;position:relative;min-height:420px;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.stage canvas{max-width:100%;display:block;cursor:crosshair}
.drop{color:#ddd;text-align:center;padding:40px}
.drop b{display:block;font:700 20px Poppins,sans-serif;color:#fff;margin-bottom:6px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;align-self:start}
.side h2{font:700 14px Poppins,sans-serif;margin:6px 0 0;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
button,.btn{font:600 14px Inter,sans-serif;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted);margin:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
[hidden]{display:none!important}
</style></head><body>
<header><h1>Baker Lots</h1><span class="step" id="stepTxt">1. Open a top-down photo</span>
<span style="margin-left:auto" class="btns"><button id="openBtn">Open photo</button><button id="resetBtn" disabled>Redo corners</button></span>
<input type="file" id="fileIn" accept="image/*" hidden></header>
<main>
<div class="stage" id="stage"><div class="drop" id="dropMsg"><b>Drop a top-down drone photo here</b>or press Open photo. Use the clean top-down (no labels).</div><canvas id="cv" hidden></canvas></div>
<aside class="side">
  <p class="hint" id="help">Open the top-down. Then click the 4 corners of the block, then click the side that faces the street.</p>
  <div id="ctl" hidden>
    <h2>Lots</h2>
    <div class="row"><label>Number of lots<input type="number" id="n" min="2" max="10" value="4"></label>
    <label>Layout<select id="layout"><option value="stack">Front to back</option><option value="side">Side by side</option></select></label></div>
    <div class="row"><label>Driveway<select id="drive"><option value="b">One side</option><option value="a">Other side</option><option value="none">None</option></select></label>
    <label>Driveway width (m)<input type="number" id="dw" value="4" step="0.5"></label></div>
    <div class="row"><label>Frontage (m)<input type="number" id="front" value="30" step="0.1"></label>
    <label>Total block (m²)<input type="number" id="area" placeholder="optional"></label></div>
    <p class="hint">Drag the lines between lots on the picture to resize them.</p>
    <button id="evenBtn">Make lots equal</button>
    <h2>Look</h2>
    <label>Street name<input type="text" id="street" placeholder="ALBANY HIGHWAY"></label>
    <div class="row"><label>Street on<select id="orient"><option value="right">Right</option><option value="bottom">Bottom</option></select></label>
    <label>North arrow (°)<input type="number" id="north" value="0" step="1"></label></div>
    <label>Extra line (e.g. zoning)<input type="text" id="note" placeholder="Zoned R25/60"></label>
    <label class="chk"><input type="checkbox" id="square"> Square up the block</label>
    <label class="chk"><input type="checkbox" id="blur"> Blur around the block</label>
    <label class="chk"><input type="checkbox" id="showArea"> Show approx lot sizes</label>
    <label class="chk"><input type="checkbox" id="disc" checked> "Illustration only" line</label>
    <label>Agency logo (PNG, optional)<input type="file" id="logoIn" accept="image/*"></label>
    <div class="btns"><button class="primary" id="dlBtn">Download JPG</button></div>
  </div>
</aside>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
let img=null, yaw=null, pts=[], street=-1, logo=null, cuts=null, drag=null, view=null, fname='lots';
const ctlIds=['n','layout','drive','dw','front','area','street','orient','north','note','square','blur','showArea','disc'];

function setStep(t,h){ $('stepTxt').textContent=t; if(h!==undefined) $('help').textContent=h; }

// ---------- loading ----------
async function loadBlob(blob,name){
  fname=(name||'lots').replace(/\.[a-z0-9]+$/i,'');
  try{ const txt=new TextDecoder('latin1').decode(await blob.slice(0,200000).arrayBuffer());
    const m=txt.match(/(?:GimbalYawDegree|FlightYawDegree)="?\s*([-+]?\d+(?:\.\d+)?)/); yaw=m?parseFloat(m[1]):null; }catch(e){ yaw=null; }
  const url=URL.createObjectURL(blob); const im=new Image();
  im.onload=()=>{ img=im; pts=[]; street=-1; cuts=null; $('dropMsg').hidden=true; cv.hidden=false; $('ctl').hidden=true; $('resetBtn').disabled=false;
    if(window.__auto){ const A=window.__auto; pts=A.c; street=A.e; if(A.yaw!==null) yaw=A.yaw; ['front','area','n','dw'].forEach(k=>{ if(A[k]) $(k).value=A[k]; }); if(A.drive) $('drive').value=A.drive;
      if(A.n) cuts=null; $('ctl').hidden=false; $('north').value=Math.round(-(yaw||0) + frame(1000).rot*180/Math.PI); setStep('4. Set up the lots, then Download','Pre-filled from the drone job. Drag the blue dots to resize lots.'); draw(); window.__lotsReady=true; return; }
    setStep('2. Click the 4 corners of the block','Click each corner of the block, going around it. You can drag a corner after placing it.'); draw(); };
  im.src=url;
}
$('openBtn').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{ const f=e.target.files[0]; if(f) loadBlob(f,f.name); };
$('stage').addEventListener('dragover',e=>e.preventDefault());
$('stage').addEventListener('drop',e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) loadBlob(f,f.name); });
$('resetBtn').onclick=()=>{ pts=[]; street=-1; cuts=null; $('ctl').hidden=true; setStep('2. Click the 4 corners of the block','Click each corner of the block, going around it.'); draw(); };
$('logoIn').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const im=new Image(); im.onload=()=>{ logo=im; draw(); }; im.src=URL.createObjectURL(f); };
{ const q=new URLSearchParams(location.search).get('img'); if(q) fetch(q).then(r=>r.ok?r.blob():Promise.reject()).then(b=>loadBlob(b,q.split('/').pop())).catch(()=>setStep('Couldn\'t load that photo — open it by hand.')); }
{ const u=new URLSearchParams(location.search); if(u.get('street')) $('street').value=u.get('street'); if(u.get('north')) window.__north=+u.get('north'); }
// 2 Nov: auto mode for the nightly drone run — c=x1,y1,..x4,y4 (corners in photo px) e=street edge index, plus front/area/n/yaw/drive
{ const u=new URLSearchParams(location.search), c=u.get('c'); if(c){ const v=c.split(',').map(Number); if(v.length===8) window.__auto={ c:[[v[0],v[1]],[v[2],v[3]],[v[4],v[5]],[v[6],v[7]]], e:+u.get('e')||0, front:u.get('front'), area:u.get('area'), n:u.get('n'), dw:u.get('dw'), drive:u.get('drive'), yaw:u.get('yaw')!==null?+u.get('yaw'):null }; } }
window.__lotsExport=()=>{ const c=document.createElement('canvas'); render(c.getContext('2d'),3000,false); return c.toDataURL('image/jpeg',.92); };

// ---------- geometry ----------
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], mul=(a,k)=>[a[0]*k,a[1]*k], lerp=(a,b,t)=>add(a,mul(sub(b,a),t));
function order(){ // corners around the block, front edge = street
  const e=street; const A=pts[e], B=pts[(e+1)%4], C=pts[(e+2)%4], D=pts[(e+3)%4];
  return {A,B,C,D}; // A-B front, D adjacent to A, C adjacent to B
}
function Pimg(u,v){ const {A,B,C,D}=order(); const R=lerp(D,C,u), F=lerp(A,B,u); return lerp(R,F,v); }
function shoelace(p){ let s=0; for(let i=0;i<p.length;i++){ const a=p[i],b=p[(i+1)%p.length]; s+=a[0]*b[1]-b[0]*a[1]; } return Math.abs(s)/2; }

// layout: returns {lots:[[u0,u1,v0,v1]...], drive:[u0,u1,v0,v1]|null}
function plan(){
  const n=Math.max(2,Math.min(10,+$('n').value||4)), lay=$('layout').value, dr=$('drive').value;
  const fr=Math.max(1,+$('front').value||30), dwf=dr==='none'||lay==='side'?0:Math.min(.45,(+$('dw').value||0)/fr);
  if(!cuts||cuts.length!==n-1||cuts.lay!==lay){ cuts=[]; for(let i=1;i<n;i++) cuts.push(i/n); cuts.lay=lay; }
  const ua=dr==='a'?dwf:0, ub=dr==='b'?1-dwf:1;
  const edges=[0,...cuts,1], lots=[];
  for(let i=0;i<n;i++){
    if(lay==='stack'){ const v1=1-edges[i], v0=1-edges[i+1]; lots.push([ua,ub,v0,v1]); }   // lot 1 at the street
    else lots.push([edges[i],edges[i+1],0,1]);
  }
  const drive=dwf>0?(dr==='a'?[0,dwf,0,1]:[1-dwf,1,0,1]):null;
  return {lots,drive,n,lay};
}

// output transform: image px -> output px
function frame(W){
  const {A,B,C,D}=order(), cen=mul(add(add(A,B),add(C,D)),.25), mid=mul(add(A,B),.5), inw=sub(cen,mid);
  const target=$('orient').value==='right'?Math.PI:-Math.PI/2;
  const rot=target-Math.atan2(inw[1],inw[0]), c=Math.cos(rot), s=Math.sin(rot);
  const R=p=>[c*p[0]-s*p[1], s*p[0]+c*p[1]];
  const q=[A,B,C,D].map(R); const xs=q.map(p=>p[0]), ys=q.map(p=>p[1]);
  const bx0=Math.min(...xs),bx1=Math.max(...xs),by0=Math.min(...ys),by1=Math.max(...ys), bw=bx1-bx0, bh=by1-by0;
  let fw=Math.max(bw/0.6, bh/0.6*1.5), fh=fw/1.5;
  let cx=(bx0+bx1)/2, cy=(by0+by1)/2; if($('orient').value==='right') cx+=fw*.07; else cy+=fh*.07;
  const k=W/fw; const ox=cx-fw/2, oy=cy-fh/2;
  const T=p=>{ const r=R(p); return [(r[0]-ox)*k,(r[1]-oy)*k]; };
  return {T,rot,k,ox,oy,W,H:Math.round(fh*k),c,s};
}

function render(g,W,interactive){
  const F=frame(W), {T,W:OW,H:OH}=F; g.canvas.width=OW; g.canvas.height=OH;
  const pl=plan();
  let Q;
  if($('square').checked){
    const tA=T(Pimg(0,1)),tB=T(Pimg(1,1)),tC=T(Pimg(1,0)),tD=T(Pimg(0,0));
    if($('orient').value==='right'){ const xf=(tA[0]+tB[0])/2, xr=(tC[0]+tD[0])/2, ya=(tA[1]+tD[1])/2, yb=(tB[1]+tC[1])/2; Q=(u,v)=>[xr+(xf-xr)*v, ya+(yb-ya)*u]; }
    else { const yf=(tA[1]+tB[1])/2, yr=(tC[1]+tD[1])/2, xa=(tA[0]+tD[0])/2, xb=(tB[0]+tC[0])/2; Q=(u,v)=>[xa+(xb-xa)*u, yr+(yf-yr)*v]; }
  } else Q=(u,v)=>T(Pimg(u,v));
  // photo
  const drawImg=()=>{ g.save(); g.setTransform(F.k*F.c,F.k*F.s,-F.k*F.s,F.k*F.c,-F.ox*F.k,-F.oy*F.k); g.drawImage(img,0,0); g.restore(); };
  g.fillStyle='#202020'; g.fillRect(0,0,OW,OH); g.save(); g.filter=`blur(${Math.round(OW/40)}px)`; g.drawImage(img,-OW*.05,-OH*.05,OW*1.1,OH*1.1); g.restore();
  const outer=[Q(0,0),Q(1,0),Q(1,1),Q(0,1)];
  if($('blur').checked){ g.save(); g.filter=`blur(${Math.round(OW/110)}px)`; drawImg(); g.restore();
    g.save(); g.beginPath(); outer.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p)); g.closePath(); g.clip(); drawImg(); g.restore(); }
  else drawImg();
  // lines
  const lw=Math.max(2.5,OW/240); g.lineJoin='miter'; g.strokeStyle='#fff'; g.lineWidth=lw;
  const poly=(u0,u1,v0,v1)=>{ g.beginPath(); [[u0,v0],[u1,v0],[u1,v1],[u0,v1]].forEach(([u,v],i)=>{ const p=Q(u,v); i?g.lineTo(...p):g.moveTo(...p); }); g.closePath(); g.stroke(); };
  // lots: corners on the driveway side get a small splay (V notches), like the agency diagrams
  const pxm=Math.hypot(...sub(Q(0,1),Q(1,1)))/Math.max(1,+$('front').value||30), depthM=(Math.hypot(...sub(Q(0,0),Q(0,1)))+Math.hypot(...sub(Q(1,0),Q(1,1))))/2/pxm;
  const cutM=Math.min(2,(+$('dw').value||4)*0.4), cu=cutM/Math.max(1,+$('front').value||30), cv=cutM/Math.max(1,depthM);
  const dside=pl.drive?($('drive').value==='a'?'a':'b'):null;
  const lotPoly=l=>{ const [u0,u1,v0,v1]=l, C=[[u0,v0],[u1,v0],[u1,v1],[u0,v1]], ue=dside==='a'?u0:u1, out=[];
    C.forEach((c,i)=>{ const cut=dside && pl.lay==='stack' && Math.abs(c[0]-ue)<1e-9 && !(c[1]<1e-9);
      if(!cut){ out.push(c); return; } const p=C[(i+3)%4], n=C[(i+1)%4];
      const tp=Math.abs(p[0]-c[0])>1e-9?cu/Math.abs(p[0]-c[0]):cv/Math.abs(p[1]-c[1]), tn=Math.abs(n[0]-c[0])>1e-9?cu/Math.abs(n[0]-c[0]):cv/Math.abs(n[1]-c[1]);
      out.push([c[0]+(p[0]-c[0])*Math.min(.45,tp), c[1]+(p[1]-c[1])*Math.min(.45,tp)], [c[0]+(n[0]-c[0])*Math.min(.45,tn), c[1]+(n[1]-c[1])*Math.min(.45,tn)]); });
    return out; };
  const strokeUV=(L,close)=>{ g.beginPath(); L.forEach(([u,v],i)=>{ const p=Q(u,v); i?g.lineTo(...p):g.moveTo(...p); }); if(close) g.closePath(); g.stroke(); };
  g.shadowColor='rgba(0,0,0,.35)'; g.shadowBlur=lw;
  strokeUV([[0,0],[1,0],[1,1],[0,1]],true); pl.lots.forEach(l=>strokeUV(lotPoly(l),true)); if(pl.drive && pl.lay!=='stack') poly(...pl.drive);
  g.shadowBlur=0;
  // labels
  const total=+$('area').value||0, full=shoelace(outer);
  // dark=true: black letters with a white outline (lot names, like the sample); otherwise white with a soft shadow
  const text=(t,p,size,weight,angle,dark)=>{ g.save(); g.translate(p[0],p[1]); if(angle) g.rotate(angle); g.font=`${weight} ${size}px Poppins, sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.lineJoin='round';
    if(dark){ g.lineWidth=Math.max(3,size/7); g.strokeStyle='#fff'; g.shadowColor='rgba(0,0,0,.35)'; g.shadowBlur=size/10; g.strokeText(t,0,0); g.shadowBlur=0; g.fillStyle='#111'; g.fillText(t,0,0); }
    else { g.shadowColor='rgba(0,0,0,.75)'; g.shadowBlur=size/5; g.lineWidth=Math.max(1.5,size/16); g.strokeStyle='rgba(0,0,0,.55)'; g.strokeText(t,0,0); g.shadowBlur=size/8; g.fillStyle='#fff'; g.fillText(t,0,0); }
    g.restore(); };
  const fit=(u0,u1,v0,v1)=>{ const a=Q(u0,v0),b=Q(u1,v1); const c=Q(u0,v1), d=Q(u1,v0); const w=Math.min(Math.hypot(...sub(a,c)),Math.hypot(...sub(a,d))); return w; };
  pl.lots.forEach((l,i)=>{ const c=mul(add(Q(l[0],l[2]),Q(l[1],l[3])),.5); const boxW=Math.min(Math.hypot(...sub(Q(l[0],l[2]),Q(l[1],l[2]))),Math.hypot(...sub(Q(l[0],l[2]),Q(l[0],l[3]))));
    const size=Math.max(14,Math.min(OW/22, boxW/3.1)); text(`Lot ${i+1}`,c,size,500,0,true);
    if($('showArea').checked && total){ const a=shoelace([Q(l[0],l[2]),Q(l[1],l[2]),Q(l[1],l[3]),Q(l[0],l[3])])/full*total; text(`≈ ${Math.round(a)} m²`,[c[0],c[1]+size*0.9],size*0.42,500,0,true); } });
  if(pl.drive){ const d=pl.drive, a=Q((d[0]+d[1])/2,0), b=Q((d[0]+d[1])/2,1); let ang=Math.atan2(b[1]-a[1],b[0]-a[0]); if(ang>Math.PI/2) ang-=Math.PI; if(ang<-Math.PI/2) ang+=Math.PI;
    const w=Math.hypot(...sub(Q(d[0],.5),Q(d[1],.5))); text('Driveway',mul(add(a,b),.5),Math.max(12,Math.min(OW/45,w*.55)),500,ang); }
  const st=$('street').value.trim().toUpperCase();
  if(st){ const f=mul(add(Q(0,1),Q(1,1)),.5); const right=$('orient').value==='right';
    const p=right?[f[0]+(OW-f[0])*.5, f[1]]:[f[0], f[1]+(OH-f[1])*.5]; text(st,p,OW/24,700,right?Math.PI/2:0); }
  const note=$('note').value.trim(); if(note){ const r=$('orient').value==='right'; const yb=Math.max(...outer.map(p=>p[1])); text(note,[r?(Math.min(...outer.map(p=>p[0]))+Math.max(...outer.map(p=>p[0])))/2:OW/2, Math.min(OH-OW*.06, yb+OW*.035)],OW/40,500,0); }
  // north arrow
  { const r=OW/30, cx=OW-r*1.6, cy=r*1.6, a=(+$('north').value||0)*Math.PI/180; g.save(); g.translate(cx,cy); g.fillStyle='rgba(28,28,28,.92)'; g.beginPath(); g.arc(0,0,r,0,7); g.fill(); g.rotate(a);
    g.fillStyle='#f4f4f4'; g.beginPath(); g.moveTo(0,-r*.72); g.lineTo(r*.42,r*.55); g.lineTo(0,r*.25); g.closePath(); g.fill();
    g.fillStyle='#9a9a9a'; g.beginPath(); g.moveTo(0,-r*.72); g.lineTo(-r*.42,r*.55); g.lineTo(0,r*.25); g.closePath(); g.fill(); g.restore(); }
  if(logo){ const lw2=OW*.18, lh=lw2*logo.height/logo.width; g.globalAlpha=.92; g.drawImage(logo,OW-lw2-OW*.025,OH-lh-OW*.03,lw2,lh); g.globalAlpha=1; }
  if($('disc').checked){ g.font=`500 ${Math.round(OW/95)}px Poppins, sans-serif`; g.textAlign='center'; g.textBaseline='bottom'; g.lineWidth=3; g.strokeStyle='rgba(0,0,0,.7)'; g.strokeText('Above diagram is for illustration purposes only and should not be relied upon',OW/2,OH-OW*.012); g.fillStyle='#eee'; g.fillText('Above diagram is for illustration purposes only and should not be relied upon',OW/2,OH-OW*.012); }
  if(interactive){ view={Q,pl,W:OW,H:OH}; // divider handles
    g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--hl')||'#0a7cff';
    divs(pl).forEach(d=>{ const p=mul(add(d.a,d.b),.5); g.beginPath(); g.arc(p[0],p[1],Math.max(6,OW/150),0,7); g.fill(); }); }
}
function divs(pl){ const Q=view?view.Q:null; if(!Q) return []; const out=[];
  cuts.forEach((c,i)=>{ if(pl.lay==='stack'){ const v=1-c, l=pl.lots[0]; out.push({i,a:Q(l[0],v),b:Q(l[1],v)}); } else out.push({i,a:Q(c,0),b:Q(c,1)}); }); return out; }

// ---------- drawing / interaction ----------
function fitScale(){ const st=$('stage').getBoundingClientRect(); return Math.min(1,(st.width-0)/img.width, (Math.max(420,innerHeight-120))/img.height); }
function draw(){
  if(!img) return;
  if(street<0){ // corner stage: show the photo
    const k=fitScale(); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k); view=null;
    ctx.drawImage(img,0,0,cv.width,cv.height); ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.fillStyle='#0a7cff';
    const P=pts.map(p=>[p[0]*k,p[1]*k]);
    if(P.length>1){ ctx.beginPath(); P.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p)); if(P.length===4) ctx.closePath(); ctx.stroke(); }
    P.forEach((p,i)=>{ ctx.beginPath(); ctx.arc(p[0],p[1],7,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='600 12px Inter'; ctx.fillText(i+1,p[0]+9,p[1]-9); ctx.fillStyle='#0a7cff'; });
    return;
  }
  const W=Math.min(1600,Math.round($('stage').getBoundingClientRect().width)); render(ctx,W,true);
}
function evPt(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; }
function segDist(p,a,b){ const ab=sub(b,a), t=Math.max(0,Math.min(1,((p[0]-a[0])*ab[0]+(p[1]-a[1])*ab[1])/(ab[0]**2+ab[1]**2))); return Math.hypot(...sub(p,add(a,mul(ab,t)))); }
cv.addEventListener('pointerdown',e=>{
  if(!img) return; const p=evPt(e);
  if(street<0){ const k=fitScale(), ip=[p[0]/k,p[1]/k];
    const hit=pts.findIndex(q=>Math.hypot(q[0]-ip[0],q[1]-ip[1])<14/k);
    if(hit>=0){ drag={type:'corner',i:hit}; cv.setPointerCapture(e.pointerId); return; }
    if(pts.length<4){ pts.push(ip); draw(); if(pts.length===4) setStep('3. Click the side that faces the street','Click on the block edge that runs along the street.'); return; }
    // choose street edge
    let best=-1,bd=1e9; for(let i=0;i<4;i++){ const d=segDist(ip,pts[i],pts[(i+1)%4]); if(d<bd){bd=d;best=i;} }
    street=best; cuts=null; if(window.__north!==undefined) $('north').value=window.__north; else if(yaw!==null) $('north').value=Math.round(-yaw + frame(1000).rot*180/Math.PI);
    $('ctl').hidden=false; setStep('4. Set up the lots, then Download','Drag the blue dots to resize lots. Change anything on the right.'); draw(); return; }
  const pl=view.pl; let best=null,bd=1e9; divs(pl).forEach(d=>{ const dd=segDist(p,d.a,d.b); if(dd<bd){bd=dd;best=d;} });
  if(best && bd<Math.max(14,view.W/90)){ drag={type:'div',i:best.i}; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener('pointermove',e=>{ if(!drag) return; const p=evPt(e);
  if(drag.type==='corner'){ const k=fitScale(); pts[drag.i]=[p[0]/k,p[1]/k]; draw(); return; }
  const pl=view.pl, Q=view.Q, i=drag.i, lo=i?cuts[i-1]+.03:.03, hi=i<cuts.length-1?cuts[i+1]-.03:.97;
  let best=cuts[i],bd=1e9; for(let s=0;s<=200;s++){ const c=lo+(hi-lo)*s/200; const a=pl.lay==='stack'?Q(pl.lots[0][0],1-c):Q(c,0), b=pl.lay==='stack'?Q(pl.lots[0][1],1-c):Q(c,1); const d=segDist(p,a,b); if(d<bd){bd=d;best=c;} }
  const lay=cuts.lay; cuts[i]=best; cuts.lay=lay; draw(); });
cv.addEventListener('pointerup',()=>{ drag=null; });
ctlIds.forEach(id=>{ $(id).addEventListener('input',()=>{ if(id==='n'||id==='layout') cuts=null; if(id==='orient'&&yaw!==null) $('north').value=Math.round(-yaw + frame(1000).rot*180/Math.PI); draw(); }); });
$('evenBtn').onclick=()=>{ cuts=null; draw(); };
addEventListener('resize',draw);
$('dlBtn').onclick=()=>{ const c=document.createElement('canvas'); render(c.getContext('2d'),3000,false);
  c.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`${($('street').value||fname).trim().replace(/\W+/g,'_')}_${$('n').value}_lots.jpg`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); },'image/jpeg',.92); draw(); };
document.fonts && document.fonts.load('700 40px Poppins').then(draw);
})();
</script></body></html>
