<style>
/* Layout: one phone-width column, like the iPhone app — dark camera-app world, gold accent from the Baker Snap icon. */
:root {
  color-scheme: dark;
  --ink: #0e0d0b;      /* page */
  --panel: #17150f;    /* cards */
  --raise: #221f17;    /* pressed / chips */
  --line: #2f2a20;
  --text: #f2eee5;
  --muted: #9d978a;
  --gold: #e3bc72;
  --gold-ink: #1a1408;
  --good: #82d59c;
  --warn: #f1aa5d;
  --bad: #ef7b6c;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;

}
* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--text); }
body { font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }

.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 120px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); display: flex; align-items: center; gap: 10px; padding-block: 14px 12px; min-height: 64px; }

.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.spacer { flex: 1; }
.pill { font: 600 12px/1 var(--body); letter-spacing: .02em; padding: 7px 10px; border-radius: 999px; background: var(--raise); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

/* type */
.eyebrow { font: 600 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h2 { font: 800 30px/1.05 var(--display); letter-spacing: -0.03em; margin: 8px 0 10px; text-wrap: balance; }
h3 { font: 600 16px/1.3 var(--body); margin: 0; }

/* blocks */
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 18px; border-radius: var(--r); border: 0; background: var(--text); color: #0e0d0b; font-weight: 700; }

.btn.wide { width: 100%; }

.btn svg { width: 18px; height: 18px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { min-width: 0; }

/* listings */
.listing { display: flex; gap: 14px; align-items: center; text-align: left; width: 100%; color: inherit; }
.thumb { width: 92px; aspect-ratio: 4/3; border-radius: 12px; background: var(--raise) center/cover no-repeat; flex: none; }
.listing .meta { flex: 1; min-width: 0; }
.listing .addr { font-weight: 600; font-size: 16px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 3px 7px; border-radius: 6px; background: var(--raise); color: var(--muted); }

/* shot list */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 600; }

.scroller::-webkit-scrollbar { display: none; }
.scroller .chip { flex: none; }

/* photo grid */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cell { position: relative; aspect-ratio: 4/3; border-radius: 12px; overflow: hidden; background: var(--raise) center/cover no-repeat; border: 0; padding: 0; }

.badge.gold { background: var(--gold); color: var(--gold-ink); }
.badge.good { background: var(--good); color: #0b1a10; }
.badge.warn { background: var(--warn); color: #1c1006; }
.cell.dim::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.35); }
.cell .badges { z-index: 1; }

/* photo view */
.stage { position: relative; background: #000; border-radius: 16px; overflow: hidden; touch-action: pan-y; }
.stage img { display: block; width: 100%; height: auto; }
.stage .before { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.split { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 6px rgba(0,0,0,.5); }
.split::after { content: "⇆"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 30px; height: 30px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; font-size: 14px; }
.corner { position: absolute; top: 8px; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.35); }
.steps { background: rgba(20,18,13,.86); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 240px; }
.step { display: flex; align-items: center; gap: 10px; font-size: 14px; color: rgba(255,255,255,.5); }
.step.on { color: #fff; font-weight: 600; }
.step.ok { color: #fff; }
.step i { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; display: grid; place-items: center; font-style: normal; font-size: 11px; }
.step.ok i { background: var(--good); border-color: var(--good); color: #0b1a10; }
.step.on i { border-color: var(--gold); border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .step.on i { animation: none; } }

.ctrl { display: grid; grid-template-columns: 92px 1fr 64px; gap: 10px; align-items: center; }
.ctrl label { font-weight: 600; font-size: 14px; }
.ctrl output { text-align: right; font: 500 13px var(--mono); color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--gold); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--raise); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 8px 0; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--text); color: #0e0d0b; }
.auto { font-size: 12px; font-weight: 700; color: var(--gold); background: none; border: 0; padding: 0; }

.check li { margin: 4px 0; }
.score { font: 800 34px/1 var(--display); }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tool { border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel); }
.tool svg { width: 18px; height: 18px; display: block; margin: 0 auto 5px; opacity: .7; }

/* bottom dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 12px; padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--ink) 70%, transparent); }
.dock .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
.dock .btn { flex: 1; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 9; background: var(--text); color: #0e0d0b; padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); }
.field { width: 100%; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); }
.sheet-bg { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; background: var(--panel); border-radius: 20px 20px 0 0; padding: 20px max(16px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line); }
.note { font-size: 12px; color: var(--muted); }

/* ---------- in-app camera ---------- */
.cam { position: fixed; inset: 0; z-index: 20; background: #000; color: #fff; display: flex; flex-direction: column; overscroll-behavior: contain; touch-action: none; user-select: none; -webkit-user-select: none; }
.cam-top { position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to bottom, rgba(0,0,0,.55), transparent); }
.cam-x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); backdrop-filter: blur(12px); display: grid; place-items: center; color: #fff; }
.cam-x svg { width: 18px; height: 18px; }
.cam-badge { font: 600 12px/1 var(--body); letter-spacing: .06em; padding: 8px 11px; border-radius: 999px; background: rgba(255,255,255,.14); backdrop-filter: blur(12px); }
.cam-badge b { color: var(--gold); }
.cam-view { position: relative; flex: 1; overflow: hidden; }
.cam-view video, .cam-view .frozen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: filter .18s ease; }
.cam-view .frozen { display: none; }
.cam-grid { position: absolute; inset: 0; pointer-events: none; background:
  linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.22) calc(33.33% - .5px), rgba(255,255,255,.22) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.22) calc(66.66% - .5px), rgba(255,255,255,.22) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
  linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.22) calc(33.33% - .5px), rgba(255,255,255,.22) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.22) calc(66.66% - .5px), rgba(255,255,255,.22) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
.cam-level { position: absolute; left: 50%; top: 50%; width: 46%; height: 0; transform: translate(-50%, -50%); pointer-events: none; display: none; }
.cam-level .ln { position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: rgba(255,255,255,.85); border-radius: 2px; transition: background .2s; box-shadow: 0 0 4px rgba(0,0,0,.5); }
.cam-level .ln::before, .cam-level .ln::after { content: ""; position: absolute; top: 0; width: 22%; height: 2px; background: inherit; }
.cam-level .ln::before { left: -30%; } .cam-level .ln::after { right: -30%; }
.cam-level.ok .ln { background: var(--gold); }
.cam-tilt { position: absolute; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); font: 600 11px/1 var(--mono); letter-spacing: .04em; padding: 5px 8px; border-radius: 999px; background: rgba(0,0,0,.45); display: none; }
.cam-tilt.ok { color: var(--gold); }
.cam-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.cam-flash.go { animation: flash .22s ease-out; }
@keyframes flash { 0% { opacity: .75; } 100% { opacity: 0; } }
.cam-hold { position: absolute; left: 50%; top: max(76px, calc(env(safe-area-inset-top, 0px) + 64px)); transform: translateX(-50%); z-index: 3; font: 600 13px/1 var(--body); padding: 9px 14px; border-radius: 999px; background: rgba(0,0,0,.55); backdrop-filter: blur(10px); display: none; white-space: nowrap; }
.cam-hold i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); margin-right: 8px; vertical-align: 1px; animation: blink .8s infinite; font-style: normal; }
@keyframes blink { 50% { opacity: .25; } }
.cam-ev { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 3; display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(0,0,0,.45); backdrop-filter: blur(10px); }
.cam-ev span { min-width: 38px; text-align: center; font: 600 12px/1 var(--mono); padding: 7px 0; border-radius: 999px; color: rgba(255,255,255,.55); transition: all .15s; }
.cam-ev span.on { background: var(--gold); color: var(--gold-ink); transform: scale(1.08); }
.cam-ev span.done { color: #fff; }
.cam-bottom { position: relative; z-index: 3; padding: 14px max(16px, env(safe-area-inset-right, 0px)) max(22px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: #000; display: flex; flex-direction: column; gap: 16px; }
.cam-rooms { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; justify-content: safe center; }
.cam-rooms::-webkit-scrollbar { display: none; }
.cam-rooms button { flex: none; border: 0; background: none; color: rgba(255,255,255,.55); font: 600 13px/1 var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 8px 10px; border-radius: 999px; }
.cam-rooms button.on { color: var(--gold); background: rgba(227,188,114,.12); }
.cam-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.cam-stack { justify-self: start; position: relative; width: 52px; height: 52px; }
.cam-stack img { position: absolute; inset: 0; width: 52px; height: 52px; object-fit: cover; border-radius: 10px; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.6); animation: drop .32s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes drop { from { transform: translate(90px, -160px) scale(2.2); opacity: 0; } to { opacity: 1; } }
.cam-stack .n { position: absolute; right: -8px; top: -8px; z-index: 6; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--gold); color: var(--gold-ink); font: 700 12px/22px var(--mono); text-align: center; }
.shutter { width: 78px; height: 78px; border-radius: 50%; border: 0; padding: 0; background: conic-gradient(var(--gold) calc(var(--p, 0) * 1%), rgba(255,255,255,.9) 0); display: grid; place-items: center; transition: transform .1s; }
.shutter::after { content: ""; width: 64px; height: 64px; border-radius: 50%; background: #fff; border: 3px solid #000; transition: transform .12s, background .2s; }

.shutter[disabled] { cursor: default; }
.cam-note { justify-self: end; text-align: right; font: 500 11px/1.35 var(--body); color: rgba(255,255,255,.55); max-width: 92px; }
.cam-merge { position: absolute; inset: 0; z-index: 4; display: none; place-items: center; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); }
.cam-merge .fan { position: relative; width: 210px; height: 150px; }
.cam-merge .fan img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,.9); box-shadow: 0 8px 24px rgba(0,0,0,.6); animation: fanin 1.1s cubic-bezier(.5,0,.2,1) both; }
@keyframes fanin { from { transform: translateX(var(--x)) rotate(var(--r)) scale(.82); } 60% { transform: translateX(calc(var(--x) * .2)) rotate(calc(var(--r) * .2)) scale(.95); } to { transform: none; } }
.cam-merge .lbl { margin-top: 18px; text-align: center; font: 600 15px/1.3 var(--body); }
.cam-merge .lbl small { display: block; font-weight: 500; color: rgba(255,255,255,.6); margin-top: 3px; font-size: 13px; }
.cam-err { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
@media (prefers-reduced-motion: reduce) { .cam-flash.go, .cam-stack img, .cam-merge .fan img, .cam-hold i { animation: none; } }

/* processing: 5 frames converging */
.frames { position: relative; width: 150px; height: 100px; margin: 0 auto 4px; }
.frames img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 9px; border: 1.5px solid rgba(255,255,255,.85); animation: breathe 1.8s ease-in-out infinite alternate; }
@keyframes breathe { from { transform: translateX(var(--x)) rotate(var(--r)); } to { transform: translateX(calc(var(--x) * .25)) rotate(calc(var(--r) * .25)); } }
@media (prefers-reduced-motion: reduce) { .frames img { animation: none; } }

.cam-view video { transition: filter .18s ease, transform .25s ease; transform-origin: 50% 50%; }
.cam-zoom { position: absolute; left: 50%; bottom: 62px; transform: translateX(-50%); z-index: 3; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(0,0,0,.4); backdrop-filter: blur(10px); transition: opacity .2s; }
.cam-zoom button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.1); color: #fff; font: 700 12px/1 var(--body); display: flex; align-items: center; justify-content: center; transition: all .15s; }
.cam-zoom button small { font-size: 9px; margin-left: 1px; }
.cam-zoom button.on { background: rgba(0,0,0,.6); color: var(--gold); transform: scale(1.12); box-shadow: inset 0 0 0 1.5px var(--gold); }
.cam-zoomlab { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 3; font: 800 44px/1 var(--display); color: #fff; text-shadow: 0 2px 16px rgba(0,0,0,.6); opacity: 0; pointer-events: none; }
.cam-zoomlab.pop { animation: zpop .9s ease-out; }
@keyframes zpop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.8); } 20% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; } }

/* compact controls: portrait */
.cam-bottom { padding-top: 8px; gap: 8px; }
.cam-rooms button { padding: 6px 9px; font-size: 12px; }
.shutter { width: 66px; height: 66px; }
.shutter::after { width: 54px; height: 54px; }
.cam-stack, .cam-stack img { width: 44px; height: 44px; }
/* landscape (horizontal shots): controls become a slim column on the right, the frame fills the rest */
@media (orientation: landscape) {

  .cam-bottom { width: 96px; flex: none; padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) 8px; justify-content: center; gap: 10px; }

}

.cam-view { display: grid; place-items: center; }

@media (orientation: landscape) { .cam-turn { display: none; } }
.cam-frame { position: relative; overflow: hidden; background: #000; box-shadow: 0 0 0 1px rgba(255,255,255,.18); }
.cam-frame video, .cam-frame .frozen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* iPhone-style zoom: small round presets, active shows the exact value in yellow; press/slide pops a dial */

<script type="text/plain" id="core-src">// Baker Snap web core — pure image maths on Float32 planes (no DOM).
// Runs inside a Web Worker in the page, and under Node for tests.
// Image = {w, h, r, g, b} with Float32Array planes in 0..1 (sRGB gamma space).

function mkImg(w, h) {
  const n = w * h;
  return { w, h, r: new Float32Array(n), g: new Float32Array(n), b: new Float32Array(n) };
}

function fromRGBA(data, w, h) {
  const im = mkImg(w, h), n = w * h;
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    im.r[i] = data[j] / 255; im.g[i] = data[j + 1] / 255; im.b[i] = data[j + 2] / 255;
  }
  return im;
}

function toRGBA(im) {
  const n = im.w * im.h, out = new Uint8ClampedArray(n * 4);
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    out[j] = im.r[i] * 255 + 0.5; out[j + 1] = im.g[i] * 255 + 0.5; out[j + 2] = im.b[i] * 255 + 0.5; out[j + 3] = 255;
  }
  return out;
}

const lum = (r, g, b) => 0.2126 * r + 0.7152 * g + 0.0722 * b;

function grayOf(im) {
  const n = im.w * im.h, y = new Float32Array(n);
  for (let i = 0; i < n; i++) y[i] = lum(im.r[i], im.g[i], im.b[i]);
  return y;
}

// ---------------------------------------------------------------- resampling

function resizePlane(src, w, h, nw, nh) {
  const out = new Float32Array(nw * nh);
  if (nw < w || nh < h) {
    // area average (box) for downscaling
    const sx = w / nw, sy = h / nh;
    for (let y = 0; y < nh; y++) {
      const y0 = y * sy, y1 = Math.min(h, y0 + sy);
      for (let x = 0; x < nw; x++) {
        const x0 = x * sx, x1 = Math.min(w, x0 + sx);
        let s = 0, c = 0;
        for (let yy = Math.floor(y0); yy < Math.ceil(y1); yy++) {
          const row = yy * w;
          for (let xx = Math.floor(x0); xx < Math.ceil(x1); xx++) { s += src[row + xx]; c++; }
        }
        out[y * nw + x] = s / c;
      }
    }
    return out;
  }
  // bilinear for upscaling
  const sx = (w - 1) / Math.max(1, nw - 1), sy = (h - 1) / Math.max(1, nh - 1);
  for (let y = 0; y < nh; y++) {
    const fy = y * sy, y0 = Math.floor(fy), y1 = Math.min(h - 1, y0 + 1), ty = fy - y0;
    for (let x = 0; x < nw; x++) {
      const fx = x * sx, x0 = Math.floor(fx), x1 = Math.min(w - 1, x0 + 1), tx = fx - x0;
      const a = src[y0 * w + x0], b = src[y0 * w + x1], c = src[y1 * w + x0], d = src[y1 * w + x1];
      out[y * nw + x] = (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
    }
  }
  return out;
}

function resizeImg(im, nw, nh) {
  return { w: nw, h: nh, r: resizePlane(im.r, im.w, im.h, nw, nh), g: resizePlane(im.g, im.w, im.h, nw, nh), b: resizePlane(im.b, im.w, im.h, nw, nh) };
}

// Box blur (3 passes ≈ gaussian), separable, edge-clamped.
function boxBlur(src, w, h, rad) {
  rad = Math.max(1, Math.round(rad));
  let a = Float32Array.from(src), t = new Float32Array(src.length);
  const pass = (inp, out, horiz) => {
    const len = horiz ? w : h, lines = horiz ? h : w, d = 2 * rad + 1;
    for (let l = 0; l < lines; l++) {
      const idx = (k) => horiz ? l * w + Math.min(len - 1, Math.max(0, k)) : Math.min(len - 1, Math.max(0, k)) * w + l;
      let s = 0;
      for (let k = -rad; k <= rad; k++) s += inp[idx(k)];
      for (let k = 0; k < len; k++) {
        out[horiz ? l * w + k : k * w + l] = s / d;
        s += inp[idx(k + rad + 1)] - inp[idx(k - rad)];
      }
    }
  };
  for (let i = 0; i < 3; i++) { pass(a, t, true); pass(t, a, false); }
  return a;
}

function percentile(arr, p, step = 7) {
  const s = [];
  for (let i = 0; i < arr.length; i += step) s.push(arr[i]);
  s.sort((x, y) => x - y);
  return s[Math.min(s.length - 1, Math.floor(p / 100 * s.length))];
}

// ---------------------------------------------------------------- align (handheld shake)

function gradMag(y, w, h) {
  const out = new Float32Array(w * h);
  for (let j = 1; j < h - 1; j++) for (let i = 1; i < w - 1; i++) {
    const k = j * w + i;
    const gx = y[k + 1] - y[k - 1], gy = y[k + w] - y[k - w];
    out[k] = Math.sqrt(gx * gx + gy * gy);
  }
  return out;
}

// Exposure-invariant structure map: gradient of log luminance, normalised.
function structure(im, scale) {
  const w = Math.max(16, Math.round(im.w * scale)), h = Math.max(16, Math.round(im.h * scale));
  const y = resizePlane(grayOf(im), im.w, im.h, w, h);
  for (let i = 0; i < y.length; i++) y[i] = Math.log(0.01 + y[i]);
  const g = gradMag(y, w, h);
  const m = percentile(g, 90) || 1;
  for (let i = 0; i < g.length; i++) g[i] = Math.min(1, g[i] / m);
  return { w, h, g };
}

function bestShift(ref, mov, cx, cy, radius) {
  let best = [cx, cy], bestErr = Infinity;
  const { w, h } = ref, m = Math.ceil(h * 0.1) + radius + Math.abs(cy), mx = Math.ceil(w * 0.1) + radius + Math.abs(cx);
  for (let dy = cy - radius; dy <= cy + radius; dy++) for (let dx = cx - radius; dx <= cx + radius; dx++) {
    let e = 0;
    for (let y = m; y < h - m; y += 2) {
      const r0 = y * w, r1 = (y + dy) * w + dx;
      for (let x = mx; x < w - mx; x += 2) e += Math.abs(ref.g[r0 + x] - mov.g[r1 + x]);
    }
    if (e < bestErr) { bestErr = e; best = [dx, dy]; }
  }
  return best;
}

// Returns [dx, dy] in full-res pixels such that mov(x+dx, y+dy) ≈ ref(x, y).
function estimateShift(ref, mov) {
  const s1 = 192 / Math.max(ref.w, ref.h), s2 = 768 / Math.max(ref.w, ref.h);
  const a1 = structure(ref, s1), b1 = structure(mov, s1);
  let [dx, dy] = bestShift(a1, b1, 0, 0, 8);
  const a2 = structure(ref, s2), b2 = structure(mov, s2), k = s2 / s1;
  [dx, dy] = bestShift(a2, b2, Math.round(dx * k), Math.round(dy * k), 3);
  const s3 = Math.min(1, 1600 / Math.max(ref.w, ref.h));
  if (s3 > s2 * 1.3) {
    const a3 = structure(ref, s3), b3 = structure(mov, s3), k2 = s3 / s2;
    [dx, dy] = bestShift(a3, b3, Math.round(dx * k2), Math.round(dy * k2), 2);
    return [dx / s3, dy / s3];
  }
  return [dx / s2, dy / s2];
}

function shiftImg(im, dx, dy) {
  const { w, h } = im, out = mkImg(w, h);
  const ix = Math.round(dx), iy = Math.round(dy);
  for (let y = 0; y < h; y++) {
    const sy = Math.min(h - 1, Math.max(0, y + iy));
    for (let x = 0; x < w; x++) {
      const sx = Math.min(w - 1, Math.max(0, x + ix)), s = sy * w + sx, d = y * w + x;
      out.r[d] = im.r[s]; out.g[d] = im.g[s]; out.b[d] = im.b[s];
    }
  }
  return out;
}

function cropImg(im, x0, y0, cw, ch) {
  const out = mkImg(cw, ch);
  for (let y = 0; y < ch; y++) {
    const s = (y + y0) * im.w + x0, d = y * cw;
    out.r.set(im.r.subarray(s, s + cw), d); out.g.set(im.g.subarray(s, s + cw), d); out.b.set(im.b.subarray(s, s + cw), d);
  }
  return out;
}

function meanLum(im) { const y = grayOf(im); let s = 0; for (let i = 0; i < y.length; i += 5) s += y[i]; return s / (y.length / 5); }

// Align a bracket set to its middle exposure; crop to the shared area.
function align(frames) {
  const order = frames.map((f, i) => [meanLum(f), i]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const refIdx = order[Math.floor(order.length / 2)], ref = frames[refIdx];
  let L = 0, R = 0, T = 0, B = 0;
  const out = frames.map((f, i) => {
    if (i === refIdx) return f;
    const [dx, dy] = estimateShift(ref, f);
    L = Math.max(L, -dx); R = Math.max(R, dx); T = Math.max(T, -dy); B = Math.max(B, dy);
    return shiftImg(f, dx, dy);
  });
  const x0 = Math.ceil(L), y0 = Math.ceil(T), cw = ref.w - x0 - Math.ceil(R), ch = ref.h - y0 - Math.ceil(B);
  if (cw < ref.w * 0.85 || ch < ref.h * 0.85) return out;
  return out.map(f => cropImg(f, x0, y0, cw, ch));
}

// ---------------------------------------------------------------- exposure fusion (Mertens)

function pyrDown(src, w, h) {
  const b = boxBlur(src, w, h, 1), nw = Math.ceil(w / 2), nh = Math.ceil(h / 2), out = new Float32Array(nw * nh);
  for (let y = 0; y < nh; y++) for (let x = 0; x < nw; x++) out[y * nw + x] = b[Math.min(h - 1, y * 2) * w + Math.min(w - 1, x * 2)];
  return { a: out, w: nw, h: nh };
}

function gaussPyr(src, w, h, levels) {
  const p = [{ a: src, w, h }];
  for (let i = 1; i < levels; i++) { const t = p[i - 1]; p.push(pyrDown(t.a, t.w, t.h)); }
  return p;
}

function lapPyr(src, w, h, levels) {
  const g = gaussPyr(src, w, h, levels), lp = [];
  for (let i = 0; i < levels - 1; i++) {
    const up = resizePlane(g[i + 1].a, g[i + 1].w, g[i + 1].h, g[i].w, g[i].h), d = new Float32Array(g[i].a.length);
    for (let k = 0; k < d.length; k++) d[k] = g[i].a[k] - up[k];
    lp.push({ a: d, w: g[i].w, h: g[i].h });
  }
  lp.push(g[levels - 1]);
  return lp;
}

function collapse(lp) {
  let cur = lp[lp.length - 1];
  for (let i = lp.length - 2; i >= 0; i--) {
    const up = resizePlane(cur.a, cur.w, cur.h, lp[i].w, lp[i].h), d = new Float32Array(up.length);
    for (let k = 0; k < d.length; k++) d[k] = up[k] + lp[i].a[k];
    cur = { a: d, w: lp[i].w, h: lp[i].h };
  }
  return cur.a;
}

function fuse(frames) {
  if (frames.length === 1) return frames[0];
  const { w, h } = frames[0], n = w * h;
  const hw = Math.ceil(w / 2), hh = Math.ceil(h / 2);
  const weights = frames.map(f => {
    const s = resizeImg(f, hw, hh), m = hw * hh, g = grayOf(s), wt = new Float32Array(m);
    for (let y = 1; y < hh - 1; y++) for (let x = 1; x < hw - 1; x++) {
      const k = y * hw + x;
      const lap = Math.abs(4 * g[k] - g[k - 1] - g[k + 1] - g[k - hw] - g[k + hw]);
      const r = s.r[k], gg = s.g[k], b = s.b[k], mu = (r + gg + b) / 3;
      const sat = Math.sqrt(((r - mu) ** 2 + (gg - mu) ** 2 + (b - mu) ** 2) / 3);
      const well = Math.exp(-((r - .5) ** 2 + (gg - .5) ** 2 + (b - .5) ** 2) / (2 * 0.22 * 0.22));
      const mx = Math.max(r, gg, b), clip = mx > 0.97 ? 0.03 : mx > 0.92 ? 0.03 + 0.97 * (0.97 - mx) / 0.05 : 1;
      wt[k] = Math.pow(lap + 1e-3, 0.6) * Math.pow(sat + 1e-3, 0.4) * Math.pow(well + 1e-6, 1.2) * clip;
    }
    return resizePlane(wt, hw, hh, w, h);
  });
  for (let i = 0; i < n; i++) {
    let s = 1e-12;
    for (const wt of weights) s += wt[i];
    for (const wt of weights) wt[i] /= s;
  }
  const levels = Math.max(3, Math.min(8, Math.floor(Math.log2(Math.min(w, h))) - 2));
  const out = mkImg(w, h);
  for (const ch of ['r', 'g', 'b']) {
    let acc = null;
    frames.forEach((f, fi) => {
      const lp = lapPyr(f[ch], w, h, levels), gp = gaussPyr(weights[fi], w, h, levels);
      if (!acc) acc = lp.map(l => ({ a: new Float32Array(l.a.length), w: l.w, h: l.h }));
      for (let L = 0; L < levels; L++) { const A = acc[L].a, la = lp[L].a, ga = gp[L].a; for (let k = 0; k < A.length; k++) A[k] += la[k] * ga[k]; }
    });
    const res = collapse(acc);
    for (let k = 0; k < n; k++) out[ch][k] = Math.min(1, Math.max(0, res[k]));
  }
  return out;
}

// ---------------------------------------------------------------- Bright & White grade

function whiteBalance(im, strength) {
  const n = im.w * im.h, Y = grayOf(im), p65 = percentile(Y, 65);
  const pick = (strict) => {
    let sr = 0, sg = 0, sb = 0, c = 0;
    for (let i = 0; i < n; i += 3) {
      const r = im.r[i], g = im.g[i], b = im.b[i], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      const ok = strict ? (Y[i] > p65 && Y[i] < 0.96 && (mx - mn) / (mx + 1e-4) < 0.22) : (Y[i] > 0.15 && Y[i] < 0.97);
      if (ok) { sr += r; sg += g; sb += b; c++; }
    }
    return c > n / 300 ? [sr / c, sg / c, sb / c] : null;
  };
  const m = pick(true) || pick(false);
  if (!m) return im;
  const t = (m[0] + m[1] + m[2]) / 3;
  const gain = m.map(v => 1 + strength * (Math.min(1.35, Math.max(0.75, t / (v + 1e-6))) - 1));
  for (let i = 0; i < n; i++) { im.r[i] = Math.min(1, im.r[i] * gain[0]); im.g[i] = Math.min(1, im.g[i] * gain[1]); im.b[i] = Math.min(1, im.b[i] * gain[2]); }
  return im;
}

function tone(im) {
  const n = im.w * im.h, Y = grayOf(im);
  const hi = percentile(Y, 92), scale = Math.min(2.4, Math.max(0.85, 0.92 / Math.max(hi, 1e-3)));
  const med = Math.min(0.95, Math.max(0.02, percentile(Y, 50) * scale));
  const gamma = Math.min(1.15, Math.max(0.55, Math.log(0.6) / Math.log(med)));
  // large-scale brightness: where a whole area is bright (windows, sunlit walls) pull it down gently
  // so it blends into the room instead of sitting as a flat white block
  const B = boxBlur(Y, im.w, im.h, Math.max(6, Math.round(Math.max(im.w, im.h) * 0.03)));
  const B2 = boxBlur(B, im.w, im.h, Math.max(6, Math.round(Math.max(im.w, im.h) * 0.03)));
  const knee = 0.80;
  for (let i = 0; i < n; i++) {
    const y = Y[i] + 1e-5;
    let base = Math.min(1.5, B2[i] * scale);
    let t = Math.pow(Math.min(1.6, y * scale), gamma);
    if (base > 0.95) t *= Math.pow(0.95 / base, 0.6);         // only areas brighter than the room (windows, sun) are pulled down
    if (t > knee) { const x = t - knee; t = knee + (1 - knee) * x / (x + (1 - knee)); }   // soft shoulder, never a hard clip
    t += 0.03 * (1 - t) * Math.exp(-t / 0.08);
    const k = t / y;
    let r = im.r[i] * k, g = im.g[i] * k, b = im.b[i] * k;
    const mx = Math.max(r, g, b);
    if (mx > 1) { const f = (mx - 1) / mx; r += (t - r) * f; g += (t - g) * f; b += (t - b) * f; }   // fade to white, no hue shift
    im.r[i] = Math.min(1, r); im.g[i] = Math.min(1, g); im.b[i] = Math.min(1, b);
  }
  return im;
}

function localContrast(im, amount) {
  const n = im.w * im.h, Y = grayOf(im), B = boxBlur(Y, im.w, im.h, Math.max(4, Math.round(Math.max(im.w, im.h) * 0.012)));
  for (let i = 0; i < n; i++) {
    const y = Y[i] + 1e-5, ny = Math.min(1, Math.max(0, y + amount * (y - B[i]) * (1 - y)));
    const k = ny / y;
    im.r[i] = Math.min(1, im.r[i] * k); im.g[i] = Math.min(1, im.g[i] * k); im.b[i] = Math.min(1, im.b[i] * k);
  }
  return im;
}

function vibrance(im, amount) {
  const n = im.w * im.h;
  for (let i = 0; i < n; i++) {
    const r = im.r[i], g = im.g[i], b = im.b[i], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    const sat = mx > 0 ? (mx - mn) / mx : 0, f = 1 + amount * (1 - sat), m = (r + g + b) / 3;
    im.r[i] = Math.min(1, Math.max(0, m + (r - m) * f)); im.g[i] = Math.min(1, Math.max(0, m + (g - m) * f)); im.b[i] = Math.min(1, Math.max(0, m + (b - m) * f));
  }
  return im;
}

function sharpen(im, amount) {
  for (const ch of ['r', 'g', 'b']) {
    const a = im[ch], b = boxBlur(a, im.w, im.h, 1);
    for (let i = 0; i < a.length; i++) a[i] = Math.min(1, Math.max(0, a[i] + amount * (a[i] - b[i])));
  }
  return im;
}

function grade(im) {
  whiteBalance(im, 0.95); tone(im); localContrast(im, 0.22); vibrance(im, 0.06); sharpen(im, 0.2);
  return im;
}

// ---------------------------------------------------------------- auto level + verticals

// Fit near-vertical edges: angle(x) ≈ roll + k·(x − cx). roll levels the shot;
// k measures converging verticals, i.e. camera pitch.
function estimateGeometry(im, focalFactor) {
  const s = 640 / Math.max(im.w, im.h), w = Math.round(im.w * s), h = Math.round(im.h * s);
  const y = boxBlur(resizePlane(grayOf(im), im.w, im.h, w, h), w, h, 1);
  const pts = [];
  for (let j = 2; j < h - 2; j++) for (let i = 2; i < w - 2; i++) {
    const k = j * w + i;
    const gx = (y[k + 1 - w] + 2 * y[k + 1] + y[k + 1 + w]) - (y[k - 1 - w] + 2 * y[k - 1] + y[k - 1 + w]);
    const gy = (y[k + w - 1] + 2 * y[k + w] + y[k + w + 1]) - (y[k - w - 1] + 2 * y[k - w] + y[k - w + 1]);
    const mag = Math.hypot(gx, gy);
    if (mag < 0.25 || Math.abs(gx) < 3 * Math.abs(gy)) continue;
    // edge leans by this many degrees from vertical; + = top leans right
    const a = Math.atan(-gy / gx) * 180 / Math.PI;
    if (Math.abs(a) < 12) pts.push([(i - w / 2) / w, a, mag]);
  }
  if (pts.length < 200) return { roll: 0, pitch: 0, confident: false };
  let roll = 0, k = 0, keep = pts;
  for (let it = 0; it < 4; it++) {
    let sw = 0, sx = 0, sy = 0, sxx = 0, sxy = 0;
    for (const [x, a, m] of keep) { sw += m; sx += m * x; sy += m * a; sxx += m * x * x; sxy += m * x * a; }
    const den = sw * sxx - sx * sx;
    k = Math.abs(den) > 1e-9 ? (sw * sxy - sx * sy) / den : 0;
    roll = (sy - k * sx) / sw;
    const tol = it < 2 ? 4 : 2;

// ------------------------------------------------------------------ worker
const workerSrc = document.getElementById("core-src").textContent + `
const store = new Map();
function geo(im) {
  // two passes: estimate, correct a small copy, estimate what is left
  const g = estimateGeometry(im, 0.72);
  if (!g.confident || Math.abs(g.pitch) > 15 || Math.abs(g.roll) > 6) return { pitch: 0, roll: 0, found: false };
  const rgba = toRGBA(im);
  const small = warpRGBA(rgba, im.w, im.h, { pitch: g.pitch, roll: g.roll, outLong: 1024 });
  const g2 = estimateGeometry(fromRGBA(small.data, small.w, small.h), 0.72);
  const extra = g2.confident ? g2 : { pitch: 0, roll: 0 };
  return { pitch: g.pitch + extra.pitch, roll: g.roll + extra.roll, found: true };
}
onmessage = (e) => {
  const m = e.data;
  try {
    if (m.type === "finish") {
      const post = (step) => postMessage({ type: "step", id: m.id, step });
      post("merging");
      let frames = m.frames.map(f => fromRGBA(new Uint8ClampedArray(f.data), f.w, f.h));
      if (frames.length > 1) frames = align(frames);
      post("windows");
      const fused = fuse(frames); frames = null;
      post("colour");
      grade(fused);
      post("polish");
      const g = geo(fused);
      store.set(m.id, { data: toRGBA(fused), w: fused.w, h: fused.h });
      postMessage({ type: "done", id: m.id, geo: g, w: fused.w, h: fused.h });
    } else if (m.type === "render") {
      const s = store.get(m.id);
      if (!s) return;
      const out = warpRGBA(s.data, s.w, s.h, m.params);
      postMessage({ type: "rendered", id: m.id, req: m.req, data: out.data.buffer, w: out.w, h: out.h }, [out.data.buffer]);
    } else if (m.type === "drop") {
      store.delete(m.id);
    }
  } catch (err) {
    postMessage({ type: "error", id: m.id, req: m.req, message: String(err && err.message || err) });
  }
};`;
const worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: "text/javascript" })));
const pending = new Map();
let reqSeq = 0;
worker.onmessage = (e) => {
  const m = e.data;
  if (m.type === "step") { const p = findPhoto(m.id); if (p) { p.step = m.step; if (state.view.name !== "photo" || state.view.id === m.id) draw(); } }
  else if (m.type === "done") onFinished(m);
  else if (m.type === "rendered" || (m.type === "error" && m.req)) { const r = pending.get(m.req); if (r) { pending.delete(m.req); m.type === "error" ? r.reject(new Error(m.message)) : r.resolve(m); } }
  else if (m.type === "error") { const p = findPhoto(m.id); if (p) { p.status = "failed"; p.error = m.message; draw(); } }
};
function render(id, params) {
  const req = ++reqSeq;
  return new Promise((resolve, reject) => { pending.set(req, { resolve, reject }); worker.postMessage({ type: "render", id, req, params }); });
}

// ------------------------------------------------------------------ data
const ROOMS = ["Front", "Living", "Kitchen", "Dining", "Family", "Master bed", "Bedroom", "Ensuite", "Bathroom", "Study", "Laundry", "Alfresco", "Backyard", "Pool", "Garage", "Street"];
const ESSENTIALS = ["Front", "Living", "Kitchen", "Dining", "Master bed", "Bedroom", "Bathroom", "Backyard"];
const STEPS = [["merging", "Merging your frames"], ["windows", "Balancing the windows"], ["colour", "Getting the colours true"], ["polish", "Straightening and final polish"]];
const SHAPES = [["orig", "Original", null], ["3:2", "3:2", 3 / 2], ["4:3", "4:3", 4 / 3], ["4:5", "4:5", 4 / 5]];
const WORK_EDGE = 2048;

let seq = 0;
const uid = () => "p" + (++seq);
const state = {
  view: { name: "home" },
  room: "Living",
  listings: [],
};

function findPhoto(id) { for (const l of state.listings) for (const p of l.photos) if (p.id === id) return p; return null; }
function listingOf(id) { return state.listings.find(l => l.id === id); }
function ordered(l) {
  const idx = (r) => { const i = ROOMS.indexOf(r); return i < 0 ? 99 : i; };
  return [...l.photos].sort((a, b) => (b.hero - a.hero) || (idx(a.room) - idx(b.room)) || (a.n - b.n));
}

// ------------------------------------------------------------------ capabilities (optional)
let downloads = null, sample = null, sampleImages = false;
// standalone (own web address): save through the phone's share sheet ("Save Image" → Photos), else a normal download
const STANDALONE = !window.claude;
async function shareOrDownload(files) {
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); return; }
    catch (e) { if (e && e.name === "AbortError") throw { code: "declined" }; }
  }
  for (const f of files) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
}
if (STANDALONE) downloads = { save: async ({ filename, data }) => shareOrDownload([new File([data], filename, { type: "image/jpeg" })]) };
(async () => {
  if (!window.claude) return;
  try { downloads = await window.claude.use("downloads"); } catch { downloads = null; }
  try {
    sample = await window.claude.use("sample");
    if (sample) { const lim = await sample.limits().catch(() => null); sampleImages = !!(lim && lim.images); }
  } catch { sample = null; }
  draw();
})();

// ------------------------------------------------------------------ capture & finish
async function decode(blob, longEdge, fit) {
  let bmp;
  try { bmp = await createImageBitmap(blob, { imageOrientation: "from-image" }); }
  catch { throw new Error("Couldn't read that photo. Use a JPEG or PNG."); }
  let w = bmp.width, h = bmp.height;
  if (fit) { w = fit.w; h = fit.h; }
  else { const s = Math.min(1, longEdge / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s); }
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0, w, h); bmp.close?.();
  const img = ctx.getImageData(0, 0, w, h);
  const before = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  return { data: img.data.buffer, w, h, before };
}

async function addShot(listing, files, room) {
  files = [...files].slice(0, 5);
  if (!files.length) return;
  const p = { id: uid(), n: seq, room, frames: files, status: "queued", step: "", hero: 0, params: { pitch: 0, roll: 0, shape: "orig" }, auto: null, beforeURL: null, url: null, thumb: null, check: null };
  listing.photos.push(p);
  draw();
  queueFinish(p);
}

const queue = [];
let busy = false;
function queueFinish(p) { queue.push(p); pump(); }
async function pump() {
  if (busy || !queue.length) return;
  busy = true;
  const p = queue.shift();
  try {
    p.status = "processing"; p.step = "merging"; draw();
    // middle exposure = the "before" picture; all frames scaled to its size
    const first = await decode(p.frames[0], WORK_EDGE);
    const decoded = [first];
    for (const f of p.frames.slice(1)) decoded.push(await decode(f, WORK_EDGE, { w: first.w, h: first.h }));
    const mid = decoded[Math.floor(decoded.length / 2)];
    p.beforeURL = URL.createObjectURL(mid.before);
    p.frameURLs = decoded.map(d => d === mid ? p.beforeURL : URL.createObjectURL(d.before));
    if (!p.thumb) p.thumb = p.beforeURL;
    draw();
    worker.postMessage({ type: "finish", id: p.id, frames: decoded.map(d => ({ data: d.data, w: d.w, h: d.h })) }, decoded.map(d => d.data));
  } catch (err) {
    p.status = "failed"; p.error = err.message; busy = false; draw(); pump();
  }
}

async function onFinished(m) {
  const p = findPhoto(m.id);
  busy = false; pump();
  if (!p) return;
  p.auto = m.geo;
  p.params.pitch = m.geo.found ? round1(m.geo.pitch) : 0;
  p.params.roll = m.geo.found ? round1(m.geo.roll) : 0;
  p.size = { w: m.w, h: m.h };
  await refreshPreview(p);
  p.status = "done";
  if (state.view.name !== "photo" || state.view.id === p.id) draw();
}

const round1 = (v) => Math.round(v * 10) / 10;
function shapeOf(p) { return (SHAPES.find(s => s[0] === p.params.shape) || SHAPES[0])[2]; }

async function toJPEG(r, q) {
  const c = document.createElement("canvas"); c.width = r.w; c.height = r.h;
  c.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(r.data), r.w, r.h), 0, 0);
  return await new Promise(res => c.toBlob(res, "image/jpeg", q));
}

let previewToken = 0;
async function refreshPreview(p) {
  const token = ++previewToken;
  const r = await render(p.id, { pitch: p.params.pitch, roll: p.params.roll, aspect: shapeOf(p), outLong: 1400 });
  if (token !== previewToken && state.view.name === "photo") return; // a newer slider value is on its way
  const blob = await toJPEG(r, 0.88);
  if (p.url) URL.revokeObjectURL(p.url);
  p.url = URL.createObjectURL(blob);
  p.thumb = p.url;
  if (state.view.name === "photo" && state.view.id === p.id) {
    const img = document.getElementById("after"); if (img) img.src = p.url;
  }
}

// ------------------------------------------------------------------ export + AI check
const EXPORTS = { portal: { label: "Portal", sub: "REA / Domain · 2048 px", outLong: 2048, q: 0.9 }, social: { label: "Social 4:5", sub: "Instagram · 1350 px", outLong: 1350, q: 0.88, aspect: 4 / 5 } };
const fileBase = (l, p, i) => `${String(i + 1).padStart(2, "0")}-${(p.room || "photo").replace(/\W+/g, "-")}-${l.address.replace(/\W+/g, "-").slice(0, 40)}`;

async function exportPhoto(l, p, kind, i) {
  const e = EXPORTS[kind];
  const r = await render(p.id, { pitch: p.params.pitch, roll: p.params.roll, aspect: e.aspect || shapeOf(p), outLong: e.outLong });
  const blob = await toJPEG(r, e.q);
  if (!downloads) throw { code: "unavailable" };
  await downloads.save({ filename: `${fileBase(l, p, i)}-${kind}.jpg`, data: blob });
}

async function saveOne(p, kind) {
  const l = listingOf(state.view.listing), i = ordered(l).indexOf(p);
  try { await exportPhoto(l, p, kind, i); toast("Saved"); }
  catch (e) { toast(saveError(e)); }
}

async function saveAll(l, kind) {
  const done = ordered(l).filter(p => p.status === "done");
  if (STANDALONE) {
    try {
      toast("Preparing photos…");
      const files = [];
      for (const [i, p] of done.entries()) {
        const e = EXPORTS[kind];
        const r = await render(p.id, { pitch: p.params.pitch, roll: p.params.roll, aspect: e.aspect || shapeOf(p), outLong: e.outLong });
        files.push(new File([await toJPEG(r, e.q)], `${fileBase(l, p, i)}-${kind}.jpg`, { type: "image/jpeg" }));
      }
      state.pendingShare = files; draw();
      toast(`${files.length} ready — tap Share to save`);
    } catch (e) { toast(saveError(e)); }
    return;
  }
  let n = 0;
  for (const [i, p] of done.entries()) {
    try { await exportPhoto(l, p, kind, i); n++; }
    catch (e) { if (e && e.code === "declined") break; toast(saveError(e)); return; }
  }
  toast(n ? `Saved ${n} photo${n === 1 ? "" : "s"}` : "Nothing saved");
}

function saveError(e) {
  const code = e && e.code;
  if (code === "declined") return "Save cancelled";
  if (code === "rate_limited") return "One save at a time — try again in a moment";
  return "Saving isn't available here. Long-press the photo to save it.";
}

let checkCtl = null;
async function runCheck(p) {
  if (!sample) return;
  checkCtl = new AbortController();
  p.check = { busy: true };
  draw();
  try {
    const r = await render(p.id, { pitch: p.params.pitch, roll: p.params.roll, aspect: shapeOf(p), outLong: 1280 });
    const blob = await toJPEG(r, 0.85);
    const res = await sample.json(
      "You are a quality check for real estate agents who shoot their own listing photos on a phone in Australia. " +
      "Look at this finished listing photo and judge whether it is ready for realestate.com.au. Consider: lights on, blinds open, " +
      "verticals straight, horizon level, shot from a corner at chest height, clutter (bins, cords, toiletries, personal photos, dishes, shoes), " +
      "window views held, reflections or people visible, framing.\n\n" +
      "Reply with only JSON in this shape: {\"room\": one of " + JSON.stringify(ROOMS) + ", \"score\": integer 1-10, " +
      "\"verdict\": one short sentence, \"fixes\": [{\"kind\": \"reshoot\" | \"tidy\" | \"edit\", \"text\": short instruction}] }. " +
      "At most 4 fixes, most important first; an empty list if it is ready.",
      { images: [blob], signal: checkCtl.signal });
    p.check = {
      room: ROOMS.includes(res.room) ? res.room : null,
      score: Math.max(1, Math.min(10, Number(res.score) || 0)),
      verdict: String(res.verdict || ""),
      fixes: Array.isArray(res.fixes) ? res.fixes.slice(0, 4).map(f => ({ kind: String(f.kind || "edit"), text: String(f.text || "") })) : [],
    };
    if (p.check.room && (!p.room || p.room === "Photo")) p.room = p.check.room;
  } catch (e) {
    const code = e && e.code;
    if (code === "not_granted" || code === "sampling_disabled" || code === "images_unavailable") { sample = null; p.check = null; }
    else if (code === "cancelled") p.check = null;
    else p.check = { error: code === "rate_limited" ? "Too many checks right now. Try again shortly." : "The check didn't come back. Try again." };
  }
  draw();
}

// ------------------------------------------------------------------ in-app camera (5-frame bracket)
const EVS = [-2, -1, 0, 1, 2];
const cam = { stream: null, track: null, listing: null, frames: [], busy: false, motion: null, roll: 0, pitch: 0 };

async function openCamera(l) {
  cam.listing = l; cam.frames = []; cam.busy = false; cam.z = 1; cam.digital = 1;
  // iOS asks for motion access on a tap; ask now (this is inside the tap) so the level works
  try { if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === "function") DeviceMotionEvent.requestPermission().catch(() => {}); } catch {}
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return openPicker(l, "cam");
  try { await startStream(null); }
  catch (err) {
    toast("Live camera isn't allowed here, opening your camera instead");
    return openPicker(l, "cam");
  }
  // find the ultra-wide and tele lenses (labels only appear once access is granted)
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
    const back = devs.filter(d => !/front|user|facetime/i.test(d.label));
    cam.mainId = cam.track.getSettings().deviceId || null;
    cam.wideId = (back.find(d => /ultra ?wide|0\.5|wide angle/i.test(d.label)) || {}).deviceId || null;
    cam.teleId = (back.find(d => /tele/i.test(d.label)) || {}).deviceId || null;
  } catch {}
  cam.z = hasRealWide() ? 1 : 0.5;
  drawCamera();
  fitFrame();
  attachVideo();
  startLevel();
  document.addEventListener("keydown", camKeys);
}

async function startStream(deviceId) {
  if (cam.stream) cam.stream.getTracks().forEach(t => t.stop());
  const video = deviceId
    ? { deviceId: { exact: deviceId }, width: { ideal: 4032 }, height: { ideal: 3024 } }
    : { facingMode: { ideal: "environment" }, width: { ideal: 4032 }, height: { ideal: 3024 } };
  const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video });
  cam.stream = stream; cam.track = stream.getVideoTracks()[0]; cam.dev = deviceId;
  const caps = cam.track.getCapabilities ? cam.track.getCapabilities() : {};
  cam.evCap = caps.exposureCompensation || null;
  cam.zoomCap = caps.zoom || null;
}
async function attachVideo() {
  const v = $("#camVideo"); if (!v) return;
  v.srcObject = cam.stream;
  try { await v.play(); } catch {}
}

// zoom: continuous .5×–5× like the iPhone camera.
// .5× = ultra-wide lens when the browser exposes it; otherwise the camera's own full view is ".5×"
// and longer focal lengths are hardware zoom / centre crops of it (widest shot keeps full resolution).
const ZMIN = 0.5, ZMAX = 5, PRESETS = [0.5, 1, 2, 5];
const MM = (z) => Math.round(z <= 0.5 ? 13 : 24 * z);
function hasRealWide() { const zc = cam.zoomCap; return !!(cam.wideId || (zc && zc.min <= 0.6)); }
function zoomChoices() { return PRESETS; }
const fmtZ = (z) => z < 0.995 ? (Math.round(z * 10) / 10).toString().replace(/^0/, "") : (Math.round(z * 10) / 10).toString().replace(/\.0$/, "");
let zoomBusy = false, zoomWanted = null;
async function setZoom(z, opts = {}) {
  z = Math.min(ZMAX, Math.max(ZMIN, z));
  if (cam.busy) return;
  if (zoomBusy) { zoomWanted = z; return; }           // a lens switch is in flight: apply the latest value after
  zoomBusy = true;
  const v = $("#camVideo");
  try {
    if (!hasRealWide()) {
      const want = Math.max(1, Math.pow(z / 0.5, 0.585)), zc = cam.zoomCap;
      if (zc && want > 1 && want <= zc.max) { await cam.track.applyConstraints({ advanced: [{ zoom: want }] }); cam.digital = 1; }
      else cam.digital = want;
    } else if (z < 1 && cam.wideId) {
      if (cam.dev !== cam.wideId) { await startStream(cam.wideId); await attachVideo(); }
      cam.digital = z / 0.5;
    } else {
      if (cam.dev && cam.dev === cam.wideId) { await startStream(cam.mainId); await attachVideo(); }
      const zc = cam.zoomCap;
      if (zc && z >= zc.min && z <= zc.max) { await cam.track.applyConstraints({ advanced: [{ zoom: z }] }); cam.digital = 1; }
      else cam.digital = Math.max(1, z);
    }
    cam.z = z;
  } catch { if (!opts.quiet) toast("That lens isn't available"); }
  zoomBusy = false;
  v.style.transform = cam.digital > 1 ? `scale(${cam.digital})` : "";
  paintZoom(opts.pop);
  if (zoomWanted != null) { const w = zoomWanted; zoomWanted = null; setZoom(w, { quiet: true }); }
}
function paintZoom(pop) {
  const z = cam.z;
  const act = PRESETS.reduce((a, p) => (z >= p - 0.001 ? p : a), PRESETS[0]);
  document.querySelectorAll("#camZoom button").forEach(b => {
    const p = +b.dataset.z, on = p === act;
    b.classList.toggle("on", on);
    b.innerHTML = on ? `${fmtZ(z)}<small>×</small>` : fmtZ(p);
  });
  const d = $("#camDialTicks"); if (d) d.style.transform = `rotate(${(-Math.log2(z / 1) * DIAL_DEG).toFixed(2)}deg)`;
  const r = $("#camDialRead"); if (r) r.innerHTML = `${fmtZ(z)}×<small>${MM(z)} MM</small>`;
  if (pop) { const lab = $("#camZoomLab"); if (lab) { lab.textContent = fmtZ(z) + "×"; lab.classList.remove("pop"); void lab.offsetWidth; lab.classList.add("pop"); } }
}

// the pop-up dial (press and slide on the zoom buttons, or pinch)
const DIAL_DEG = 34;            // degrees of dial rotation per doubling of focal length
function dialSVG() {
  const R = 300, cx = 320, cy = 330, out = [];
  for (let l = Math.log2(ZMIN); l <= Math.log2(ZMAX) + 1e-6; l += 1 / 12) {
    const z = Math.pow(2, l), ang = l * DIAL_DEG, major = PRESETS.some(p => Math.abs(p - z) < 0.02);
    const len = major ? 26 : 12;
    out.push(`<line x1="${cx}" y1="${cy - R}" x2="${cx}" y2="${cy - R + len}" stroke="rgba(255,255,255,${major ? 0.95 : 0.55})" stroke-width="${major ? 3 : 1.6}" transform="rotate(${ang.toFixed(2)} ${cx} ${cy})"/>`);
  }
  for (const p of PRESETS) {
    const ang = Math.log2(p) * DIAL_DEG;
    out.push(`<g transform="rotate(${ang.toFixed(2)} ${cx} ${cy})"><text x="${cx}" y="${cy - R + 56}" text-anchor="middle" fill="#fff" font-size="22" font-weight="700" font-family="Figtree, system-ui">${fmtZ(p)}</text><text x="${cx}" y="${cy - R + 80}" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="14" font-weight="600" letter-spacing="1" font-family="Figtree, system-ui">${MM(p)}MM</text></g>`);
  }
  return `<svg viewBox="0 0 640 360" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><g id="camDialTicks" style="transform-origin:${cx}px ${cy}px">${out.join("")}</g></svg>`;
}
let dialHide = null;
function showDial(on) {
  const d = $("#camDial"); if (!d) return;
  clearTimeout(dialHide);
  if (on) { d.classList.add("open"); $("#camZoom").classList.add("hide"); }
  else dialHide = setTimeout(() => { d.classList.remove("open"); const zz = $("#camZoom"); if (zz) zz.classList.remove("hide"); }, 900);
}
function bindZoomDial() {
  const pill = $("#camZoom"), dial = $("#camDial");
  let start = null, moved = false, holdT = null;
  const px = (e) => (e.touches ? e.touches[0].clientX : e.clientX);
  const down = (e) => {
    if (cam.busy) return;
    start = { x: px(e), z: cam.z, btn: e.target.closest && e.target.closest("button"), fromDial: e.currentTarget === dial }; moved = false;
    if (start.fromDial) { moved = true; showDial(true); }
    else holdT = setTimeout(() => { moved = true; showDial(true); }, 220);   // press-and-hold opens the dial
    // track the finger on the whole window so hiding/moving elements never drops the gesture (iOS)
    window.addEventListener("pointermove", move, { passive: false });
    window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
    window.addEventListener("touchmove", move, { passive: false });
    window.addEventListener("touchend", up); window.addEventListener("touchcancel", up);
    if (e.cancelable) e.preventDefault();
  };
  function move(e) {
    if (!start) return;
    if (e.cancelable) e.preventDefault();
    const dx = px(e) - start.x;
    if (!moved && Math.abs(dx) < 5) return;
    moved = true; clearTimeout(holdT); showDial(true);
    setZoom(start.z * Math.pow(2, -dx / 110), { quiet: true });   // slide left = zoom in, like the iPhone dial
  }
  function up() {
    clearTimeout(holdT);
    for (const [t, f] of [["pointermove", move], ["pointerup", up], ["pointercancel", up], ["touchmove", move], ["touchend", up], ["touchcancel", up]]) window.removeEventListener(t, f);
    if (start && !moved && start.btn) setZoom(+start.btn.dataset.z, { pop: true });
    start = null; showDial(false);
  }
  const opts = { passive: false };
  if (window.PointerEvent) { pill.addEventListener("pointerdown", down, opts); dial.addEventListener("pointerdown", down, opts); }
  else { pill.addEventListener("touchstart", down, opts); dial.addEventListener("touchstart", down, opts); }
  pill.addEventListener("contextmenu", (e) => e.preventDefault());
}

// pinch to zoom: continuous, with the dial shown while pinching
function bindPinch(el) {
  let d0 = 0, z0 = 1;
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  el.addEventListener("touchstart", e => { if (e.touches.length === 2) { d0 = dist(e.touches); z0 = cam.z; showDial(true); } }, { passive: true });
  el.addEventListener("touchmove", e => {
    if (e.touches.length !== 2 || !d0) return;
    setZoom(z0 * dist(e.touches) / d0, { quiet: true });
  }, { passive: true });
  el.addEventListener("touchend", () => { if (d0) showDial(false); d0 = 0; }, { passive: true });
}

function closeCamera() {
  stopLevel();
  document.removeEventListener("keydown", camKeys);
  if (cam.stream) cam.stream.getTracks().forEach(t => t.stop());
  cam.stream = cam.track = null;
  $("#layer").innerHTML = "";
}
function camKeys(e) { if (e.key === "Escape" && !cam.busy) closeCamera(); if ((e.key === " " || e.key === "Enter") && !cam.busy) { e.preventDefault(); shootBracket(); } }

function drawCamera() {
  const x = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  $("#layer").innerHTML = `
  <div class="cam" role="dialog" aria-label="Camera">
    <div class="cam-top"><button class="cam-x" id="camClose" aria-label="Close camera">${x}</button><span class="spacer"></span><span class="cam-badge"><b>HDR</b> · 5 EXP · 3:2</span></div>
    <div class="cam-view">
      <div class="cam-frame" id="camFrame">
        <video id="camVideo" playsinline muted autoplay></video>
        <img class="frozen" id="camFrozen" alt="">
        <div class="cam-grid"></div>
        <div class="cam-flash" id="camFlash"></div>
      </div>
      <div class="cam-level" id="camLevel"><div class="ln"></div></div>
      <div class="cam-tilt num" id="camTilt"></div>
      <div class="cam-turn" id="camTurn">↻ Turn sideways for 3:2 listing photos</div>
      <div class="cam-hold" id="camHold"><i></i>Hold still · <span id="camCount">1</span>/5</div>
      <div class="cam-zoomlab" id="camZoomLab">1×</div>
      <div class="cam-zoom" id="camZoom">${zoomChoices().map(z => `<button data-z="${z}" aria-label="${z}x zoom">${fmtZ(z)}</button>`).join("")}</div>
      <div class="cam-dial" id="camDial"><div class="cam-dial-read" id="camDialRead"></div><div class="cam-dial-ptr"></div>${dialSVG()}</div>
      <div class="cam-ev" id="camEv">${EVS.map(e => `<span>${e > 0 ? "+" + e : e === 0 ? "0" : "−" + (-e)}</span>`).join("")}</div>
      <div class="cam-merge" id="camMerge"><div><div class="fan" id="camFan"></div><div class="lbl">Merging 5 exposures<small>Lining them up and blending the light</small></div></div></div>
    </div>
    <div class="cam-bottom">
      <div class="cam-rooms" id="camRooms">${ROOMS.map(r => `<button class="${state.room === r ? "on" : ""}" data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div>
      <div class="cam-row">
        <div class="cam-stack" id="camStack"></div>
        <button class="shutter" id="camShutter" aria-label="Take photo"></button>
        <div class="cam-note">Handheld OK · fast burst</div>
      </div>
    </div>
  </div>`;
  $("#camClose").onclick = () => { if (!cam.busy) closeCamera(); };
  $("#camShutter").onclick = shootBracket;
  bindZoomDial();
  bindPinch(document.querySelector(".cam-view"));
  paintZoom();
  document.querySelectorAll("#camRooms [data-r]").forEach(b => b.onclick = () => {
    if (cam.busy) return;
    state.room = b.dataset.r;
    document.querySelectorAll("#camRooms button").forEach(x => x.classList.toggle("on", x === b));
  });
  const on = document.querySelector("#camRooms .on"); if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
}

const wait = (ms) => new Promise(r => setTimeout(r, ms));
// 3:2 framing (what realestate.com.au / Domain use): landscape 3:2 when the phone is sideways, 2:3 when upright
function frameAspect() { const v = document.querySelector(".cam-view"); return v && v.clientWidth >= v.clientHeight ? 3 / 2 : 2 / 3; }
function fitFrame() {
  const v = document.querySelector(".cam-view"), f = $("#camFrame"); if (!v || !f) return;
  const W = v.clientWidth, H = v.clientHeight, a = frameAspect();
  let w = W, h = W / a; if (h > H) { h = H; w = H * a; }
  f.style.width = Math.round(w) + "px"; f.style.height = Math.round(h) + "px";
}
window.addEventListener("resize", fitFrame);
const nextFrame = (v) => new Promise(r => v.requestVideoFrameCallback ? v.requestVideoFrameCallback(() => r()) : requestAnimationFrame(() => r()));

async function grabFrame() {
  const v = $("#camVideo");
  if (false) {
    try { const ic = new ImageCapture(cam.track); const b = await ic.takePhoto(); if (b && b.size) return b; } catch {}
  }
  const k = cam.digital || 1;
  let sw = v.videoWidth / k, sh = v.videoHeight / k;
  // centre-crop to 3:2 on the long side, matching what the viewfinder shows
  const want = 1.5, long = Math.max(sw, sh), short = Math.min(sw, sh);
  if (long / short > want) { if (sw >= sh) sw = sh * want; else sh = sw * want; }
  else { if (sw >= sh) sh = sw / want; else sw = sh / want; }
  const c = document.createElement("canvas"); c.width = Math.round(sw); c.height = Math.round(sh);
  c.getContext("2d").drawImage(v, (v.videoWidth - sw) / 2, (v.videoHeight - sh) / 2, sw, sh, 0, 0, c.width, c.height);
  return c;   // raw pixels now; JPEG encoding happens after the burst so frames come back-to-back
}
function thumbOf(c) {
  const t = document.createElement("canvas"), s = 120 / Math.max(c.width, c.height);
  t.width = Math.round(c.width * s); t.height = Math.round(c.height * s);
  t.getContext("2d").drawImage(c, 0, 0, t.width, t.height);
  return t.toDataURL("image/jpeg", 0.7);
}
const toBlob = (c) => new Promise(r => c.toBlob(r, "image/jpeg", 0.92));

async function setEV(ev) {
  if (!cam.evCap || !cam.track) return false;
  const { min, max, step } = cam.evCap;
  const val = Math.max(min, Math.min(max, Math.round(ev / (step || 1)) * (step || 1)));
  try { await cam.track.applyConstraints({ advanced: [{ exposureCompensation: val }] }); return true; } catch { return false; }
}

async function shootBracket() {
  if (cam.busy || !cam.stream) return;
  const v = $("#camVideo");
  if (!v.videoWidth) { toast("Camera is still starting"); return; }
  cam.busy = true; cam.frames = [];
  const shutter = $("#camShutter"), hold = $("#camHold"), stack = $("#camStack"), evs = [...document.querySelectorAll("#camEv span")];
  $("#camZoom").style.opacity = "0"; $("#camZoom").style.pointerEvents = "none";
  shutter.classList.add("busy"); shutter.disabled = true; hold.style.display = "block"; stack.innerHTML = "";
  const thumbs = [];
  try {
    for (let i = 0; i < EVS.length; i++) {
      evs.forEach((e, k) => { e.classList.toggle("on", k === i); e.classList.toggle("done", k < i); });
      $("#camCount").textContent = i + 1;
      const real = await setEV(EVS[i]);
      // viewfinder shows the exposure step even where the browser can't change it
      v.style.filter = `brightness(${Math.pow(2, EVS[i] * 0.45).toFixed(3)})`;
      if (real) await wait(70);          // let the new exposure land (~2 frames)
      await nextFrame(v);                 // a fresh sensor frame, not the same one twice
      const canvas = await grabFrame();
      cam.frames.push(canvas);
      const f = $("#camFlash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
      const u = thumbOf(canvas); thumbs.push(u);
      stack.innerHTML = thumbs.map((t, k) => `<img src="${t}" alt="" style="z-index:${k};transform:rotate(${(k - 2) * 3}deg)">`).join("") + `<span class="n">${thumbs.length}</span>`;
      shutter.style.setProperty("--p", ((i + 1) / EVS.length * 100).toFixed(0));
    }
  } catch (err) {
    cam.busy = false; shutter.classList.remove("busy"); shutter.disabled = false; hold.style.display = "none"; v.style.filter = ""; $("#camZoom").style.opacity = ""; $("#camZoom").style.pointerEvents = "";
    toast("Couldn't take the photo. Try again."); return;
  }
  await setEV(0);
  v.style.filter = "";
  evs.forEach(e => { e.classList.remove("on"); e.classList.add("done"); });
  hold.style.display = "none";
  // merge animation: the five frames fan in to one
  $("#camFan").innerHTML = thumbs.map((t, k) => { const o = k - 2; return `<img src="${t}" alt="" style="--x:${o * 46}px;--r:${o * 7}deg;z-index:${10 - Math.abs(o)};filter:brightness(${Math.pow(2, EVS[k] * 0.45).toFixed(2)})">`; }).join("");
  $("#camMerge").style.display = "grid";
  if (navigator.vibrate) try { navigator.vibrate(20); } catch {}
  await wait(1250);
  const l = cam.listing, room = state.room, frames = await Promise.all(cam.frames.map(toBlob));
  closeCamera();
  addShot(l, frames, room);
  const p = l.photos[l.photos.length - 1];
  if (p) go({ name: "photo", listing: l.id, id: p.id });
}

// level + tilt from the motion sensor (portrait or landscape)
function startLevel() {
  const lvl = $("#camLevel"), tilt = $("#camTilt");
  const onMotion = (e) => {
    const g = e.accelerationIncludingGravity; if (!g || g.x == null) return;
    const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    let ax = g.x, ay = g.y;
    if (ang === 90) { [ax, ay] = [-g.y, g.x]; } else if (ang === -90 || ang === 270) { [ax, ay] = [g.y, -g.x]; } else if (ang === 180) { ax = -g.x; ay = -g.y; }
    const roll = Math.atan2(ax, -ay) * 180 / Math.PI;
    const pitch = Math.atan2(g.z, Math.hypot(ax, ay)) * 180 / Math.PI;
    cam.roll = cam.roll * 0.8 + roll * 0.2; cam.pitch = cam.pitch * 0.8 + pitch * 0.2;
    lvl.style.display = tilt.style.display = "block";
    lvl.style.transform = `translate(-50%,-50%) rotate(${(-cam.roll).toFixed(1)}deg)`;
    const ok = Math.abs(cam.roll) < 1 && Math.abs(cam.pitch) < 2;
    lvl.classList.toggle("ok", Math.abs(cam.roll) < 1);
    tilt.classList.toggle("ok", ok);
    tilt.textContent = ok ? "LEVEL" : `TILT ${Math.abs(cam.pitch).toFixed(0)}°  ·  LEAN ${Math.abs(cam.roll).toFixed(0)}°`;
  };
  cam.motion = onMotion;
  window.addEventListener("devicemotion", onMotion);
}
function stopLevel() { if (cam.motion) window.removeEventListener("devicemotion", cam.motion); cam.motion = null; }

let previewPending = null;
function schedulePreview(p) {
  if (previewPending) return;
  previewPending = requestAnimationFrame(async () => { previewPending = null; await refreshPreview(p); });
}

// ------------------------------------------------------------------ boot: example listing with a real bracket set
(async () => {
  const blobs = SAMPLE.map((d) => {
    const bin = atob(d.split(",")[1]), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new Blob([u], { type: "image/jpeg" });
  });
  const l = { id: uid(), address: "12 Example St, Burswood", example: true, photos: [] };
  state.listings.push(l);
  draw();
  addShot(l, blobs, "Dining");
})();
draw();
</script>
