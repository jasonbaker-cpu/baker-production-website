<style>
:root{--bg:#0f1315;--bg2:#161b1e;--card:#1b2124;--card2:#222a2e;--line:#2c3539;--ink:#f2eee6;--muted:#9aa4a2;--sand:#c9a96e;--sand2:#e0c48d;--sea:#3f7f8f;--hot:#e0795f;--good:#7fc29b;--warn:#e6b85c;

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}

.addbtn{background:var(--sand);color:#1b1408;border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:42px}
main{max-width:820px;margin:0 auto;padding:18px 16px 30px;display:grid;gap:16px}
.h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.h h1{font-family:var(--display);font-size:38px;line-height:1}
.h p{color:var(--muted);font-size:14px;margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card>.t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card>.t h2{font-family:var(--display);font-size:24px}
.card>.t span{font-size:12.5px;color:var(--muted)}
.pad{padding:14px 16px}
.empty{padding:18px 16px;color:var(--muted);font-size:14px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:13px 16px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--card2)}
.item .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .rt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .sub{grid-column:1/-1;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.item .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 8px;margin-left:6px;vertical-align:2px;background:var(--card2);color:var(--sand2);border:1px solid var(--line)}
.tag.hot{color:#fff;background:var(--hot);border-color:var(--hot)}
.tag.sea{color:#dff1f4;background:#24505c;border-color:#24505c}
.tag.good{color:#0f1a13;background:var(--good);border-color:var(--good)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:999px;padding:9px 15px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;min-height:40px}
.btn.pri{background:var(--sand);border-color:var(--sand);color:#1b1408}
.btn.dang{color:#ffb4a2;border-color:#5a3a33}
.btn:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
.stats>div{background:var(--card);padding:14px 16px}
.stats b{display:block;font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:#111;border-color:var(--ink)}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,19,21,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:620px;width:100%}
nav.tabs button{background:none;border:0;color:var(--muted);padding:8px 2px 6px;display:grid;justify-items:center;gap:3px;font-size:11.5px;font-weight:700;cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--sand)}
nav.tabs .dot{position:absolute;top:4px;left:calc(50% + 8px);background:var(--hot);color:#fff;font-size:10px;border-radius:999px;padding:1px 6px}
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;justify-content:flex-end}
.sheet{background:var(--bg2);width:min(560px,100%);height:100%;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;border-bottom:1px solid var(--line)}
.sheet header h2{font-family:var(--display);font-size:28px;line-height:1.05;min-width:0;overflow-wrap:anywhere}
.sheet .body{flex:1;overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
.sheet footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
@media (max-width:640px){.ov{align-items:flex-end}.sheet{height:94%;border-radius:18px 18px 0 0;border-left:0;border-top:1px solid var(--line)}}
.f{display:grid;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.f input,.f select,.f textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);font-weight:500;width:100%}
.f textarea{min-height:80px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.g2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--sand);color:#1b1408;border-color:var(--sand)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.hist{display:grid;gap:8px;font-size:14px}
.hist div{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px}
.hist .d{color:var(--muted)}
.why{color:var(--muted);font-size:13.5px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.box h3{font-family:var(--display);font-size:22px}
.qr{background:#fff;border-radius:12px;padding:10px;width:min(240px,100%);margin:0 auto}
.qr svg{display:block;width:100%;height:auto}
.link{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#111;font-weight:700;padding:11px 16px;border-radius:12px;z-index:40;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg) url() center/cover;display:grid;place-items:center;padding:24px}
.gate .in{max-width:400px;width:100%;display:grid;gap:16px}
.gate h1{font-family:var(--display);font-size:48px;line-height:1}
.gate p{color:var(--muted);margin:0}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:0;border-radius:12px;padding:15px;font-weight:700;font-size:16px;cursor:pointer;min-height:52px}
.gerr{background:rgba(224,121,95,.12);border:1px solid rgba(224,121,95,.5);color:#ffcfc3;border-radius:10px;padding:12px;font-size:14px}
.bar{height:8px;background:var(--card2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sand)}
.notice{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="in">
    <p style="color:var(--sand);letter-spacing:.2em;text-transform:uppercase;font-size:12px;font-weight:700">John O'Brien · Raspa</p>
    <h1>Coastal</h1>
    <p id="gMsg">Checking who you are…</p>
    <button class="gbtn" id="gBtn" type="button" hidden>Sign in with Google</button>

    <button class="btn" id="gOut" type="button" hidden>Use a different account</button>
    <p style="font-size:12.5px">Private to John and Baker Production.</p>
  </div>
</div>
<header class="top"><div class="row"><div class="brand">Coastal<span>John O'Brien · Raspa</span></div><button class="addbtn" data-a="add">+ Add</button></div></header>
<main id="main"></main>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div id="ov"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="qrcode.js"></script>
<script type="module">
const V="10.12.2",BASE="https://www.gstatic.com/firebasejs/"+V+"/";
const CFG={apiKey:"AIzaSyC0ES1GZsgtl4_vC6Dpp-4aG-Iy4DtXlCE",authDomain:"baker-leads.firebaseapp.com",projectId:"baker-leads",storageBucket:"baker-leads.firebasestorage.app",messagingSenderId:"544396406010",appId:"1:544396406010:web:9e7289e545fa0a0c8a6d43"};
const BOOK="john-obrien",ROOT="bb/"+BOOK,ADMINS=["admin@bakerproduction.com","jasonbaker@bakerproduction.com"];
const SITE=location.origin+location.pathname.replace(/app-r8m2\/?.*$/,"");
const SUBS=["Coogee","North Coogee","Port Coogee","Lake Coogee","Beaconsfield","South Fremantle","Hamilton Hill","Spearwood","Munster","Bibra Lake"];
const TYPES=["House","Two-storey house","Apartment","Townhouse","Waterfront","Land"];
const VIEWS=["Ocean","Marina","Park","None"];
const STAGES=["New lead","Appraised","Proposal sent","Listed","Under offer","Sold","Not now"];
const BANDS=[["Under $1m",0,1e6],["$1m–$1.5m",1e6,1.5e6],["$1.5m–$2m",1.5e6,2e6],["$2m–$3m",2e6,3e6],["$3m+",3e6,1e12]];
const WANTS=["Ocean views","Marina berth","Walk to the beach","Pool","Single level","Lock and leave"];
const TOUCH=["Call","Text","Email","Met","Appraisal","Note"];
const S={tab:"today",inbox:[],vendors:[],buyers:[],campaigns:[],visits:[],user:null,book:{members:[],names:{}},band:"All",stage:"Active",q:"",db:null,ready:false};
let F,A,fdb,auth,subs=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>ymd(new Date());
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d);};
const nice=s=>{if(!s)return "–";const d=new Date(s.length>10?s:s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"numeric",month:"short"});};
const money=n=>!n?"–":n<1000?"$"+Math.round(n):n>=1e6?"$"+(n/1e6).toFixed(n%1e6?2:0).replace(/0$/,"").replace(/\.$/,"")+"m":"$"+Math.round(n/1000)+"k";
const tel=p=>{let d=String(p||"").replace(/[^\d+]/g,"");if(/^4\d{8}$/.test(d))d="0"+d;return d;};
const last9=p=>{const d=tel(p).replace(/^\+?61/,"0");return d.length>=8?d.slice(-9):"";};
const first=n=>String(n||"").trim().split(/\s+/)[0]||"there";
const mins=iso=>{const t=Date.parse(iso||"");return isNaN(t)?null:Math.max(0,Math.round((Date.now()-t)/6e4));};
const waited=m=>m==null?"":m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" hr ago":Math.round(m/1440)+" days ago";
const band=label=>BANDS.find(b=>b[0]===label);
function parseMoney(s){s=String(s||"").toLowerCase().replace(/[$,\s]/g,"");const m=s.match(/(\d+(?:\.\d+)?)(m|k)?/);if(!m)return null;let n=parseFloat(m[1]);if(m[2]==="m"||(!m[2]&&n<20))n*=1e6;else if(m[2]==="k"||(!m[2]&&n<20000))n*=1e3;return Math.round(n);}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200);}
function err(e){console.error(e);toast(e&&e.code==="permission-denied"?"You don't have access to change this.":"That didn't save. Check your signal and try again.");}

/* ---------- data ---------- */
const col=c=>F.collection(fdb,ROOT+"/"+c);
const put=(c,id,d)=>{d.updatedAt=new Date().toISOString();const r=id?F.doc(col(c),id):F.doc(col(c));return F.setDoc(r,d,{merge:!!id}).then(()=>r.id);};
const del=(c,id)=>F.deleteDoc(F.doc(col(c),id));
const findPhone=(p,except)=>{const k=last9(p);if(!k)return null;for(const [c,L] of [["vendors",S.vendors],["buyers",S.buyers]]){const r=L.find(x=>x.id!==except&&last9(x.phone)===k);if(r)return {c,r};}return null;};

/* ---------- matching ---------- */
function fit(b,v){
  if(!v||!b||(b.status&&b.status!=="Active"))return 0;
  let s=0;const bd=band(b.budget),val=v.estValue||0;
  if(val&&bd){if(val<bd[1]*0.9||val>bd[2]*1.08)return 0;s+=40;}else if(!val)s+=15;
  if(b.suburbs&&b.suburbs.length){if(!v.suburb||!b.suburbs.includes(v.suburb))return 0;s+=30;}else s+=10;
  if(b.type&&v.type){const ap=x=>x==="Apartment";if(ap(b.type)!==ap(v.type))return 0;if(b.type===v.type)s+=10;}
  const w=b.wants||[];if(w.includes("Ocean views")&&v.views==="Ocean")s+=15;if(w.includes("Marina berth")&&v.views==="Marina")s+=15;
  if(b.beds&&v.beds&&v.beds<b.beds)s-=15;
  return Math.max(0,Math.min(100,s));
}
const buyersFor=v=>S.buyers.map(b=>({b,s:fit(b,v)})).filter(x=>x.s>=50).sort((a,b)=>b.s-a.s);
const vendorsFor=b=>S.vendors.filter(v=>["Appraised","Proposal sent","Listed","Under offer"].includes(v.stage)).map(v=>({v,s:fit(b,v)})).filter(x=>x.s>=50).sort((a,b)=>b.s-a.s);

/* ---------- reels ---------- */
function srcOf(r){return r.src||r.source||"";}
function reelStats(code){
  const since=new Date(Date.now()-90*864e5).toISOString();
  const vis=S.visits.filter(x=>x.c===code&&(x.at||"")>=since).length;
  const P={};[...S.inbox,...S.vendors,...S.buyers].filter(r=>srcOf(r)===code).forEach(r=>{const k=last9(r.phone)||r.id;P[k]=P[k]||{s:false};if(r.kind==="valuation"||r.stage)P[k].s=true;});
  const L=Object.values(P),sellers=L.filter(x=>x.s).length;
  return {vis,leads:L.length,sellers,buyers:L.length-sellers};
}

/* ---------- views ---------- */
const ICON={today:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',vendors:'<path d="M4 21V9l8-5 8 5v12M9 21v-6h6v6"/>',register:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.7c1.6.8 2.6 2.6 3 5.3"/>',reels:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/>',more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'};
function tabs(){
  const n=S.inbox.length;
  $("#tabs").innerHTML=[["today","Today"],["vendors","Vendors"],["register","Register"],["reels","Reels"],["more","More"]].map(([k,l])=>`<button data-tab="${k}" ${S.tab===k?'aria-current="page"':""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${l}${k==="today"&&n?`<span class="dot">${n}</span>`:""}</button>`).join("");
  document.title=(n?"("+n+") ":"")+"Coastal · John O'Brien";
}
function render(){
  tabs();
  if(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&$("#main").contains(document.activeElement)&&S.tab!=="today")return;
  const v={today:vToday,vendors:vVendors,register:vRegister,reels:vReels,more:vMore}[S.tab]||vToday;
  $("#main").innerHTML=S.ready?v():'<div class="empty">Loading…</div>';
}
function leadRow(r){
  const isV=r.kind==="valuation",m=mins(r.createdAt),ph=tel(r.phone);
  const sub=isV?[r.address,r.suburb,r.propertyType,r.views&&r.views!=="None"?r.views+" views":"",r.timeframe,r.offMarket==="yes"?"wants off-market":""]:[r.budget,r.suburbs,r.propertyType,r.bedrooms?r.bedrooms+" bed":"",r.wants,r.finance,r.timeframe];
  const sms=isV?`Hi ${first(r.name)}, it's John O'Brien from Raspa. Thanks for asking for a private valuation on ${r.address||"your home"}. Is now a good time for a quick call, or is later today better?`
    :`Hi ${first(r.name)}, John O'Brien from Raspa here. Thanks for joining my private register. I'll send you homes that fit before they're advertised. So I get it right, what's the one thing your next home must have?`;
  return `<div class="item" style="cursor:default"><span class="nm">${esc(r.name||"No name")}<span class="tag ${isV?"hot":"sea"}">${isV?"valuation":"register"}</span>${m!=null&&m<60?'<span class="tag hot">call now</span>':""}</span><span class="rt">${esc(r.phone||"")}</span>
  <span class="sub">${esc(sub.filter(Boolean).join(" · "))}${srcOf(r)&&srcOf(r)!=="direct"?" · from "+esc(srcOf(r)):""} · ${esc(waited(m))}</span>
  <span class="acts">${ph?`<a class="btn pri" href="tel:${esc(ph)}">Call</a><a class="btn" href="sms:${esc(ph)}?&body=${encodeURIComponent(sms)}">Text</a>`:""}<button class="btn" data-a="accept" data-id="${esc(r.id)}">Save</button><button class="btn" data-a="dismiss" data-id="${esc(r.id)}">Dismiss</button></span></div>`;
}
function vToday(){
  const t=today(),wk=addDays(-6);
  const inbox=[...S.inbox].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  const due=[...S.vendors.filter(v=>v.next&&v.next<=t&&!["Sold","Not now"].includes(v.stage)).map(r=>["vendors",r]),...S.buyers.filter(b=>b.next&&b.next<=t&&(b.status||"Active")==="Active").map(r=>["buyers",r])].sort((a,b)=>a[1].next.localeCompare(b[1].next));

  let d;
  if(kind==="v")d={name,phone,email:val("eEmail"),address:val("eAddr"),suburb:val("eSub"),type:val("eType"),beds:parseInt(val("eBeds"))||null,estValue:parseMoney(val("eVal")),views:chipVal("eViews"),stage:chipVal("eStage")||"New lead",timeframe:val("eTime"),next:val("eNext"),offMarket:chipVal("eOff")==="Yes",notes:val("eNotes")};
  else d={name,phone,email:val("eEmail"),budget:chipVal("eBand"),suburbs:chipVal("eSubs",true),type:val("eType"),beds:parseInt(val("eBeds"))||null,wants:chipVal("eWants",true),finance:val("eFin"),timeframe:val("eTime"),status:val("eStatus")||"Active",next:val("eNext"),notes:val("eNotes")};
  if(!id){d.createdAt=new Date().toISOString();d.log=[];d.src="manual";}
  put(kind==="v"?"vendors":"buyers",id,d).then(nid=>{toast(dup&&!id?`Saved. Note: ${dup.r.name||"someone"} already has that mobile.`:"Saved");close();if(kind==="v")openV(id||nid);else openB(id||nid);}).catch(err);
}
function openC(id){
  const c=id?S.campaigns.find(x=>x.id===id):null;
  if(!c){sheet("New reel link",`<p class="why">Make one before you boost a reel. Put the link in the caption, the ad's button and your bio while it runs.</p><label class="f">Reel name<input id="cName" placeholder="e.g. Port Coogee marina walkthrough"></label><div class="f">Send people to${chipRow("cPage",["Private valuation","Private register"],"Private valuation")}</div><div class="g2"><label class="f">Ad spend so far ($)<input id="cSpend" inputmode="decimal" placeholder="0"></label><label class="f">Started<input id="cStart" type="date" value="${today()}"></label></div><label class="f">Instagram reel link (optional)<input id="cUrl" placeholder="https://www.instagram.com/reel/…"></label>`,`<button class="btn pri" data-a="save-c">Create link</button>`);return;}
  const url=SITE+(c.page==="register"?"register.html":"")+"?src="+encodeURIComponent(c.code),s=reelStats(c.code),sp=+c.spend||0;let qr="";
  try{const q=qrcode(0,"M");q.addData(url);q.make();qr=q.createSvgTag({cellSize:5,margin:2,scalable:true});}catch(e){}
  sheet(c.name,`<div class="card"><div class="stats"><div><b>${s.vis}</b><span>visits</span></div><div><b>${s.leads}</b><span>leads</span></div><div><b>${money(sp)}</b><span>spent</span></div><div><b>${s.leads?"$"+Math.round(sp/s.leads):"–"}</b><span>per lead</span></div></div></div>
  <div class="box"><h3>Your link</h3><input class="link" id="cLink" readonly value="${esc(url)}"><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn pri" data-a="copy" data-src="cLink">Copy link</button><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open</a>${c.url?`<a class="btn" href="${esc(c.url)}" target="_blank" rel="noopener">View reel</a>`:""}</div>${qr?`<div class="qr">${qr}</div>`:""}</div>
  <div class="box"><h3>Update spend</h3><p class="why">Copy the total spent from Instagram's boost results.</p><div style="display:flex;gap:8px"><input class="link" id="cSp" inputmode="decimal" value="${sp||""}" placeholder="$ total"><button class="btn pri" data-a="spend" data-id="${esc(c.id)}">Save</button></div></div>
  <p class="why">${s.sellers} seller lead${s.sellers===1?"":"s"} and ${s.buyers} buyer lead${s.buyers===1?"":"s"} came from this reel. Visits count the last 90 days.</p>`,`<button class="btn dang" data-a="del" data-c="campaigns" data-id="${esc(c.id)}">Delete</button>`);
}
function saveC(){
  const name=val("cName");if(!name){toast("Give the reel a name.");return;}
  const code=(name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30)||"reel")+"-"+Math.random().toString(36).slice(2,5);
  put("campaigns",null,{name,code,page:chipVal("cPage")==="Private register"?"register":"valuation",spend:parseFloat(val("cSpend").replace(/[$,]/g,""))||0,start:val("cStart")||today(),url:val("cUrl"),createdAt:new Date().toISOString()}).then(id=>{close();S.tab="reels";render();openC(id);toast("Reel link ready. Copy it into the reel.");}).catch(err);
}
function accept(id){
  const r=S.inbox.find(x=>x.id===id);if(!r)return;const now=new Date().toISOString(),src=srcOf(r);
  const note=(r.kind==="valuation"?"Private valuation request":"Joined private register")+(src&&src!=="direct"?" from "+src:"");
  const dup=findPhone(r.phone);const jobs=[];
  if(dup){const L=(dup.r.log||[]).concat([{d:today(),k:"Website",n:note}]).slice(-100);jobs.push(put(dup.c,dup.r.id,{log:L}));}
  if(r.kind==="valuation"&&!(dup&&dup.c==="vendors"))jobs.push(put("vendors",null,{name:r.name||"",phone:r.phone||"",email:r.email||"",address:r.address||"",suburb:SUBS.includes(r.suburb)?r.suburb:r.suburb||"",type:r.propertyType||"",views:r.views||"None",timeframe:r.timeframe||"",offMarket:r.offMarket==="yes",stage:"New lead",next:today(),src,notes:"",log:[{d:today(),k:"Website",n:note}],createdAt:r.createdAt||now}));
  if(r.kind==="register"&&!(dup&&dup.c==="buyers")){
    jobs.push(put("buyers",null,{name:r.name||"",phone:r.phone||"",email:r.email||"",budget:r.budget||"",suburbs:String(r.suburbs||"").split(/,\s*/).filter(Boolean),type:r.propertyType||"",beds:parseInt(r.bedrooms)||null,wants:String(r.wants||"").split(/,\s*/).filter(Boolean),finance:r.finance||"",timeframe:r.timeframe||"",status:"Active",next:addDays(2),src,notes:"",log:[{d:today(),k:"Website",n:note}],createdAt:r.createdAt||now}));
    if(r.finance==="Need to sell first"&&!S.vendors.some(v=>last9(v.phone)===last9(r.phone)))jobs.push(put("vendors",null,{name:r.name||"",phone:r.phone||"",email:r.email||"",stage:"New lead",next:today(),src,views:"None",notes:"Joined the register and needs to sell first. Offer a private valuation.",log:[{d:today(),k:"Website",n:note}],createdAt:now}));
  }
  Promise.all(jobs).then(()=>del("inbox",id)).then(()=>toast(dup?`${dup.r.name||"They"}'re already in the app. Added to their history.`:r.kind==="valuation"?"Saved to Vendors":"Saved to the register")).catch(err);
}
function csv(c){
  const L=c==="vendors"?S.vendors:S.buyers;const keys=c==="vendors"?["name","phone","email","address","suburb","type","beds","views","estValue","stage","timeframe","offMarket","next","src","notes"]:["name","phone","email","budget","suburbs","type","beds","wants","finance","timeframe","status","next","src","notes"];
  const q=v=>'"'+String(Array.isArray(v)?v.join("; "):v==null?"":v).replace(/"/g,'""')+'"';
  const txt=[keys.join(","),...L.map(r=>keys.map(k=>q(r[k])).join(","))].join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));a.download="john-obrien-"+c+"-"+today()+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}

/* ---------- events ---------- */
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const p=e.target.selectionStart;render();const q=$("#q");if(q){q.focus();q.setSelectionRange(p,p);}}});
document.addEventListener("click",e=>{
  const ch=e.target.closest("[data-chip]");if(ch){const g=ch.closest("[data-chips]");if(!g.dataset.multi)g.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c===ch)));else ch.setAttribute("aria-pressed",String(ch.getAttribute("aria-pressed")!=="true"));return;}
  const tb=e.target.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;S.q="";window.scrollTo(0,0);render();return;}
  const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=t.dataset.id;
  if(a==="close-bg"&&e.target!==t)return;
  ({
    "close":close,"close-bg":close,
    "add":()=>sheet("Add",`<button class="item" data-a="new-v"><span class="nm">Vendor</span><span class="sub">An owner who might sell</span></button><button class="item" data-a="new-b"><span class="nm">Register buyer</span><span class="sub">A buyer for coastal homes</span></button><button class="item" data-a="new-c"><span class="nm">Reel link</span><span class="sub">Before you boost a reel</span></button>`),
    "new-v":()=>editV(null),"new-b":()=>editB(null),"new-c":()=>openC(null),
    "open-v":()=>openV(id),"open-b":()=>openB(id),"open-c":()=>openC(id),
    "edit-v":()=>editV(id),"edit-b":()=>editB(id),"save-v":()=>saveEdit("v"),"save-b":()=>saveEdit("b"),"save-c":saveC,
    "accept":()=>accept(id),"dismiss":()=>del("inbox",id).then(()=>toast("Dismissed")).catch(err),
    "stage":()=>{S.stage=t.dataset.v;render();},"band":()=>{S.band=t.dataset.v;render();},
    "set-stage":()=>{const st=chipVal("vst"),v=S.vendors.find(x=>x.id===id);put("vendors",id,{stage:st,log:(v.log||[]).concat([{d:today(),k:"Stage",n:st}]).slice(-100)}).then(()=>{toast("Stage: "+st);openV(id);}).catch(err);},
    "nx":()=>{$("#lnext").value=addDays(+t.dataset.v);},
    "log":()=>{const c=t.dataset.c,L=c==="vendors"?S.vendors:S.buyers,r=L.find(x=>x.id===id);put(c,id,{log:(r.log||[]).concat([{d:today(),k:chipVal("lk")||"Call",n:val("ln")}]).slice(-100),next:val("lnext")}).then(()=>{toast("Logged");c==="vendors"?openV(id):openB(id);}).catch(err);},
    "del":()=>{if(t.dataset.sure!=="1"){t.dataset.sure="1";t.textContent="Tap again to delete";return;}del(t.dataset.c,id).then(()=>{close();toast("Deleted");}).catch(err);},
    "spend":()=>put("campaigns",id,{spend:parseFloat(val("cSp").replace(/[$,]/g,""))||0}).then(()=>{toast("Spend saved");openC(id);}).catch(err),
    "copy":()=>{const s=document.getElementById(t.dataset.src);if(!s)return;(navigator.clipboard?navigator.clipboard.writeText(s.value):Promise.reject()).then(()=>toast("Copied"),()=>{s.select();document.execCommand("copy");toast("Copied");});},
    "csv":()=>csv(t.dataset.v),
    "signout":()=>A.signOut(auth),
    "mem-add":()=>{const em=val("mE").toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast("Enter a full email.");return;}const M=[...new Set([...(S.book.members||[]),em])],N={...(S.book.names||{}),[em]:val("mN")};F.setDoc(F.doc(fdb,ROOT),{members:M,names:N},{merge:true}).then(()=>toast("Access given to "+em)).catch(err);},
    "mem-del":()=>{const em=t.dataset.v,N={...(S.book.names||{})};delete N[em];F.setDoc(F.doc(fdb,ROOT),{members:(S.book.members||[]).filter(x=>x!==em),names:N},{merge:true}).then(()=>toast("Removed")).catch(err);}
  }[a]||(()=>{}))();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
setInterval(()=>{if(S.tab==="today"&&!$("#ov").innerHTML)render();},60000);

/* ---------- boot ---------- */
function gate(msg,btn,er,out){$("#gate").hidden=false;$("#gMsg").textContent=msg;$("#gBtn").hidden=!btn;$("#gErr").hidden=!er;$("#gErr").textContent=er||"";$("#gOut").hidden=!out;}
$("#gBtn").onclick=async()=>{$("#gBtn").disabled=true;const p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});try{await A.signInWithPopup(auth,p);}catch(e){if(/popup|operation-not-supported|web-storage/.test(e.code||""))await A.signInWithRedirect(auth,p);else{$("#gBtn").disabled=false;gate("Sign in to open Coastal.",true,"Sign-in didn't finish. Try again.");}}};
$("#gOut").onclick=()=>A.signOut(auth);
const rows=s=>s.docs.map(d=>({id:d.id,...d.data()}));
try{
  const {initializeApp}=await import(BASE+"firebase-app.js");A=await import(BASE+"firebase-auth.js");F=await import(BASE+"firebase-firestore.js");
  const app=initializeApp(CFG,"coastal");auth=A.getAuth(app);
  try{fdb=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});}catch(e){fdb=F.getFirestore(app);}
  A.getRedirectResult(auth).catch(()=>{});
  A.onAuthStateChanged(auth,async u=>{
    subs.forEach(f=>{try{f();}catch(e){}});subs=[];S.ready=false;
    if(!u){gate("Sign in with the Google account Jason gave access to.",true);return;}
    const email=(u.email||"").toLowerCase(),admin=ADMINS.includes(email);
    try{
      const ref=F.doc(fdb,ROOT);let s=await F.getDoc(ref);
      if(!s.exists()&&admin){await F.setDoc(ref,{members:[],names:{},createdAt:new Date().toISOString()});s=await F.getDoc(ref);}
      const data=s.exists()?s.data():null;
      if(!data||(!admin&&!(data.members||[]).includes(email))){gate("This account doesn't have access yet.",false,email+" isn't on the access list. Ask Jason to add it.",true);return;}
      $("#gate").hidden=true;S.user={email,admin};
      let got=0;const need=5,ok=()=>{if(++got>=need){S.ready=true;}render();};
      const on=(c,k,q)=>subs.push(F.onSnapshot(q||col(c),x=>{S[k]=rows(x);ok();},e=>{if(e.code==="permission-denied")gate("Your access has changed.",false,"Ask Jason to check you're on the access list.",true);}));
      on("inbox","inbox");on("vendors","vendors");on("buyers","buyers");on("campaigns","campaigns");
      on("visits","visits",F.query(col("visits"),F.where("at",">=",new Date(Date.now()-90*864e5).toISOString())));
      subs.push(F.onSnapshot(ref,x=>{S.book=x.exists()?x.data():{members:[],names:{}};if(S.tab==="more")render();}));
      render();
    }catch(e){if(e.code==="permission-denied")gate("This account doesn't have access yet.",false,email+" isn't on the access list. Ask Jason to add it.",true);else gate("Couldn't open Coastal.",false,"Something went wrong ("+(e.code||e.message)+"). Reload to try again.",true);}
  });
}catch(e){gate("Couldn't load.",false,"Check your internet connection, then reload.");}
if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
